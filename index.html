ais sobre a importância de ser o templo do Espírito Santo, tendo hábitos saudáveis e uma vida equilibrada, conforme a Bíblia ensina. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":52,"blocks":["ESTUDO ADICIONAL","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 4)","Sábado: Formação da Igreja Adventista do Sétimo Dia (página 96)","Domingo: Funcionamento da Igreja Adventista do Sétimo Dia (página 97)","Segunda-feira: Os ministérios e as atividades da igreja local (página 98)","Terça-feira: Somos uma família (página 99)","Quarta-feira: Cerimônias da igreja (página 100)","Quinta-feira: Instituições adventistas (página 101)","Sexta-feira: Adventistas do Sétimo Dia (página 102)","MISSÃO","Ore todos os dias pelos amigos e familiares que você deseja ver em seu batismo. Compartilhe este estudo bíblico com eles para que um dia também tomem a decisão por Jesus e pelo batismo. Amigos Pedidos de oração Em querovidaesaude.com e revistavidaesaude.com.br você encontra mais conteúdos para aprender como cuidar melhor de seu corpo e de sua mente."]}]},{"id":"estudo-17","title":"Estudo 17 — Jesus e a Missão da Igreja","type":"study","pages":[{"page":53,"blocks":["Voltar ao menu53 Sua vez de procurar: Lucas 5:1 a 11. Leia a história da pesca maravilhosa. Alguns dos discípulos de Jesus eram pescadores. Homens simples, mas acostumados à dura atividade do mar. A pesca também era seu meio de sobrevivência. Quando havia peixe, eles tinham condições de manter a família. Naquele dia, além do cuidado do Pai para com eles, Cristo queria lhes ensinar uma lição mais profunda. Os discípulos não haviam conseguido nada, mas Jesus disse a Pedro que voltasse e lançasse as redes novamente. Talvez Pedro tivesse respirado fundo e pensando consigo mesmo: “O que esse homem entende de pescaria?” Pedro, porém, confiava em Jesus. O que ele não esperava era que essa confiança lhe renderia muitíssimo mais do que ele poderia imaginar. Ao puxar, as redes quase se rasgaram de tanto peixe! Diante do maravilhoso milagre, restou a esse discípulo se prostrar aos pés de Cristo e aceitar imediatamente o convite do Mestre. Qual foi o convite de Jesus a Pedro que também é feito a você hoje? Q qual é a razão de sua vida? A resposta a essa questão define qual é sua","missão. Viver sem uma missão é como caminhar sem rumo. Acima de","tantos objetivos nobres, que têm sua razão de existir, há uma missão que vale a pena o investimento de todos os nossos recursos: a salvação de pessoas. Essa é a solução definitiva para os dramas humanos e todas as formas de injustiça. Essa missão é uma tarefa de grande responsabilidade entregue por Deus a cada um de Seus seguidores. De fato, Jesus nos atribuiu uma importante","missão: “Vão e façam discípulos” (Mateus 28:19). Todos que são chamados ao","reino de Deus devem sair em busca de novas pessoas, ensinando-as sobre o Salvador. Embora essa pareça uma missão muito difícil, não devemos temer. Recebemos de Cristo a maravilhosa promessa de que Ele vai à nossa frente. Nosso Consolador, o Espírito Santo, está conosco todos os dias em nossa","missão, “até o fim dos tempos” (Mateus 28:20).","missão da igreja","Jesus e a","ESTUDO 17","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":54,"blocks":["1. Que missão Jesus nos confiou?","a)  Atos 1:8: “Mas vocês [...] serão Minhas   tanto em","Jerusalém como em toda a Judeia e Samaria até os confins da Terra.”","b) 2 Coríntios 5:18: “Cristo [...] nos deu o ministério da  .”","c) 2 Coríntios 5:20: “Somos   em nome de Cristo.”","2. Qual é a maior alegria de um servo de Deus? 3 João 4","3. Qual é o chamado de todo filho de Deus? Atos 13:47","4. Como nossa vida pode ser um testemunho ao mundo? João 13:34 e 35","5. Por que devemos testemunhar? 2 Coríntios 5:17 e 20","6. O que Deus nos concede a fim de testemunharmos? Efésios 4:8 e 11","7. Como testemunhar aos que não conhecem Jesus? Colossenses 4:2, 5 e 6","Pontos a considerar","•  Forme uma dupla missionária com seu instrutor bíblico e juntos orem pela","salvação de cinco amigos.","• Ofereça ajuda a essas pessoas.","•  Ore com esses cinco amigos e compartilhe com eles uma revista ou um","livro sobre Deus. Acesse: livro.esperanca.com.br","• Compartilhe este curso bíblico: “Jesus, Restaurador da Vida”.","Compromisso de fé: Entendi que a maior alegria de Deus é saber que Seus filhos andam na verdade. Portanto, quero honrar o Senhor levando pessoas a Ele. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":55,"blocks":["ATIVIDADES ADICIONAIS","Escreva e compartilhe seu testemunho de vida, que pode ser dividido em quatro partes:","• Minha história: Como era minha vida antes de conhecer Jesus.","• Minha maior necessidade: Como percebi que precisava de Jesus.","• Minha maior alegria: Como dediquei minha vida a Jesus.","• Lição de vida: A diferença que Jesus faz em minha vida a cada dia.","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 5)","Sábado: Por que ser mordomo de Deus (página 105)","Domingo: Administração e missão da igreja (página 106)","Segunda-feira: Dízimos: base bíblica e aspectos práticos (página 107)","Terça-feira: Seriedade no uso e na aplicação dos recursos (página 108)","Quarta-feira: Ofertas regulares e proporcionais (página 109)","Quinta-feira: Fidelidade na prática (página 110)","Sexta-feira: Cuidando das finanças (página 111)","MISSÃO","Ore todos os dias pelos amigos e familiares que você deseja ver em seu batismo. Compartilhe este estudo bíblico com eles para que um dia também tomem a decisão por Jesus e pelo batismo. Amigos Pedidos de oração CONHEÇA OS ARTIGOS DO SITE esperanca.com.br Ore com os cinco amigos que você deseja evangelizar, compartilhe uma revista ou um livro com eles. Veja algumas opções em livro.esperanca.com.br Existe oportunidade para todos se envolverem na missão, independentemente da idade. No Clube de Desbravadores, os meninos e meninas de 10 a 15 anos podem participar de atividades missionárias, físicas e sociais. Descubra como fazer parte em adv.st/osdesbravadores"]}]},{"id":"estudo-18","title":"Estudo 18 — Jesus e o Dom de Profecia","type":"study","pages":[{"page":56,"blocks":["Sua vez de procurar: Lucas 20:9 a 18. Leia “A parábola dos lavradores maus”. Certa vez, Jesus Se encontrou com os doutores da lei. Eles eram chamados assim por serem profundos estudiosos das Escrituras Sagradas. Porém, a vaidade do conhecimento dava a esses homens uma falsa sensação de autoridade. Os doutores da lei se sentiam donos de Deus. Consideravamse os únicos capazes de entender e ensinar a verdade revelada. Contudo, muitas vezes eles se negavam a repartir essa verdade com o povo comum. Desprezaram a mensagem dos profetas que Deus havia enviado, os servos da parábola, e por fim mataram Jesus. No entanto, acabar com o mensageiro não significa destruir a mensagem. Por que muitos rejeitam os mensageiros de Deus? Q uando ouvimos falar em profecia, pensamos em predições. Desde a Antiguidade, sábios e estudiosos buscavam na natureza padrões que, segundo eles, escondiam os segredos do futuro. Ainda hoje, milhões de pessoas acreditam que o destino está escrito nas estrelas e até recorrem a práticas místicas. Muitos também confiam em análises e previsões, que são suposições sobre o que o amanhã trará com base no que vemos hoje. Porém, a Bíblia é clara: o futuro pertence a Deus. Como todo-poderoso e onisciente Deus do Universo, Ele conhece o futuro e somente Ele pode revelá-lo. Para o tempo presente, Deus tem mensagens proféticas seguras para nos guiar, assim como no passado. Para nos ajudar a saber em quem acreditar, a Bíblia estabelece critérios para identificação do verdadeiro profeta. Unicamente confiando em Seus profetas podemos prosperar (2 Crônicas 20:20). Vamos estudar sobre o dom de profecia. dom de profecia","JESUS E O","ESTUDO 18","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":57,"blocks":["1. A respeito de quem Moisés e os profetas escreveram? João 1:45","2. Antes de Deus realizar Suas obras na Terra, o que Ele faz? Amós 3:7","Revela o que vai fazer aos profetas              Age de surpresa","3. De que modo Deus revela Suas mensagens aos profetas? Números 12:6","Por meio de pessoas               Por meio de visões e sonhos","4. Qual o propósito de Deus ao chamar os profetas? Oseias 12:13","Conduzir e guardar Seu povo              Somente informar sobre o futuro","5. Quais são as duas características da igreja verdadeira? Apocalipse 12:17","6. O que é o testemunho de Jesus? Apocalipse 19:10","7. Um dos dons espirituais é o dom de profecia. Leia Efésios 4:8 a 16 e responda:","a) O que Ele concedeu aos homens? v. 8:","b) Quem escolhe os profetas? v.11:","c) Para que é dado o dom de profecia? v.12 a 14:","d) De que modo a verdade e o crescimento devem ocorrer? v.15 e 16:","8. O que Jesus disse que haveria nos últimos dias? Mateus 24:24","9. Quais são as características de um profeta verdadeiro?","a) 1a característica (1João 4:1 e 2) –","b) 2a característica (Mateus 7:15 e 16) –","c) 3a característica (Isaías 8:19 e 20) –","d) 4a característica (Deuteronômio 18:21 e 22) –","10. Deus também chamou mulheres para serem profetisas?","a) Juízes 4:4 –","b) Lucas 2:36 –","11. Qual é o segredo para nossa segurança e prosperidade? 2 Crônicas 20:20","Compromisso de fé: Creio que Deus enviou profetas ao longo dos tempos para revelar Sua vontade. Portanto, aceito a revelação de Jesus mediante os profetas verdadeiros como vinda de Deus. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":58,"blocks":["ESTUDO ADICIONAL","Por que a Igreja Adventista do Sétimo Dia aceita a manifestação do dom de profecia em Ellen G. White? Ellen White passou em todos os testes que provam a veracidade de um profeta: 1 João 4:1 a 3: Em seu ministério, Ellen White exaltou Jesus Cristo como a segunda pessoa da Divindade que Se tornou homem, morreu em nosso lugar, ressuscitou, intercede por nós e em breve voltará. Isaías 8:20: Ela escreveu mais de 100 mil páginas, sendo uma das autoras mais traduzidas da história. Seus escritos estão em perfeita harmonia com a Bíblia, despertando o interesse dos leitores para a Palavra de Deus. Mateus 7:20: Em seu longo ministério (de 1844 a 1915), ela produziu frutos de um cristianismo autêntico e verdadeiro, o que foi reconhecido tanto pela igreja quanto pela sociedade. Daniel 10:16 e 17: Assim como acontecia com os profetas bíblicos, Ellen White experimentava uma sequência de fenômenos físicos durante suas visões. Algumas visões poderiam durar horas. Nesse tempo, ela não respirava. Centenas de testemunhas presenciaram os fenômenos, inclusive médicos que comprovaram a veracidade dos fatos. Deuteronômio 18:22: Ellen White fez várias profecias. Todas se cumpriram conforme o que ela anunciou, entre elas, a ascensão americana. Por diversas vezes, a sociedade reconheceu o valor espiritual e moral apontado por Ellen White. Em 1878, o livro American Biographical History of Eminent and Self-Made Men of the State of Michigan  registrou: “A senhora White é uma mulher singularmente equilibrada. Seus traços predominantes são benevolência, espiritualidade, consciência e idealismo. Suas qualidades pessoais são de molde a granjear a mais viva amizade de todos aqueles com quem entra em contato e lhes inspirar a máxima confiança em sua sinceridade.” No ano de 2014, a Smithsonian Magazine listou Ellen White entre os 100 americanos mais importantes de todos os tempos, ao lado de grandes personalidades como Abraham Lincoln, George Washington, Martin Luther King e Thomas Jefferson.","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 6)","Sábado: Filhos do Rei (página 113)","Domingo: Dez princípios eternos (página 114)","Segunda-feira: Saúde e modéstia (página 115)","Terça-feira: Amor e fidelidade (página 116)","Quarta-feira: Pureza e integridade (página 117)","Quinta-feira: Novos problemas (página 118)","Sexta-feira: Poder para ser fiel (página 119)","MISSÃO","Ore todos os dias pelos amigos e familiares que você deseja ver em seu batismo. Compartilhe este estudo bíblico com eles para que também tomem a decisão por Jesus e pelo batismo. Amigos Pedidos de oração"]}]},{"id":"estudo-19","title":"Estudo 19 — Jesus e o Espírito Santo","type":"study","pages":[{"page":59,"blocks":["Voltar ao menu59 Sua vez de procurar: João 14:16 a 31. Leia o texto “Jesus promete o Espírito Santo”. Enquanto esteve na Terra, Jesus restaurou a saúde de pessoas enfermas, o conceito de adoração e a confiança dos seres humanos no amor de Deus. Mas não foi apenas isso. Por ser a verdade encarnada, Jesus nos apresentou a verdade restaurada. Os discípulos passaram a depender dessa verdade. Quando aprendemos a viver na verdade, nada mais nos satisfaz. E a verdade não é uma coisa abstrata; ela é uma pessoa: Jesus Cristo. Ele é o caminho, a verdade e a vida. Jesus nunca nos abandona. Por isso Ele enviou o Espírito Santo para confortar nosso coração, nos acompanhar em todos os momentos e guiar a toda a Verdade. Por que precisamos do Espírito Santo para andar com Deus neste mundo? A pós completar Sua missão de sofrimento e sacrifício em nosso favor, Jesus subiu ao Céu para continuar a obra de redenção pelos seres humanos. Quando nossos pecados são confessados a Deus e pedimos Seu perdão, Jesus oferece o próprio sangue como pagamento por nossas transgressões. Após Sua morte e ressurreição, era necessário que Cristo subisse ao Céu para interceder por nós junto ao Pai. Jesus, contudo, assegurou que não nos deixaria sós. Ele prometeu enviar o Espírito Santo, o Consolador. O Espírito da verdade atua poderosamente naqueles que se entregam a Seu controle. Por intermédio Dele, o Pai realiza Seus propósitos em favor da humanidade caída. Vamos conhecer mais o Espírito Santo de Deus. Espírito Santo","JESUS E O","ESTUDO 19","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":60,"blocks":["1.  Jesus instruiu os discípulos a esperar o derramamento do poder do Espírito Santo.","Como isso se cumpriu? Atos 2:1 a 4","2. Quais os principais resultados do Pentecostes para a igreja apostólica? Atos 2:38","3. Para que é concedido o Espírito Santo? Tito 3:4 a 7","4. Qual é a obra do Espírito Santo no mundo? João 16:8 e 13","5. Qual é a obra do Espírito Santo na vida do cristão?","a) Salmo 51:10 a 12 –","b) Ezequiel 36:26 e 27 –","c) Romanos 8:26 e 27 –","d) 1 Coríntios 12:7 e 11 –","e) Gálatas 5:22 e 23 –","6. Sobre o que o Espírito de Cristo testemunhou por meio dos profetas? 1 Pedro 1:11","7.  Qual é a principal razão para a existência da igreja e como o Espírito Santo Se","relaciona com isso? Mateus 28:18 a 20","8.  Qual é o papel do Espírito Santo no processo de santificação do crente?","1 Tessaloni censes 4:3 a 8 Que áreas da minha vida precisam ser influenciadas pelo Espírito Santo? Compromisso de fé: Compreendi que o Espírito Santo me guia em direção às melhores escolhas. Portanto, quero permitir que Ele produza Seus frutos em mim e vou dedicar meus dons espirituais, levando pessoas a conhecer Jesus. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":61,"blocks":["ESTUDO ADICIONAL","O verdadeiro dom de línguas Verdadeiro Falso Atos 2:4: É concedido pelo Espírito Santo É inventado por seres humanos Atos 2:5 e 6: Línguas reais Línguas misteriosas Atos 2:6 a 8: É compreensível Ninguém entende 1 Coríntios 12:7: Visa um fim proveitoso Não oferece nenhum benefício 1 Coríntios 14:26: Edifica a igreja Causa confusão 1 Coríntios 14:27 e 28: É interpretado É falado sem intérprete 1 Coríntios 14:27 e 30: Cada um fala na sua vez Todos falam ao mesmo tempo 1 Coríntios 14:40: É decente e ordeiro É irreverente e desordenado 1 Coríntios 14:22: É um sinal para os incrédulos É um sinal para os crentes 1 Coríntios 12:27: É um dom concedido a algumas pessoas É um sinal do recebimento do Espírito Santo","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 7)","Sábado: Novo nascimento: mudança de ideologias e práticas (página 121)","Domingo: Cosmovisão: definição e importância (página 122)","Segunda-feira: Principais cosmovisões e sua influência (página 123)","Terça-feira: Cosmovisão cristã adventista (página 124)","Quarta-feira: Crer também é pensar (página 125)","Quinta-feira: Guardando as “entradas da alma” (página 126)","Sexta-feira: Visão adventista (página 127)","MISSÃO","Ore todos os dias pelos amigos e familiares que você deseja ver em seu batismo. Compartilhe este estudo bíblico com eles para que também tomem a decisão por Jesus e pelo batismo. Amigos Pedidos de oração"]}]},{"id":"estudo-20","title":"Estudo 20 — Jesus e a Nova Terra","type":"study","pages":[{"page":62,"blocks":["Sua vez de procurar: João 14:1 a 3. Leia o episódio em que Jesus conforta os discípulos. Ao perceberem que seu amado Mestre estava partindo, os discípulos ficaram profundamente tristes. Mas Jesus lhes ofereceu conforto com a promessa maravilhosa de que voltaria e os levaria para morar com Ele. Afinal, esse sempre foi o plano de Deus. Reflita um pouco em quão maravilhoso será estar perto de Jesus. Q ue ideia você tem do Céu? Se você acredita no Céu, o que o motiva a querer ir para lá? O Céu é um lugar real onde tudo é perfeito, onde não há morte nem dor e, em vez disso, é onde há vida, saúde, paz, muito conhecimento e realização. Não há linguagem humana capaz de descrever a grandiosidade da recompensa dos que perseverarem na fé em Jesus e guardarem Seus mandamentos. Mas o que alimenta nossa esperança não pode ser a ideia de que essa recompensa se resume a uma casa no alto do colina, a uma cidade com ruas de ouro ou ao reencontro com os amados que hoje descansam no pó da terra. Sem Jesus, nada disso teria sentido. Aliás, tudo isso é apenas a consequência natural da presença Dele. Esta é a promessa de Jesus: “Voltarei e os receberei para Mim mesmo, para que, onde Eu estou, vocês estejam também” (João 14:3). Essa precisa ser a fonte de nossa esperança. O dia está chegando! Neste estudo, vamos entender melhor o que a Bíblia diz sobre a nova Terra. Nova Terra","JESUS E A","ESTUDO 20","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":63,"blocks":["1. O que a Bíbliz diz sobre a vida futura? 2 Pedro 3:13","2. Quem herdará a terra? Mateus 5:5","Os orgulhosos  Os autossuficientes Os mansos","3.  Para onde os salvos serão levados por ocasião da volta de Jesus e quanto tempo","permanecerão lá? Apocalipse 20:6","4. O que vai acontecer no Céu durante os mil anos? Apocalipse 20:4","5. O que vai acontecer na Terra durante os mil anos? Apocalipse 20:1 a 3 e 5","6. O que ocorrerá ao final dos mil anos? Apocalipse 20:7 a 9","7. Quem sofrerá a segunda morte? Apocalipse 20:14 e 15","8. Quem viverá a eternidade com Cristo? Apocalipse 22:12 a 14","9. O que os salvos farão na nova Terra? Isaías 65:21","10. O que significa habitar na presença de Deus? Salmo 16:11","Que áreas da minha vida precisam ser preenchidas pelo desejo de ir para o Céu? Compromisso de fé: Quero me preparar todos os dias para viver na nova Terra. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":64,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Efésios 5:22 e 33 2 Efésios 4:25 a 32 3 Tiago 3:13 a 18 4 Romanos 12 5 1 Coríntios 6:1 a 11 6 Tiago 2:1 a 13 7 1 Coríntios 13 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","•  Conheça o curso de liderança para pequenos grupos no site adv.st/","liderespequenosgrupos. Evangelize seus amigos por meio de um grupo de pessoas que se conectam toda semana nas unidades de ação da Escola Sabatina e nas casas.","•  Em adv.st/seriepequenosgrupos, você encontra o guia de estudos para","pequenos grupos.","MISSÃO","Veja algumas opções de estudos bíblicos para seu desenvolvimento no cumprimento da missão:","• Menu de estudos em PDF: adv.st/estudosbiblicos","• Novo Tempo: biblia.com.br","• WhatsApp: adv.st/ensinarabiblia e adv.st/curso8remedios","• Apocalipse PDF interativo: adv.st/cursointerativo-apocalipse","Em oração, peça a Deus que ajude você a estudar a Bíblia com pessoas que precisam conhecer Jesus e se entregar a Ele por meio do batismo. VOCÊ PODE BAIXAR O LIVRO DIGITAL ou o audiobook da obra Visões do Céu em adv.st/visoesdoceu Conheça o aplicativo de plano de estudo da Bíblia e dos livros de Ellen G. White em adv.st/bibleplan A Lição da Escola Sabatina e as Meditações Diárias estão disponíveis em formato digital no link mais.cpb.com.br"]}]},{"id":"crescendo","title":"Crescendo em Cristo — guia de acompanhamento","type":"supplement","pages":[{"page":65,"blocks":["MINISTÉRIO DE MORDOMIA CRISTÃ DA DIVISÃO SUL -AMERICANA"]},{"page":66,"blocks":["© Todos os direitos reservados ao Ministério de","Mordomia Cristã da Divisão Sul-Americana","da Igreja Adventista do Sétimo Dia Administração: Erton Köhler Edward Heidinger Marlon Lopes Coordenação: Josanan Alves Autores:","Semana 1 – Wilson Borba","Semana 2 – Diogo Cavalcanti","Semana 3 – Hebert Boger","Semana 4 – Ivanaudo Barbosa","Semana 5 – Josanan Alves","Semana 6 – Carlos Steger","Semana 7 – Adolfo Suárez","Coordenação Editorial:  Diogo Cavalcanti Editoração:  André Vasconcelos e Vinícius Mendes Revisão:  Adriana Seratto e Luciana Gruber Editor de Arte:  Thiago Lobo Projeto Gráfico:  Eduardo Olszewski Capa: Eduardo Olszewski Ilustração da Capa:  Adobe Stock IMPRESSO NO BRASIL / Printed in Brazil Impressão e acabamento: Casa Publicadora Brasileira Os textos bíblicos citados neste livro foram extraídos da versão Almeida Revista e Atualizada, 2 a edição, salvo outra indicação. Tipologia: Interstate 9,2/12,5 – 19808/43009"]},{"page":67,"blocks":["SUMÁRIO","BOAS-VINDAS _____________________________________________  69","COMO USAR ESTE MATERIAL _______________________   70","SEMANA 1 – CONECTADO À VIDEIRA ______________   71","SEMANA 2 – IDENTIDADE ADVENTISTA _________   80","SEMANA 3 – TESTEMUNHO CRISTÃO ____________   88","SEMANA 4 – ENVOLVA-SE COM A IGREJA _____   96","SEMANA 5 – FAMÍLIA MUNDIAL ___________________   105","SEMANA 6 – COMO AGRADAR A DEUS __________   113","SEMANA 7 – MENTE RENOVADA ___________________  121","Clique no ícone        e vá direto ao estudo bíblico","IR PARA O MENU Retorne para o menu principal de estudos"]},{"page":68,"blocks":[]},{"page":69,"blocks":["BOAS-VINDAS","Bem-vindo à família adventista! Estamos felizes por sua decisão de fazer parte desse movimento que une mais de 2,5 milhões de pessoas nos oito paí - ses que compõem a igreja na América do Sul. Como uma família, nos apoiamos mutuamente e nos esforçamos para o crescimento de todos. Este manual é uma forma de promover esse crescimento e ensinar tudo o que o Senhor nos ordenou (Mt 28:18-20). Ele foi preparado com muita oração, para que você conheça seu papel na igreja. Ao estudá-lo, sua vida espiritual será fortalecida, e você avançará na caminhada com Jesus. A caminhada começa com a comunhão . Cremos que a oração e o estudo diá - rio da Bíblia são indispensáveis para a comunhão com Deus. Uma das melhores ferramentas para facilitar o hábito de orar e estudar a Bíblia é a Lição da Escola Sabatina. Como nossa jornada espiritual permanente, ela nos ajuda a aprofun - dar nosso conhecimento bíblico e experiência com Deus. Faço um apelo para que, além deste manual, você estude a Bíblia e a Lição  diariamente com oração. A caminhada se fortalece com o relacionamento. Na unidade de ação da Escola Sabatina e nos pequenos grupos nos integramos como família. Em um grupo menor de pessoas, podemos conhecer e ser conhecidos, enfrentar as lutas e vencer. Juntos somos mais fortes, vamos mais longe e chegamos mais rápido! A caminhada se consolida com a missão . Ela tem o poder de mudar nossa condição espiritual. A única maneira de crescer espiritualmente é se compro - meter com a salvação de outros. Este manual vai ajudar você a usar seus dons para o cumprimento da missão na igreja local e em sua vida pessoal. Nas próximas semanas, você participará de uma maravilhosa jornada de cres - cimento. Ore, estude e pratique as lições aqui contidas. Tenho certeza de que você vai crescer espiritualmente, e nós seremos uma família com  comunhão cada vez mais profunda, mais integrada no relacionamento e mais envolvida na","missão  de preparar um povo para o encontro com o Senhor.","Maranata! Pr. Erton Köhler Presidente da Divisão Sul-Americana da Igreja Adventista do Sétimo Dia"]},{"page":70,"blocks":["COMO USAR","ESTE MANUAL 1     Este material está dividido em sete semanas. Ao final de cada semana, você encontrará uma página com a indicação de um site de apoio com con - teúdo adicional, a fim de complementar o tema estudado, e outra página com a indicação de livros ligados ao tema da semana. 2   Você deve ler este Manual diariamente em sua devoção pessoal.  Não tente assimilar tudo de uma só vez. Leia uma lição por dia. O importante é com - preender e aplicar pouco a pouco. Quando necessário, peça ajuda à pes - soa que lhe apresentou as verdades da Palavra de Deus ou a alguém mais experiente de sua igreja. 3   Faça as atividades propostas na lição e leia todas as passagens bíblicas sugeridas. Isso é muito importante para a compreensão dos temas diários. 4   Em algumas igrejas existe uma classe que se reúne durante os momentos da Escola Sabatina para revisar, comentar e discutir o estudo da semana. Procure saber se essa classe está funcionando em sua igreja e participe dela. 5   Sempre inicie o estudo com uma oração. Peça a Deus ajuda e orientação para compreender e colocar em prática os temas estudados. Que Deus abençoe você poderosamente nessa caminhada de fortalecimento da fé!"]},{"page":71,"blocks":["SÁBADO","COMO PERMANECER EM CRISTO I magino que você esteja dando os primeiros passos da caminhada cristã. Como tomou a decisão de entregar a vida a Jesus por meio do batismo há pouco tempo, é provável que tenha muitas perguntas. Durante o estudo desta semana, vamos responder biblicamente a alguns dos mais importantes questionamentos que ocorrem no início da caminhada cristã. Você entenderá que o batismo é a linha de partida e não a de chegada. A partir da experiência do batismo, abriu-se diante de você o longo e abençoado caminho da peregrinação cristã que o levará ao Céu. A grande questão a ser respondida é: Como posso permanecer firme nessa caminhada? Como fazer para não me desviar “nem para a direita, nem para a esquerda”? (Dt 5:32). Para permanecer firme é preciso entender que a vida cristã não é impossível, como alguns pensam. Com Cristo no coração e pelo poder do Espírito Santo, podemos refletir a luz de Deus em nossa vida, apesar de às vezes falharmos e, em outras, termos de tomar decisões sérias para per - manecermos fiéis ao lado do Senhor. Uma das melhores descrições sobre a caminhada cristã está em João 17:3: “E a vida eterna é esta: que Te conheçam a Ti, o único Deus verdadeiro, e a Jesus Cristo, a quem enviaste.” Esse texto nos ajuda a entender que ser cris - tão é ter uma relação pessoal com Cristo. A partir disso, todas as outras coisas se encaixam: as crenças, a conduta, o que fazemos na igreja e assim por diante. Para conhecer a Deus e Seu amor, é preciso antes entender como Ele Se revela ao ser humano. Deus Se revela a nós principalmente por meio da natureza, da Bíblia e de Jesus. Desde a criação, a revelação por meio da natureza está dis - ponível a todos (Sl 19:1-4). “O brilho do sol e a chuva, que alegram e refrescam o solo, as colinas, os mares, as planícies, tudo isso nos fala do amor do Criador” (Caminho a Cristo, p. 9). No entanto, como resultado da queda moral da humanidade, a natureza perdeu parte da capacidade de revelar o Criador; e nossa mente, parte da capaci - dade de percebê-Lo. Em razão disso, Deus providenciou uma revelação especial: a Bíblia Sagrada (2Tm 3:16). O Senhor também Se revelou pessoalmente em Seu Filho Jesus Cristo. “Nestes últimos dias, nos falou pelo Filho, a quem constituiu herdeiro de todas as coisas” (Hb 1:2). Por meio dessas revelações é que conhecemos a Deus e Seu amor por nós e nos tornamos genuinamente cristãos. Conectado à Videira SEMANA"]},{"page":72,"blocks":["DOMINGO","JUSTIFICADOS POR DEUS O ntem iniciamos nosso estudo vendo as diferentes maneiras como Deus Se revela ao ser humano. Mas por que o Senhor precisa Se revelar à huma - nidade? Seu plano original era falar face a face com os seres humanos, como acontecia no Éden; mas, após a queda, o pecado causou separação entre os homens e Deus (Gn 3:8; Is 59:1, 2). Leia Romanos 3:23 e 5:12. Como o pecado de Adão e Eva nos atinge hoje? _________________________________________________________________________ Todos os seres humanos sofreram as trágicas consequências do pecado de Adão e Eva. Contudo, Deus apresentou um plano que estava preparado desde a fundação do mundo (Ap 13:8). Esse plano tinha como objetivo revelar a justiça e a misericórdia de Deus. A lei, que foi quebrada pela desobediência, dizia que o transgressor deveria morrer, mas Deus enviou Seu Filho para assumir o lugar do transgressor. Dessa maneira, ao mesmo tempo em que a lei foi cumprida, a bondade de Deus foi revelada (Sl 85:10). Temos, assim, a justificação. Por meio da fé no sacrifício de Cristo, o pecador é aceito por Deus. Somos justificados e perdoados apenas quando confiamos em Cristo como nosso Senhor e Salvador e, arrependidos, confessamos nossos pecados, suplicando Seu perdão (1Jo 1:9). Como você explicaria o “resumo” da vida cristã feito em 1 João 5:11 e 12? _________________________________________________________________________ O verdadeiro cristão não busca justificação pela obediência à lei de Deus, pois deve sua salvação exclusivamente ao que Cristo fez na cruz. A função da lei não é justificar, mas definir o pecado. A lei nos convence do pecado (Rm 7:7). Sem ela, não haveria pecado nem pecadores. A obediência à lei é o fruto, a evidência da justificação, a prova de que nossa fé em Cristo é verdadeira (Ap 14:12), pois a “fé genuína se manifestará pela obediência” ( Patriarcas e Profetas, p. 154). Conta-se que Lutero sofria fortes ataques do inimigo. Um dia, o inimigo o acusou, apontando os pecados e as faltas dele: “Você ainda é capaz de sentir-se salvo diante de todos esses pecados?” Então, Lutero respondeu com segurança: “Claro que sim, pois a palavra de Deus não diz ‘crê no Senhor Jesus e te senti - rás salvo’, mas ‘crê no Senhor Jesus e serás salvo’’’ (At 16:31). Você já tem essa segurança em Cristo? Se não, vá a Ele em oração e receba, pela graça, a oferta de paz e salvação."]},{"page":73,"blocks":["SEGUNDA-FEIRA","VENCENDO O EU A conversão é a mudança de coração que resulta em uma nova pessoa, a qual passa a viver de acordo com o estilo de vida bíblico (2Co 5:17). Esse processo de transformação é chamado nas Escrituras de novo nascimento (Jo 3:5). O novo nascimento tem dois elementos: um natural e outro divino. O natural é a água do batismo; o divino é o Espírito Santo, a terceira pessoa da Trindade (At 2:38). Sem o Espírito não pode haver novo nascimento, e o batismo não passaria de uma encenação religiosa. Apenas o Espírito pode nos regenerar e renovar (Tt 3:5). Leia Romanos 7:14 e 15 e 1 Coríntios 15:50 a 52. O que vem após o novo nascimento? _________________________________________________________________________ Isso não quer dizer que, uma vez que encontrou a salvação, o cristão estará salvo para sempre. Depois do batismo, devemos ser salvos a cada dia por Cristo; afinal, permaneceremos com nossa natureza pecaminosa até a segunda vinda do Senhor. Para termos uma vida cristã vitoriosa, necessitamos permanecer em Cristo todo o tempo (Jo 15:1-8). Isso é comunhão com Cristo! Esta é a verdadeira luta do cristão: permanecer ligado continuamente a Jesus. Você logo vai perceber que existe uma luta entre o que sabemos que deve ser feito e o que realmente fazemos. É nesse ponto que muitas pessoas que estão iniciando na fé se desesperam, pois chegam a pensar que, após o batismo, sua vida seria marcada apenas por vitórias. Na verdade, o que acontece é uma batalha contra o velho homem, uma luta entre a pessoa que éramos antes do batismo e a que nos tornamos após ele. Ellen White nos ajuda a entender essa realidade: “Há os que já conheceram o poder perdoador de Cristo e que realmente desejam ser filhos de Deus, mas percebem que seu caráter é imperfeito [...]. Gostaria de dizer para esses que não recuem em desespero. Muitas vezes, teremos que nos prostrar e chorar aos pés de Jesus por causa de nossas faltas e erros, mas não devemos desanimar. Mesmo se formos vencidos pelo inimigo, não seremos rejeitados nem abando - nados por Deus’’ (Caminho a Cristo, p. 63, 64). Esse processo de transformação é chamado de santificação pela fé. Sem ela, “ninguém verá o Senhor” (Hb 12:14). Precisamos entender três coisas: (1) A transformação nos fará semelhantes a Cristo; Ele é nosso modelo (Fp 3:13, 14). (2) A transformação é um processo que dura toda a vida (1Ts 4:1). (3) A transformação não é o resultado de nossos esforços, mas da ação de Deus em nós (Rm 5:19). A santidade é um processo que exige paciência e persistência ao mesmo tempo. Então, prossiga!"]},{"page":74,"blocks":["TERÇA-FEIRA","BUSCANDO PRIMEIRO O REINO O grande conflito entre Cristo e Satanás iniciado no Céu foi transferido à Terra (Ap 12:3-9). Em sua guerra contra a lei e o governo de Deus, Satanás disfarça sua verdadeira identidade e promove mentiras sobre o santo e amo - roso caráter de Deus (Gn 3:1-6). A única maneira de vencermos as tentações do diabo é por meio da fé em Cristo, que nos leva a obedecer fielmente à lei e à Palavra do Senhor (Ap 12:17; 14:12; Sl 119:1, 11). Ao ser tentado por Satanás no deserto, Jesus usou a Palavra de Deus para vencê-Lo (Mt 4:4). Devemos nos alimentar da Palavra de Deus para sermos vitoriosos no grande conflito, assim como Cristo (Ez 3:1-3; Is 50:4). Uma boa sugestão é ler pela manhã ao menos um capítulo, conforme o projeto “Reavivados por Sua Palavra”, que está disponível no site: reavivadosporsuapalavra.org. É vital que entendamos os ensinos da Bíblia como um todo, pois o inimigo os conhece e costuma deturpá-los por intermédio de pessoas instáveis e igno - rantes (2Pe 3:16). Em outras palavras, não devemos simplesmente ler a Bíblia, mas estudá-la. Deus não deixou Sua igreja sem o dom de profecia no tempo do fim (Ap 12:17; 19:10). Embora Ellen White tenha sido divinamente inspirada, os adventistas não colocam os escritos dela em pé de igualdade com as Escrituras, pois, como ela mesma afirmou: “a Bíblia, e a Bíblia tão só, deve ser nosso credo” ( Mensagens Escolhidas, v. 1, p. 416). Devemos obedecer à “Palavra de Deus como a norma suprema” (Manuscrito 97, 1898). A função dos escritos do Espírito de Profecia é “gravar vividamente na alma as verdades da inspiração já reveladas” ( Testemunhos Seletos, v. 2, p. 280). Já o estudo da Lição da Escola Sabatina  nos une ao redor do mundo como adventistas. A cada trimestre, um novo tema bíblico é estudado. Esse guia deve ser estudado em casa diariamente e revisado a cada sábado na unidade de ação na igreja. Na próxima página, você descobrirá como fazer a assinatura da Lição da Escola Sabatina para você e sua família. Escreva o horário em que você estará em comunhão com Deus por meio do estudo da Bíblia, do Espírito de Profecia e da Lição da Escola Sabatina . Das ___:___ às ___:___ horas. Dicas para os momentos de estudo:","1. Tenha regularidade (At 17:11).","2. Faça da comunhão um período tranquilo (Sl 46:10).","3.  Ore antes de estudar e peça sabedoria do Céu para compreender a","Palavra (Tg 1:5)."]},{"page":75,"blocks":["MKT CPB | Fotolia Preencha o formulário no verso desta página ou veja abaixo como adquirir sua Lição da Escola Sabatina. Jornada Espiritual Permanente para você e sua família. Onde e como fazer sua assinatura Vá a uma loja SELS, Novo Tempo Store ou Multibom Baixe nosso novo APP CPB Loja Ligue para 0800-979-0606 do seu ﬁ  xo ou celular Envie sua mensagem para 15 98100-5073 Telefone WhatsApp Aplicativo Igreja SELS Acesse agora nosso site: www.cpb.com.br Site ou Multibom ou celular RevendaSMS Preencha este folder e entregue ao seu pastor, ancião ou professor da Escola Sabatina Pessoa jurídica/distribuidor 15 3205-8910 atendimentolivrarias@cpb.com.br Envie CPBLIGA para 28908 e nós ligaremos para você CPB livraria"]},{"page":76,"blocks":["QUARTA-FEIRA","ORAR E JEJUAR C omo vimos na lição de ontem, Deus Se comunica conosco por meio da Palavra. Entretanto, é pela oração que falamos com nosso Pai celestial. É impossível termos uma vida espiritual vitoriosa sem oração. “A oração é a respiração da alma. É o segredo do poder espiritual” ( Obreiros Evangélicos, 254). “A oração é a chave nas mãos da fé para abrir os depósitos do Céu, onde estão armazenados os ilimitados recursos da Onipotência” (Caminho a Cristo, p. 94). Todos necessitam ir a Jesus e pedir: “Senhor, ensina-nos a orar” (Lc 11:1). No contexto dessa passagem, os apóstolos não queriam simplesmente aprender palavras, mas como ter uma vida santa e poderosa como a de Jesus, a fim de pregar, curar e servir (Mc 1:35-39). Em resposta ao pedido deles, Jesus apontou a oração do “Pai Nosso” (ler Lc 11:2-4). “A oração do Senhor não foi destinada para ser simplesmente repetida como uma fórmula, mas é uma ilustração de como devem ser as nossas orações – simples, fervorosas e abrangentes” (Orientação da Criança , p. 524). O ponto central dessa oração é o Pai celestial, Seu caráter amoroso e Seu reino. A oração do “Pai Nosso” nos ensina a ser humildes e a depender de Deus, a fim de que Ele supra diariamente nossas necessidades físicas e espirituais. Veja alguns passos importantes de uma oração:","1.  Adore a Deus: louve-O pela grandeza do poder e da misericórdia Dele (Sl 105:3).","2. Confesse os pecados (Sl 51:1-7).","3.  Interceda: apresente a Deus os nomes de pessoas que têm necessidades","físicas e espirituais (Rm 1:8-10).","4.  Agradeça: na adoração você louvou a Deus pelo que Ele é; agora você deve","louvá-Lo pelo que Ele faz em sua vida (Sl 103:2).","5.  Peça: vá à presença de Deus e apresente com confiança suas necessida -","des (Fp 4:6). Por vezes, diante dos desafios, também será necessário jejuar. O jejum é bíblico e recomendado aos cristãos. Servos de Deus oraram e jejuaram ao enfrentar perigos (Et 4:16; 2Cr 20:3, 4). Eles também jejuaram pela renovação espiritual (Ne 1:4; Dn 9:3) e, especialmente, a fim de se consagrarem para a missão (At 13:3; 14:23). Nas mãos de Deus, a oração e o jejum “são um meio de purificar o cora - ção e promover uma disposição mental receptiva ( Medicina e  Salvação , 283). Por outro lado, “pode não ser requerida a completa abstinência de alimento, mas devem comer moderadamente, do alimento mais simples” ( Conselhos Sobre Regime Alimentar, p. 188, 189). Isso quer dizer que o jejum não necessariamente precisa ser de abstinência completa de alimento ou por um tempo prolongado. O jejum não é uma penitência, mas um momento para estar inteiramente dedi - cado ao estudo da Bíblia e à oração."]},{"page":77,"blocks":["QUINTA-FEIRA","DEVOÇÃO FAMILIAR E COMUNITÁRIA D esde o princípio, Deus tem demonstrado carinho e interesse pela felicidade no lar. Segundo a Bíblia, essa é uma prioridade de Deus. “O vínculo da família é o mais íntimo, o mais terno e sagrado de todos na Terra. Foi designado como uma bênção à humanidade” ( O Lar Adventista, p. 18). Toda família adventista deve se manter diariamente nas mãos do Senhor. É preciso haver um tempo determinado para o culto, tanto ao início como ao fim do dia. “Como é apropriado os pais reunirem os filhos ao redor de si, antes do desjejum, agradecer ao Pai celestial Sua proteção durante a noite e  pedir-Lhe auxílio, guia e proteção para o dia! Como é adequado também, ao chegar a noite, se reunirem uma vez mais em Sua presença, pais e filhos, para agradecer as bênçãos do dia findo!” ( Orientação da Criança , p. 520).","Comunhão em família","1. Culto ao início do dia — altar de entrega: a família deve se reunir para cantar hinos, orar e ler a meditação diária ou o devocional apropriado para a idade","dos filhos (crianças, adolescentes, jovens).","2. Culto ao fim do dia — altar de gratidão: a família deve se reunir para cantar","hinos, ler um texto da Bíblia ou do Espírito de Profecia, agradecer a Deus e orar. Deve-se levar em conta que, em lares em que há crianças, os cultos devem ser alegres e curtos. Se a cada dia a presença de Cristo estiver em sua casa, a família será uma bênção. “Quanto mais perto nos achegarmos de Cristo, mais perto estaremos uns dos outros” (O Lar Adventista, p. 179). Outro momento especial para a família é a recepção e a despedida do sábado, com o culto de pôr do sol. Esse momento é um marco importante no vínculo familiar. Os filhos crescem e lembram com saudade dos momentos especiais de culto em família. A santidade do sábado, do primeiro ao último instante, deve ser considerada como algo muito sério. Algumas dicas: (1) pesquise a que horas o sol vai se pôr na região; (2) use a sextafeira como um dia de preparação para as horas do sábado; (3) torne o culto de pôr do sol o mais especial da semana; e (4) priorize estar com a família nesses momentos. Culto comunitário “Não deixando a nossa congregação, como é costume de alguns” (Hb 10:25, ARC). A frequência assídua à igreja vai estimular seu crescimento espiritual. Mantenha os olhos fixos em Jesus. Os melhores homens e mulheres poderão decepcionar você na igreja, mas não se esqueça: Cristo jamais falha! A igreja é um hospital no qual Jesus é o único médico. Como você, as demais pessoas estão em busca da cura."]},{"page":78,"blocks":["SEXTA-FEIRA","FIRMES ATÉ O FIM N esta semana estudamos sobre os passos necessários a fim de que um cris - tão permaneça firme na fé. Esse foi o tema do sermão de Jesus em João 15. Leia com atenção João 15:1 a 10 e tente descobrir duas coisas: Quantas vezes Jesus repete a palavra “permanecer”? Se permanecemos ligados a Cristo, qual será o resultado (v. 5)? _________________________________________________________________________ Nesse sermão, a ênfase de Jesus não estava no início da caminhada cristã, mas na permanência nela. Todas as pessoas, especialmente os novos na fé, precisam aprender essa lição. Certa vez, um cristão disse que tinha três regras de vida: (1) não falar com ninguém sem antes ter falado com Jesus; (2) não fazer nada sem antes ter se ajoelhado para orar; e (3) não ler ou acessar nada sem antes ter lido a Bíblia. Vivemos em um mundo que se move com rapidez. Mais do que nunca, pre - cisamos calcular o tempo para fazer aquilo que é necessário. Cada um de nós precisa decidir quais são as prioridades. Somos nós que determinamos o que deve ocupar o primeiro lugar em nossa vida: passar tempo com Deus ou fazer qualquer outra coisa. Essa é uma escolha pessoal. Nossa atitude diária deve ser esta: “Consagre-se a Deus pela manhã; faça disso a sua primeira atividade. Que a sua oração seja: ‘Toma-me, ó Senhor, para ser Teu inteiramente. Deponho todos os meus planos a Teus pés. Usa-me hoje para o Teu serviço. Fica comigo, e que tudo o que eu fizer seja efetuado por Ti.’ Essa é uma questão diária. Cada manhã consagre-se a Deus para aquele dia. Entregue-Lhe todos os seus planos para saber se devem ser levados avante ou não, de acordo com o que Sua providência indicar” ( Caminho a Cristo, p. 69, 70). Em Isaías 40:30 e 31, lemos: “Os jovens se cansam e se fatigam, e os moços de exaustos caem, mas os que esperam no Senhor renovam as suas forças, sobem com asas como águias, correm e não se cansam, caminham e não se fatigam.” Essa é uma boa descrição de quem permanece ligado a Cristo. As coisas mortas não podem crescer. Antes de haver crescimento espiritual é preciso que haja vida espiritual. Quando uma criança nasce, seu primeiro som indica vida. Se houver vida, então um mundo de possibilidades acena para o bebê recém-nascido; se não houver vida , essas possibilidades desaparecem. Portanto, você não deve temer se vai conseguir ou não permanecer na igreja cumprindo regras e normas. Você deve temer se afastar da fonte de vida: Jesus Cristo. Se você permanecer Nele, as outras coisas lhe serão acrescentadas."]},{"page":79,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":80,"blocks":["Voltar ao menu SEMANA  280","SÁBADO","IDENTIDADE ÚNICA E m certos dias, os sentimentos se voltam para o passado. Pensamos nas pessoas que deixaram suas marcas em nossa vida: mãe, pai, irmãos, avós. Mais uma vez nos damos conta de nossas raízes. Temos uma história. Somos o conjunto de nossas lembranças, e tudo isso compõe nossa identidade. Como adventistas do sétimo dia, temos uma identidade que nos foi transmitida como uma herança valiosa. A mensagem da volta de Jesus em glória, nas nuvens do céu (Mt 24:30, 31), por mais que seja algo tão simples e fácil de se entender, foi des - coberta na Palavra de Deus por meio de muito estudo e oração. Mais do que compor uma denominação, os adventistas do sétimo dia enten - dem que fazem parte de um movimento despertado por Deus para preparar um povo para a volta de Jesus. Nossa missão diz quem somos. Fomos chama - dos a pregar o evangelho a todas as nações, a “toda criatura”, antes que venha o fim (Mc 16:15; Mt 24:14). Como adventistas, acreditamos ser também um movimento de restauração de verdades bíblicas esquecidas. Afinal, pregamos o “evangelho eterno” (Ap 14:6), que foi alterado e mutilado ao longo da história. “Pecado é a transgressão da lei” (1Jo 3:4) e, como pecadores, precisamos da salvação em Cristo. Porém, essa necessidade só pode ser entendida plenamente quando compreendemos a validade da lei de Deus. Para salvar o pecador, Deus não mudou Sua lei, mas proveu em Cristo o sacrifício a fim de que as santas exigências da lei da liberdade (Tg 1:25; 2:12) fossem satisfeitas. Jesus mesmo disse que a lei jamais passará e que devemos cumpri-la e ensiná-la (Mt 5:17, 18). Essa combinação da fé em Jesus e da guarda dos mandamentos de Deus é exatamente a identidade básica do povo de Deus no tempo do fim: “Aqui está a perseverança dos santos, os que guardam os mandamentos de Deus e a fé em Jesus” (Ap 14:12). Assim, embora entendamos que Deus têm Seus filhos em todas as igrejas, religiões e certamente até mesmo fora delas, Ele despertou um povo na Terra que proclama o nome de Jesus Cristo e a validade de Seus mandamentos. Esse povo é o remanescente da profecia bíblica (Ap 12:17), de modo nenhum considerado melhor do que os outros, mas chamado para amar e servir a todos. Você já pensou nisso? Quanto privilégio e responsabilidade temos ao fazer parte desse movimento! Lembre-se sempre de que você é um representante de Deus na Terra para levar pessoas a Cristo e à Sua Palavra, antes que Ele venha. Identidade Adventista SEMANA"]},{"page":81,"blocks":["Voltar ao menuSEMANA  2 81","DOMINGO","DO DESAPONTAMENTO À ESPERANÇA A lgo novo estava para acontecer no mundo após os 1.260 anos de perseguição religiosa preditos na Bíblia (Dn 7:25; 12:7; Ap 11:3; 12:6, 14; 13:5). Pes - soas em vários continentes começaram a estudar as Escrituras e as profecias (Dn 12:4). Surgia o grande movimento adventista, que enfatizava o “advento”, a vinda de Jesus. Pessoas de várias denominações descobriram que a Palavra de Deus anuncia a volta de Cristo em glória (Mt 24:30, 31): Johann Petri, na Alemanha; Manuel Lacunza, no Chile; seguidos por José Wolff e Edward Irving que pregaram essa mensagem. Uma das vozes mais eloquentes foi a do batista Guilherme Miller, nos Estados Unidos. Em 1818, após estudar a Bíblia verso por verso, esse juiz de paz, que era muito respeitado, se deparou com a profecia das 2.300 tardes e manhãs de Daniel 8:14. Entendeu, assim como os comentaristas bíblicos de sua época, que se tratava de uma profecia de tempo equivalente a um período de 2.300 anos, que iniciaria com a ordem para a reconstrução de Jerusalém (457 a.C.) e se estenderia até por volta de 1843. Relutante, guardou para si essa mensagem por 13 anos, até que se rendeu à sua consciência e passou a escrever e pregar sobre o que havia descoberto. Assim, iniciou um movimento que cresceu de maneira avassaladora. Os adventistas mileritas, pertencentes a várias denominações e que não haviam fundado nenhuma igreja, entendiam que a purificação do santuário anunciada em Daniel 8:14 se referia à purificação da Terra com o fogo (2Pe 3:7). Assim, esperavam a segunda vinda de Cristo para 1843 e, depois, refizeram o cálculo para o dia 22 de outubro de 1844, até que a espera foi finalmente frus - trada, ocasionando o chamado Grande Desapontamento (Richard Schwarz e Floyd Greenleaf, Portadores de Luz, Unaspress, 2016, p. 29-36). Das cinzas do Desapontamento, um pequeno grupo de piedosos se voltou às Escrituras. A profecia de tempo estava correta, mas o que dizer do evento? Após muito estudo e oração, descobriram que o santuário ao qual Daniel 8:14 se referia era o santuário celestial (Hb 8:1, 2; 9:11-15; Ap 11:19). Algo solene havia começado no Céu: o juízo, que passou a ser anunciado na Terra (Ap 14:6; Dn 7:9-14). A mensagem do santuário celestial despertou a busca de conhecimento sobre a lei de Deus, e nela brilha o quarto mandamento. Per - ceba que uma verdade bíblica se liga a outra. Surgiu, então, um pequeno número de adventistas guardadores do sábado. Eles acreditavam que Jesus voltaria à Terra numa data e hora da qual ninguém sabe (Mc 13:32). Esse pequeno grupo cresceu tanto e tão rapidamente que precisou se organizar. Assim, em 1863, surgiu a Igreja Adventista do Sétimo Dia. Hoje, você faz parte dessa história. Quais serão as próximas linhas que você vai ajudar a escrever?"]},{"page":82,"blocks":["Voltar ao menu SEMANA  282","SEGUNDA-FEIRA","UMA CASA NO CÉU Q uase todas as doutrinas e práticas adventistas podem ser encontradas em outras confissões religiosas, com exceção de uma: a doutrina do santuá - rio. Somente os adventistas apresentam uma compreensão tão abrangente, integrada e particular sobre esse tema. Diante disso, cabe uma pergunta: Há fundamentos sólidos na Palavra de Deus para esse ensino? Para responder a essa questão, precisamos entender melhor o santuário no Antigo Testamento. Por que Deus ordenou a construção de um santuário? Êx 25:8 _________________________________________________________________________ _________________________________________________________________________ Os primeiros patriarcas já realizavam sacrifícios de animais (Gn 4:4; 12:7). Contudo, quando o povo de Israel saiu do Egito, o Senhor ordenou a construção de um santuário, que funcionava como um ponto de encontro entre Ele e Seu povo. A primeira versão do santuário foi uma tenda ou tabernáculo, com peças e coberturas feitas de peles e metais preciosos. Séculos depois,  Salomão erigiu um templo magnificente, seguindo os mesmos padrões do tabernáculo. Os sacri - fícios, os móveis do santuário, as festas anuais e até mesmo a função dos sacerdotes eram símbolos do “Cordeiro de Deus que tira o pecado do mundo” (Jo 1:29). Onde Jesus atua hoje como nosso Sumo Sacerdote? Hb 8:1-5; 9:11-15 _________________________________________________________________________ O primeiro santuário foi feito de acordo com o modelo celestial (Êx 25:9, 40; Hb 8:5). Evidências bíblicas do santuário celestial não faltam. O autor do Apocalipse faz referência ao “santuário de Deus, que se acha no Céu” (Ap 11:19). Nele Jesus ministra como nosso “Sumo Sacerdote” (Hb 8:1, 2). Pelo Seu san - gue, Cristo entrou no santuário celestial e por isso é nosso Mediador (Hb 9:12, 14, 15). Nesse santuário, deveria ocorrer um juízo investigativo pouco antes da volta de Jesus (Dn 7:9-14; 8:14; Ap 14:6, 7). “O santuário no Céu é o centro da obra de Cristo em favor dos homens. [...] A intercessão de Cristo no santuário celestial em favor do ser humano é tão essencial ao plano da redenção como foi Sua morte sobre a cruz ( O Grande Conflito, p. 488, 489). Nossa fé não se dirige a um Jesus eternamente imóvel e agonizante na cruz, mas ao Cristo vivo, ressurreto e que intercede por nós. Assim, “temos Advogado junto ao Pai, Jesus Cristo, o Justo” (1Jo 2:1). Estude mais esse assunto e se maravilhe com a graça de Deus que salva e transforma vidas."]},{"page":83,"blocks":["Voltar ao menuSEMANA  2 83","TERÇA-FEIRA","MONUMENTO AO CRIADOR C omo adventistas, levamos o sétimo dia em nosso nome. É um elemento que nos identifica e distingue nos cenários religioso e social. É também um sinal entre Deus e Seu povo (Êx 31:13; Ez 20:12, 20). Em Gênesis encontramos as raízes profundas e firmes do dia santo. Deus descansa de Sua obra criadora no sétimo dia e o abençoa e santifica, diferenciando-o dos demais (Gn 2:3). Essa é a tripla razão para o quarto mandamento (Êx 20:11). Gênesis 2:3 afirma: (1) a autoridade do sábado, destacado e estabelecido pelo próprio Deus; (2) sua universalidade, porque foi dado a toda a humanidade, quando ainda não havia nenhuma religião, cor de pele ou etnia; (3) sua funcionalidade, pois foi estabelecido para prover restauração ao ser humano, em comunhão com o Criador. Leia Êxodo 20:8 a 11 e Apocalipse 14:6 e 7. Quais palavras esses textos têm em comum? _________________________________________________________________________ Céu, terra e mar são mencionados na mesma sequência tanto em Êxodo 20:11 quanto em Apocalipse 14:7. Como guardar o sábado?  Is 58:13, 14 _________________________________________________________________________ Observar o sábado começa na mente. Envolve deixar o egoísmo e se voltar para Deus. Em um capítulo intitulado “A Observância do Sábado” ( Testemunhos Para a Igreja, v. 6, p. 349-368), Ellen G. White oferece orientações indispensá - veis para quem deseja observar o sétimo dia. Confira sete orientações básicas: (1) a guarda do sábado não se trata apenas da obediência a uma lei, mas de uma relação espiritual com Deus e com toda a nossa vida. Somos no sábado aquilo que somos durante a semana e vice-versa; (2) a preparação envolve toda a semana, especialmente a sexta-feira; (3) os limites do sábado devem ser observados, de pôr do sol a pôr do sol; (4) no sábado de manhã precisamos acordar mais cedo para evitar a pressa e a agitação; (5) as roupas do sábado devem refletir modéstia e bom gosto; (6) a alimentação deve ser feita com pratos simples, mas apetitosos e atraentes, com receitas diferentes das da semana; (7) devemos evitar conversas mundanas, pois é nosso privilégio falar de assuntos espirituais. O sábado foi feito por causa do ser humano (Mc 2:27, 28). Experimente o","sábado a cada sétimo dia e seus benefícios ao longo da semana. Assim, o mundo","verá em sua vida um monumento ao Criador."]},{"page":84,"blocks":["Voltar ao menu SEMANA  284","QUARTA-FEIRA","MIL MENTIRAS, UMA VERDADE A s palavras “é certo que não morrereis” (Gn 3:4) constituem a maior men - tira já contada. Esse engano trouxe a própria morte como consequência. Tende a nos afastar de Deus, pois gera uma ilusão de que o ser humano nunca morre, que somente passa de um plano, ou nível de existência, para outro. A alma pode morrer? O que são alma e espírito? Ez 18:4; Gn 2:7 _________________________________________________________________________ A ideia de que as pessoas continuam existindo após a morte é mais do que uma crença religiosa. É uma visão de mundo. Contudo, segundo a Bíblia, a alma é a pessoa como um todo. Cada ser humano é uma alma. Você é uma alma. Jacó foi para o Egito com 70 almas, que eram seus filhos, netos e agregados (Dt 10:22, ARC). Quando Deus criou o ser humano, Ele o fez “alma vivente” (Gn 2:7), e essa alma vivente também morre, conforme lemos em Ezequiel 18:4. Na Bíblia, a palavra “espírito” pode ser traduzida como “fôlego de vida”. Isso é apenas o princípio que nos mantêm vivos, assim como os animais (Ec 3:19). Na morte, não existe movimento, mudança, consciência, sentimento nem qualquer nível de existência humana (Ec 9:5, 6, 10). Morte é morte, e não outro tipo de vida. Sem dúvida, é a mais terrível consequência do pecado (Rm 3:23; 5:12). Por outro lado, na morte, também não existe nenhum tipo de sofrimento. Ninguém está queimando em algum lugar, continuamente. Aliás, isso é um ensino cruel e antibíblico. Segundo a Bíblia, qual é o processo de reversão da morte? Lc 20:36; Jo 5:28, 29; 11:24, 25. Assinale V (verdadeiro) ou F (falso). (   ) Existência em outro plano.       (   ) Ressurreição.  (    ) Reencarnação. Paulo defendia não apenas a ressurreição de Cristo, mas a própria ideia de que haverá uma ressurreição geral (At 23:6; 24:15, 16; 1Co 15:12, 13). Quando ocorrerão as duas ressurreições? 1Ts 4:13-18; 1Co 15:50-54 _________________________________________________________________________ Segundo as Escrituras, a primeira ressurreição ocorrerá na volta de Jesus, a ressurreição dos justos. A segunda ressurreição ocorrerá mil anos depois, quando a Nova Jerusalém descer do Céu. Em Cristo, temos a esperança da ressurreição. Cristo tem as chaves da morte e da sepultura (Ap 1:18). Ele é a ressurreição e a vida (Jo 11:25). Por isso, junto a Ele, não precisamos temer."]},{"page":85,"blocks":["Voltar ao menuSEMANA  2 85","QUINTA-FEIRA","MENSAGEIRA DO SENHOR “ N ão havendo profecia, o povo se corrompe” (Pv 29:18). Nas Escrituras, Deus chama repetidamente Seu povo ao arrependimento, e esse chamado sempre é feito por meio de um profeta. Que dom deveria se manifestar entre o remanescente dos últimos dias? Ap 12:17; 19:10 _________________________________________________________________________ Satanás se ira contra os remanescentes, isto é, “os que guardam os manda - mentos de Deus e têm o testemunho de Jesus” (Ap 12:17). Em Apocalipse 19:10, afirma-se que “o testemunho de Jesus é o espírito de profecia”. Todo profeta é uma testemunha de Jesus, assim como cada profecia é um testemunho sobre Ele (Lc 24:27; Jo 8:56; Ap 1:9). Portanto, entre o povo remanescente dos últimos dias se manifestaria o testemunho de Jesus por meio do ministério de um profeta. Quais são as marcas de um verdadeiro profeta e como elas são notadas na vida de Ellen G. White? Assinale V (verdadeiro) ou F (falso). (   ) Os escritos dela estão em conformidade com as Escrituras (Is 8:20). (   ) Suas profecias se cumpriram (Dt 18:21, 22). (   ) Ela manifestou bons frutos em sua vida pessoal (Mt 7:15). (   ) Ela defendia a divindade de Cristo (1Jo 4:1, 2). Ellen G. White (1827-1915) não gostava de ser chamada de profetisa, mas jamais negou que suas visões fossem genuínas. Ela se considerava uma men - sageira do Senhor. Recebeu mais de 2 mil sonhos e visões, os quais às vezes ocorriam durante reuniões de oração e eram percebidos por outras pessoas. Seus escritos e sua vida pessoal exaltavam dois aspectos: Cristo e a Palavra de Deus. Ellen G. White também fez predições surpreendentes que se cumpri - ram, como a ascensão dos Estados Unidos ao patamar de superpotência glo - bal, o poderio global do papado e a popularização do espiritismo (sugestão de leitura: Profecias Surpreendentes; Ellen G. White: Mulher de Visão ; e Enciclopédia Ellen G. White ). Ela não era perfeita e não deve ser reverenciada, pois foi uma  pessoa comum como nós. Contudo, ainda hoje somos abençoados por seu ministério desinteressado e somos chamados por Deus a ser beneficiados por seus escritos (2Cr 20:20)."]},{"page":86,"blocks":["Voltar ao menu SEMANA  286","SEXTA-FEIRA","VALORIZE NOSSA IDENTIDADE V imos nesta semana que os adventistas do sétimo dia têm uma identidade. Somente quando entendermos nossa identidade bíblica, herança histórica e as valiosas mensagens que nos foram confiadas, nós as preservaremos e as proclamaremos ao mundo. Assim, vamos relembrar o que aprendemos nesta semana. A partir do que você aprendeu no estudo de domingo, como o adventismo surgiu? (   ) De uma rixa interna e divisão de uma igreja. (   )  De um grupo de pessoas de várias igrejas que se reuniu para orar e estu - dar a respeito da volta de Jesus. Uma das mais belas características do adventismo é que seu início foi marcado pela união de pessoas e linhas de pensamento diferentes. Apesar das dife - renças, essas pessoas foram humildes o bastante para estudar, discutir e orar juntas para que Deus as guiasse. Como o ministério de Cristo no santuário, a crença sobre o estado do ser humano na morte e o dom de profecia distinguem o movimento adventista? Marque V (verdadeiro) ou F (falso): (  )  Somente os adventistas defendem a doutrina de que existe um santuário celestial e que hoje Jesus aplica os méritos de Seu sacrifício em nosso favor. (  )  Entendemos que a morte é apenas um estado passageiro de cessação com - pleta da vida, mas um dia todos ressuscitarão. (  )  Acreditamos que Deus comunicou mensagens à jovem Ellen G. White, que, ao longo de 70 anos de seu ministério, levou a igreja para mais perto de Cristo e de Sua palavra, e assim nos beneficia até hoje. O estudo desta semana foi apenas um resumo de importantes verdades. Então, você precisa ir além. Estude a Palavra de Deus todos os dias, em ora - ção. Dedique-se ao estudo da Lição da Escola Sabatina  e busque outras fontes oferecidas pela igreja por meio de suas editoras. Você não precisa ler todos os materiais de uma vez. Um pouco cada dia ajuda muito. Aliás, tome cuidado com algumas fontes e personalidades da internet. Às vezes, elas apresentam uma visão biblicamente desequilibrada. É preciso buscar informação em fontes seguras; sempre se lembrando de quem você é: um filho ou uma filha de Deus que faz parte de um grande movimento profético chamado a preparar um povo para a volta de Jesus."]},{"page":87,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":88,"blocks":["88 Voltar ao menu SEMANA  3","SÁBADO","CHAMADO PARA A MISSÃO S eja bem-vindo a mais uma semana de descobertas e aprendizado. Nesta semana, vamos estudar um dos pontos mais importantes da caminhada cristã: “Como compartilhar a fé com outras pessoas?” Todo filho de Deus recebe a missão de compartilhar o evangelho com os outros. Nosso chamado individual não pode ser transferido para outra pessoa. A igreja é uma comunidade de indivíduos chamados por Jesus para segui-Lo. Essa vocação inclui três elementos. Identifique-os a partir dos textos bíblicos a seguir:","1. “Nisto conhecerão todos que sois Meus discípulos: se tiverdes ____________","uns aos outros” (Jo 13:35).","2. “A fim de que todos sejam ________________; e como és Tu, ó Pai, em Mim","e Eu em Ti; também sejam eles em Nós; para que o mundo creia que Tu Me enviaste” (Jo 17:21).","3. “Nisto é glorificado Meu Pai, em que deis __________________; e assim vos","tornareis Meus discípulos” (Jo 15:8). Nosso chamado como filhos de Deus envolve: amar, viver em unidade cristã e produzir frutos para glorificar a Deus. Isso é possível por meio da oração e do estudo da Bíblia. Leia Mateus 28:18 a 20. Qual é a missão da igreja? _________________________________________________________________________ “A Igreja de Cristo na Terra foi organizada para fins missionários, e o Senhor deseja ver a Igreja inteira idealizando meios pelos quais elevados e humildes, ricos e pobres, possam ouvir a mensagem da verdade” (Serviço Cristão , p. 72). “A Igreja é o instrumento escolhido por Deus para salvação dos seres humanos. Foi organizada para servir, e sua missão é levar o evangelho ao mundo” (Atos dos Apóstolos, p. 9). Portanto, se você deseja permanecer firme na fé, envolva-se com a missão. Ela renovará em você o desejo e a necessidade de buscar a Deus a cada dia. “Deus poderia ter realizado Seu plano de salvar pecadores sem o nosso auxílio; mas, para desenvolvermos caráter semelhante ao de Cristo, precisamos parti - lhar de Sua obra” (O Desejado de Todas as Nações, p. 142). Nesta semana, vamos descobrir como podemos, por meio do testemunho e serviço, participar da missão de Deus. Testemunho Cristão SEMANA"]},{"page":89,"blocks":["89Voltar ao menuSEMANA  3","DOMINGO","TESTEMUNHANDO DE MINHA FÉ T estemunhar de minha fé é contar o que Jesus fez, faz e fará por mim. Mas por que testemunhar sobre Jesus? Vejamos quatro razões:","1. A salvação de pessoas alegra o coração de Deus. Jesus contou a história","da ovelha, da moeda e do rapaz que estavam perdidos e foram encontrados (veja Lc 15:7, 10, 32).","2. Pregar o evangelho é um mandamento bíblico. A urgência da proclamação","está presente em todo o Novo Testamento (veja At 13:47).","3. O testemunho é a resposta do coração agradecido pela salvação recebida.","“O primeiro impulso do coração regenerado é levar outros também ao Salva - dor” (O Grande Conflito, p. 70).","4. Testemunhar contribui para a vida espiritual como nenhuma outra coisa.","“A melhor maneira de se obter força para resistir ao mal é por meio de traba - lho árduo” ( Atos dos Apóstolos , p. 105). Falar de Cristo aos outros comunica poder espiritual. A maneira mais efetiva de testemunhar é empregar o método de Cristo: “O Salvador misturava-Se com os homens como uma pessoa que lhes desejava o bem. Manifestava simpatia por eles, atendia-lhes às necessidades e  ganhava-lhes a confiança. Ordenava então: ‘Segue-me’ (Jo 21:19)” (A Ciência do Bom Viver, p. 143). Em outras palavras, testemunhar não era um evento ou uma ocasião esporá - dica na vida de Cristo, mas uma prática comum. Devemos começar esse processo em nosso círculo de influência, isto é, com nossos familiares, amigos, colegas de trabalho e conhecidos. Faça uma pequena lista das pessoas que estão em seu círculo de influência e, então, dedique um tempo diário para orar por elas e pedir a Deus para ajudá-lo a testemunhar. Seu testemunho de vida pode ser dividido em três partes:","• Testemunho: Como era minha vida antes de conhecer Jesus?","• Lições de vida: Como percebi que precisava de Jesus?","• Boas-novas de salvação: Que diferença Jesus faz em minha vida?","Nas linhas abaixo, escreva seu testemunho com base nos pontos acima. _________________________________________________________________________ _________________________________________________________________________ _______________________________________________________________________ __ ______________________________________________________________________ ___ _____________________________________________________________________"]},{"page":90,"blocks":["SEGUNDA-FEIRA","EU ERA CEGO E AGORA VEJO E m João 9, encontramos o relato de um dos milagres mais belos de Jesus. Um cego de nascença foi curado pelo Senhor e levado à presença dos líderes religiosos da época. Isso ocorreu em um sábado, algo inadmissível para os fari - seus. Então os inimigos da época tentaram provar que o milagre era falso; mas, como não conseguiram, disseram ao homem: “Dá glória a Deus; nós sabemos que esse homem [Jesus] é pecador” (Jo 9:24). O ex-cego respondeu com lindas palavras: “Se é pecador, não sei; uma coisa eu sei: eu era cego e agora vejo” (v. 25). Os líderes judeus não puderam falar mais nada. Não existem argumentos contra a evidência de uma vida transformada. Pense em como você pode compartilhar Jesus com as pessoas.","1. Seja breve: o homem que foi curado conseguiu testemunhar em poucas","palavras. A questão principal não é o tempo que levamos para falar, mas a men - sagem e o modo que a transmitimos.","2. Não use termos desconhecidos. Muitas vezes, usamos expressões que não","fazem sentido para quem está conhecendo a igreja e a Palavra de Deus.","3. Não seja nem pareça prepotente. Quando descobrimos verdades bíblicas,","corremos o perigo de adotar uma atitude de superioridade para com as pes - soas que ainda não a conhecem. Isso prejudica o testemunho.","4. Ore. Ao testemunhar, permaneça orando em pensamento, pedindo ao Espírito Santo que atue por seu intermédio.","5. Confie no Espírito Santo. É Ele quem dá poder para um testemunho eficaz.","“Mas recebereis poder, ao descer sobre vós o Espírito Santo, e sereis Minhas testemunhas tanto em Jerusalém, como em toda a Judeia e Samaria e até aos confins da Terra” (At 1:8). Sem o poder do Espírito Santo, nunca poderemos dar um testemunho que transforme vidas. “A cada manhã, quando os arautos do evangelho se ajoelham perante o Senhor, renovando-Lhe seus votos de consagração, Ele lhes concede a presença de Seu Espírito, com Seu poder vivificante e santificador. Ao saírem para seus deveres diários, eles têm a certeza de que a invisível atuação do Espírito Santo os habilita a ser ‘cooperadores de Deus’ (1Co 3:9, ARC)” (Atos dos Apóstolos, p. 56). Leia Lucas 11:9 a 13. Qual é a garantia de que Deus deseja nos dar o poder do Espírito Santo? _________________________________________________________________________ Ore neste momento e peça a Deus a presença e o poder do Espírito Santo em sua vida.","SEMANA  3"]},{"page":91,"blocks":["TERÇA-FEIRA","DESCOBRINDO MEU DOM ESPIRITUAL H oje vamos estudar sobre dons espirituais. Mas o que é isso? Os dons espi - rituais são habilidades distribuídas pelo Espírito Santo aos cristãos, con - forme a vontade de Deus. São ferramentas divinas outorgadas aos crentes pelo Espírito Santo, a fim de que tenham com que trabalhar na causa de Cristo. Em 1 Coríntios 12:1 a 26, encontramos vários esclarecimentos sobre os dons espirituais. Por exemplo: (1) Paulo deseja que nenhum cristão seja ignorante a respeito dos dons espirituais (v. 1). (2) Há diversos dons, e todas as pessoas que nascerem em Cristo receberão algum dom espiritual (v. 4, 7). (3) Não devo achar que meu dom é insignificante ou menos importante por não se destacar. Todo dom cumpre seu propósito para o funcionamento do corpo de Cristo (v. 15, 16). (4) Não devo menosprezar o dom dos outros ou achar que todos devem ter os mesmos dons que eu (v. 21, 22). Ellen White faz a seguinte declaração sobre o propósito dos dons espirituais: “Deus contemplou homens e mulheres com preciosos dons. A indivíduos dife - rentes, Ele concedeu dons diferentes. Nem todos têm a mesma força de cará - ter ou a mesma profundidade de conhecimento. Mas cada um deve usar seus dons no serviço do Mestre, por menores que possam ser esses dons. O fiel mordomo negocia sabiamente os bens que lhe foram confiados” ( Olhando Para o Alto, p. 373). Como descobrir seu dom? (1) Ore sobre o tema. Esse é um assunto espiritual, portanto converse com Deus em oração. (2) Envolva-se em várias atividades. Você deve estar disposto a exercitar. Isso ajudará você a identificar sua vocação. (3) Fique atento a seus sentimentos. Um meio eficaz para identificar se você tem certo dom é notar como se sente ao realizar determinadas tarefas. (4) Avalie sua eficácia. O que você faz está dando resultados positivos? (5) Peça a opinião de cristãos que conheçam você e sejam mais experientes. Outro ponto que precisa ficar claro são as responsabilidades que são com - partilhadas por todos os cristãos, independentemente dos dons específicos. São elas: comunhão, testemunho e fidelidade. Nem todos os cristãos têm o dom de profecia, mas todos devem ter uma sólida comunhão diária com Deus por meio do estudo da Bíblia para conhecer o que nos foi revelado. Nem todos os cristãos têm o dom de evangelista, mas todos são chamados a testemunhar de sua fé e a levar alguém a Jesus. Nem todos os cristãos têm o dom da generosidade, mas todos são chamados a ser fiéis a Deus na devolução dos dízimos e das ofertas.","SEMANA  3"]},{"page":92,"blocks":["QUARTA-FEIRA","COMO LEVAR ALGUÉM A CRISTO – PARTE 1 A maioria das pessoas toma a decisão de entregar a vida a Jesus a partir de contatos com amigos e parentes próximos. Esse é o ponto de partida para qualquer missionário que deseja testemunhar de sua fé. Em seguida, ele deve seguir três passos:","1. Ore. Tudo começa com a oração em favor de alguém a ser alcançado. Assim","como Jesus orou para que você viesse a conhecê-Lo (veja Jo 17:20), você deve orar por aqueles que ainda não chegaram ao pleno conhecimento da mensa - gem da Palavra de Deus. Permaneça firme em oração pelas pessoas que você escolheu na lição de domingo.","2. Relacione-se com as pessoas de maneira amável, demonstrando bondade","e preocupação por elas. “O argumento mais forte em favor do evangelho é um cristão que sabe amar e é amável” ( A Ciência do Bom Viver, p. 470).","3. Ofereça um estudo bíblico. Explique a Palavra de Deus e compartilhe seu","testemunho pessoal. Seguindo esses passos, Deus vai guiar você até o momento certo de oferecer um estudo bíblico às pessoas contatadas. Forme uma dupla missionária com alguém de sua igreja e assuma o compromisso de explicar a Bíblia para o interessado. Nossas ações de testemunho são praticadas em três partes: comunhão  com Deus por meio da Bíblia e da oração (Jo 15:7); relacionamento com amigos e irmãos (Jo 15:12); missão  de salvar os perdidos (Jo 15:8). Mãos à obra:","1. Estudar a Bíblia semanalmente com: __________________________________","2.  Ensinar os seguintes hábitos durante cada estudo bíblico:","• Espirituais (estudar a Bíblia, Lição da Escola Sabatina  e o Primeiro Deus).","• Saudáveis (praticar os oito remédios naturais).","• Financeiros (fazer planejamento e orçamento pessoal/familiar).","• Missionários (ministrar cursos bíblicos e participar de pequenos grupos).","3. Praticar a oração intercessória. Ore pela pessoa com quem você está estu -","dando a Bíblia. Oriente-a a fazer uma lista com o nome dos familiares e dos amigos que ela deseja compartilhar a verdade.","4. Convidar familiares e amigos do interessado para estar no batismo dele e","lhes oferecer estudo bíblico (usar os convites batismais).","5. Formar uma dupla missionária com a pessoa recém-batizada e estudar a","Bíblia com um ou mais dos amigos dela. Neste momento, fale com Deus e peça ajuda e orientação divina para colo - car em prática o que você aprendeu hoje.","SEMANA  3"]},{"page":93,"blocks":["QUINTA-FEIRA","COMO LEVAR ALGUÉM A CRISTO – PARTE 2 A o receber o chamado divino de falar de Jesus para as pessoas, você pode ser tentado a pensar: “Nunca serei capaz de estudar a Bíblia com alguém. Não me sinto preparado. Não saberei responder a todas as perguntas.” Se isso tem acontecido com você, lembre-se de que o poder está na Palavra de Deus e não em nós. Quando estudamos a Bíblia com um interessado, estamos com - partilhando o poder de Deus. E só Ele pode transformar vidas. Existem três princípios fundamentais na arte de dar estudos bíblicos:","1. Apresente Jesus. Ao estudar a Bíblia com alguém, precisamos entender","que “Cristo é tudo em todos” (Cl 3:11). Ele é o assunto principal e deve ser exaltado em cada estudo bíblico. Ellen G. White ensina: “Toda verdadeira doutrina torna Cristo o centro, todo preceito recebe força de Suas palavras” (Testemunhos Para a Igreja, v. 6, p. 54).","2. Revele as verdades gradualmente. As doutrinas bíblicas não podem ser","apresentadas todas de uma vez. Isso certamente vai confundir as pessoas. Por isso, é importante usar um guia de estudos bíblicos. A cada encontro, lições com temas definidos devem ser apresentados em uma ordem lógica e progressiva: do assunto mais fácil para o mais difícil.","3. Faça apelos regulares. Assim que o interessado compreender um deter -","minado assunto, convide-o a tomar uma decisão. Por exemplo, se ele entendeu que o sábado foi santificado na criação e que deve ser guardado por todos os cristãos, diga: “Experimente a alegria de guardar o sábado.” Convide-o para ir à igreja com você no sábado seguinte. Essas atitudes simples e fáceis podem ajudar muito na apresentação da Pala - vra de Deus. Em realidade, o bom senso é fundamental, pois cada pessoa é um “universo”, com seus preconceitos e hábitos. As dicas a seguir podem facilitar os momentos que precedem o estudo bíblico:","• Deixe que a pessoa escolha o local e o horário do estudo.","• Chegue à casa do interessado com alegria e confiança.","• Demonstre interesse e preocupação por todos os membros da família.","• Converse sobre os acontecimentos da semana.","• Convide para o estudo.","Antes de apresentar o tema do dia, é importante recapitular o assunto anterior e tirar eventuais dúvidas que tenham surgido ao longo da semana. Sem - pre comece com uma oração, pedindo a orientação do Espírito Santo. Durante o estudo, oriente o interessado a encontrar as respostas na Bíblia. Explique o texto, responda às perguntas e envolva o estudante na leitura e anotação das respostas.","SEMANA  3"]},{"page":94,"blocks":["94 Voltar ao menu SEMANA  3","SEXTA-FEIRA","MEU TALENTO, MEU MINISTÉRIO L eia com atenção as seguintes citações de Ellen G. White: “É necessário se pôr em íntimo contato com o povo mediante esforço pessoal. Caso se empregasse menos tempo a pregar sermões e fosse mais dedicado ao serviço pessoal, maiores seriam os resultados que se veriam. Os pobres devem ser socorridos, os doentes devem ser cuidados, os aflitos e os que sofrem perdas devem ser confortados, os ignorantes e os inexperientes devem ser instruídos e aconselhados. [...] Aliado ao poder de persuasão, ao poder da oração e ao poder do amor de Deus, esta obra jamais ficará sem frutos” ( A Ciência do Bom Viver, p. 143, 144). “Muitos não têm fé em Deus e perderam a confiança no homem. Mas apre - ciam ver atos de simpatia e prestatividade. Ao verem alguém sem qualquer incentivo de louvor terrestre ou compensação se aproximar de seus lares, aju - dando os enfermos, alimentando os famintos, vestindo os nus, confortando os tristes […], seu coração é tocado” ( Medicina e Salvação , p. 247). Essas citações acrescentam um detalhe importante à nossa compreensão de missão. Cuidar de doentes, ensinar, aconselhar e alimentar são atividades relacionadas a diversas profissões. Isso nos mostra que podemos empregar as habilidades que usamos no dia a dia como um poderoso instrumento de evan - gelismo. Não se trata apenas de testemunhar em nosso ambiente de trabalho, mas de colocar nossa profissão a serviço do reino de Deus. Não é somente o pastor que serve à causa de Deus. Afinal, “homens não chamados ao ministério evangélico devem ser animados a trabalhar para o Mestre segundo suas dife - rentes habilidades” (Beneficência Social, p. 109). Você deve criar maneiras de servir por meio de sua profissão. Uma cabelei - reira, por exemplo, pode tirar um dia na semana ou no mês para cortar cabelo de pessoas que não podem pagar; um professor pode iniciar uma classe gratuita de aulas preparatórias para o vestibular; uma médica pode se colocar à disposição para trabalhar em uma feira de saúde promovida pela igreja. Procure colocar em prática os passos a seguir:","1. Pense em como suas habilidades ou profissão podem servir às pessoas.","2. Coloque-se à disposição de sua igreja local para iniciar um ministério de","serviço.","3. Interceda pelas pessoas atendidas e lhes ofereça estudos bíblicos.","Que Deus abençoe você e o use poderosamente!"]},{"page":95,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":96,"blocks":["Voltar ao menu SEMANA  496","SÁBADO","FORMAÇÃO DA IGREJA ADVENTISTA DO SÉTIMO DIA N esta semana, você conhecerá como funciona a igreja e entenderá como usar seus dons nessa estrutura. O termo “igreja” pode ser usado para se referir: (1) à organização, (2) ao pré - dio de culto e (3) ao povo de Deus. Por exemplo, quando dizemos que a igreja cuida bem dos pastores ou que ela defende o casamento monogâmico e hete - rossexual, estamos usando o termo “igreja” no sentido de organização . Porém, quando dizemos que a igreja central fica na rua Carvalho número 500, estamos falando do prédio da igreja. Por sua vez, quando falamos que a Igreja Adven - tista é compos
