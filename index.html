const DATA = [{"id":"inicio","title":"Apresentação e como usar","type":"intro","pages":[{"page":1,"blocks":["IR PARA O MENU Acesse nosso menu interativo de estudos","Clique no player e assista o vídeo com as orientações gerais"]},{"page":2,"blocks":["© Todos os direitos reservados à Divisão Sul-Americana da Igreja Adventista do Sétimo Dia Coordenação geral Herbert Boger Júnior Participação especial Luís Gonçalves Revisão de conteúdo teológico: Bruno Raso, Adolfo Suárez e Diogo Cavalcanti Revisão e criação de texto: Larissa Preuss Projeto audiovisual: Rodrigo Cézare Conteúdo digital: Liane Prestes Editor de arte: Rômulo Corrêa Ilustração: Adobe Stock Coordenação editorial: Diogo Cavalcanti Editoração: Guilherme Silva e André Vasconcelos Revisão: Luciana Gruber e Anne Lizie Hirle IMPRESSO NO BRASIL / Printed in Brazil Impressão e acabamento: Casa Publicadora Brasileira Os textos bíblicos citados neste livro foram extraídos da versão Nova Almeida Atualizada, salvo outra indicação. Tipologia: Interstate 9,2/11,5 – 19808/43009"]},{"page":3,"blocks":["SUMÁRIO","COMO USAR ESTE MATERIAL .................................................................... 4","ESTUDO 1 – Jesus e as Escrituras Sagradas ................................... 5 ESTUDO 2 – Jesus e o Amor Divino .................................................. 8 ESTUDO 3 – Jesus e a Restauração do Bem  ................................. 11 ESTUDO 4 – Jesus e a Oração ......................................................... 14 ESTUDO 5 – Jesus e a Salvação ...................................................... 17 ESTUDO 6 – Jesus e a Intercessão ................................................. 20 ESTUDO 7 – Jesus e o Destino do Mundo ...................................... 23 ESTUDO 8 – Jesus e a Vida Eterna .................................................. 26 ESTUDO 9 – Jesus e o Juízo ............................................................ 29 ESTUDO 10 – Jesus e a Lei de Deus ............................................... 32 ESTUDO 11 – Jesus e o Sábado ...................................................... 35 ESTUDO 12 – Jesus e a Igreja .......................................................... 38 ESTUDO 13 – Jesus e o Crescimento Espiritual ............................ 41 ESTUDO 14 – Jesus e a Fidelidade .................................................. 44 ESTUDO 15 – Jesus e o Batismo ..................................................... 47 ESTUDO 16 – Jesus e o Estilo de Vida Cristão .............................. 50 ESTUDO 17 – Jesus e a Missão da Igreja ....................................... 53 ESTUDO 18 – Jesus e o Dom de Profecia ....................................... 56 ESTUDO 19 – Jesus e o Espírito Santo ........................................... 59 ESTUDO 20 – Jesus e a Nova Terra  ................................................ 62","Clique no ícone        e vá direto ao estudo bíblico"]},{"page":4,"blocks":["ESTUDO BÍBLICOESTUDO BÍBLICO DESCUBRA UMA NOVA FORMA DE ESTUDAR A BÍBLIA Este guia de estudos bíblicos foi planejado para você estudar a Bíblia de uma forma ainda mais interessante e completa. Além de um estudo dirigido sobre os maiores temas da Bíblia, ele oferece histórias para refl  exão, perguntas interativas, textos para meditação e atividades práticas. O objetivo é fortalecer a confi  ança na Palavra de Deus e ajudar pessoas a encontrar nela Jesus, o restaurador da vida. Além dessas novidades, este guia oferece conteúdos explicativos adicionais em vídeos disponíveis nos QR Codes, que podem ser lidos por celulares equipados com câmera. Para assistir aos vídeos, siga os passos:  Abra a câmera do seu celular;  localize o QR Code na lição;  aponte a câmera para o QR Code – essa funcionalidade requer acesso à internet (wi-fi ou 4G);  você verá no topo da tela de seu celular uma mensagem em formato de notifi  cação; clique nessa notifi  cação para começar a assistir ao vídeo. Cada estudo contém dois vídeos:no primeiro, você encontrará uma história para iniciar o assunto da lição; no segundo, você encontrará a recapitulação do tema e um convite especial. CONTINUE APRENDENDO AO LONGO DA SEMANA Ao fi  m de cada tema, você também encontra o Estudo Adicional, que aprofunda o tema estudado e deve ser feito ao longo da semana. Ele é composto de três partes (Comunhão,","Relacionamento e Missão). Ele o ajuda a aprender, com","dicas simples e práticas, o que é ser um discípulo de Jesus. As  atividades são complementadas pelo guia Crescendo em Cristo, que vem logo após os estudos. Ele é um material excelente para ampliar e aprofundar seus conhecimentos. Recursos digitais Ao fi  m de cada estudo, o estudante da Bíblia encontra acesso a diversas plataformas digitais, com recursos riquíssimos para ler, ouvir, assistir e compartilhar."]}]},{"id":"estudo-1","title":"Estudo 1 — Jesus e as Escrituras Sagradas","type":"study","pages":[{"page":5,"blocks":["Voltar ao menu5 Escrituras Sagradas","JESUS E AS","ESTUDO 1 O que é a verdade? Cada vez parece mais difícil separar o verdadeiro do falso. Vivemos em tempos confusos. Boatos se passam por fatos. Porém, percebemos que a mentira nunca termina bem e conduz para a morte. Quer um exemplo? O acidente de Chernobyl, ocorrido em 1986, na Ucrânia. A terrível verdade sobre o vazamento nuclear foi encoberta e isso levou à morte de milhares de pessoas inocentes. Então, como encontrar a verdade? Como se manter lúcido e sensato em meio à loucura produzida pela mentira que nos rodeia? O que pode restaurar a verdade? Por que é uma questão de vida ou morte saber onde e como  encontrar a verdade? Neste estudo vamos entender melhor como Deus revela a verdade por meio da Bíblia. Sua vez de procurar: Atos 8:26 a 40. Leia a história de Filipe e o etíope. Nessa história percebemos que a busca pela verdade não é algo restrito a um grupo de pessoas. De fato, todos precisamos da verdade para viver. O etíope era uma pessoa instruída, mas não conseguia entender o significado espiritual da mensagem profética. Ou seja, nem sempre cultura e instrução garantem o entendimento das coisas celestiais. Contudo, aquele oficial era sincero em sua busca pela verdade. Deus conhecia seu coração e enviou Filipe para ajudá-lo. Ao ouvir a explicação de Filipe sobre a morte de Jesus, descrita pelo profeta Isaías (capítulo 53:7 e 8), as coisas começaram a fazer sentido para o oficial etíope. Seu coração se encheu de alegria e gratidão por finalmente encontrar a verdade que tanto havia buscado! Por que às vezes precisamos de ajuda para começar a entender a Bíblia? Assista o vídeo do Pr. Luís Gonçalves","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":6,"blocks":["1. Qual era a fonte de inspiração dos profetas bíblicos? 2 Pedro 1:21","Filosofia    Ideias pessoais  O Espírito Santo","2. Onde se origina a mensagem dos profetas? 1 Tessalonicenses 2:13","Na sabedoria humana Em Deus  Na experiência pessoal","3. Toda a Bíblia é inspirada? 2 Timóteo 3:16","Só o Antigo Testamento     Só o Novo Testamento         Toda a Bíblia","4. O que devemos buscar nas Escrituras? João 5:39","Prosperidade material Vida eterna Sucesso profissional","5. Quem é o Verbo (ou a Palavra) descrito no evangelho de João? João 1:1 a 4 e 14","6. Que método Deus usou para criar todas as coisas? Salmo 33:9","7. O que o centurião disse a Jesus? Por que Jesus Se admirou? Mateus 8:8 a 10","8. Como Jesus intrepretava as Escrituras? Lucas 24:27","Compromisso de fé: Desejo conhecer mais a Bíblia, a fim de colocá-la em prática e ser restaurado por Jesus todos os dias. Nome:                  Data: O que mais chamou sua atenção até agora? Você aprendeu algo novo?","Para pensar","• “A Tua palavra é a verdade” (João 17:17).","•  “Jesus respondeu: – Eu sou o caminho, a verdade e a vida” (João 14:6).","Estamos buscando a verdade nas fontes erradas? A verdade está na Palavra, que revela Jesus e o plano da redenção, por meio de Sua morte na cruz.","•  “Conhecerão a verdade, e a verdade os libertará” (João 8:32).","Por que às vezes preferimos ficar presos a ilusões agradáveis? Algum desses pontos é mais importante para você? Qual?","Como estudar, meditar e compreender a Bíblia","• Ore a Deus pedindo sabedoria antes de ler e estudar as Escrituras.","• Compare textos e analise o livro, o capítulo e os versos antes e depois.","•  Medite, pensando: O que Deus está dizendo para mim? O que Ele espera de mim?","Levando em conta meu conhecimento acerca de Deus, que decisão devo tomar?","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":7,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Jesus orou por você: “Não peço somente por estes, mas também por aque - les que vierem a crer em Mim, por meio da palavra que eles falarem” (João 17:20). Jesus também quer Se relacionar com você: “E o Verbo Se fez carne e habitou entre nós, cheio de graça e de verdade, e vimos a Sua glória, glória como do unigênito do Pai” (João 1:14). Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Mateus 5:1 a 12 2 Mateus 5:13 a 26 3 Mateus 5:27 a 48 4 Mateus 6:1 a 15 5 Mateus 6:16 a 34 6 Mateus 7:1 a 14 7 Mateus 7:15 a 29 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar). Quer receber notícias, informações e conteúdos para seu crescimento espiritual? WhatsApp: Salve nosso número em seus contatos +55 (61) 98169-0215 e envie a palavra: ADVENTISTA","RELACIONAMENTO","Se possível, converse com uma pessoa conhecida sobre um dos textos acima que mais tocou seu coração e diga para ela o porquê.","MISSÃO","Filipe recebeu a indicação do anjo e do Espírito Santo para explicar as Escrituras ao oficial etíope (Atos 8:26-40). Deus conhece seu coração e também enviou alguém até você. Deus pode enviar você para falar de Sua Palavra para alguém. Que oportunidades Deus está lhe dando para fazer exatamente isso? Pense pelo menos em uma pessoa:  . Ore por ela e compartilhe este estudo.","SAIBA MAIS EM: ntplay.com/evidencias","EVIDÊNCIAS HISTÓRICAS DA BÍBLIA POR MEIO DA ARQUEOLOGIA"]}]},{"id":"estudo-2","title":"Estudo 2 — Jesus e o Amor Divino","type":"study","pages":[{"page":8,"blocks":["Sua vez de procurar: Lucas 15:11 a 24. Leia a parábola do filho perdido. Essa é a história de um filho que desejou a morte do pai. Para ele, o pai era apenas uma conta bancária. A presença, o tempo, o amor e a vida do pai não tinham valor para o filho. O filho queria uma vida longe do pai, mais livre, para fazer o que quisesse com sua herança. Impaciente, o filho pede o direito à sua parte dos bens, mesmo o pai estando vivo. É como se ele tivesse matado o velho pai. O filho ingrato vai embora para uma terra distante. O pai o espera por muito tempo. Certo dia, um vulto estranho surge ao longe, magro, sujo e esfarrapado. Mais de perto, parece ser o filho. O pai não hesita. Sai correndo ao encontro dele e o abraça entre lágrimas. Assim é o amor de Deus por você. Ele nunca o rejeita, sempre está de braços abertos. Ele quer devolver sua dignidade como filho de Deus. Jesus diz que o moço, “caindo em si”,  decidiu retornar (v. 17). O que significa “cair em si”? V ivemos em tempos de muita emoção e pouco amor. Na verdade, amor e emoção não são a mesma coisa. O verdadeiro amor é muito mais que sentimento. A maior história de amor foi escrita na Palavra de Deus. É o relato de um amor que não teme a humilhação e a rejeição, que busca a pessoa amada, gasta tudo para reconquistá-la e, por fim, Se entrega à morte por ela. Deus é amor: amor não é o que Ele tem, mas o que Ele é. O amor de Deus é tão grande que Ele entregou Seu único Filho. O Filho sofreu e morreu por amor. E a razão de todo esse amor é você! Somente esse amor é capaz de resgatar você e lhe conceder perdão e paz para seguir em frente. Só o amor de Deus pode restaurar verdadeiramente a vida. Neste estudo, vamos refletir sobre o doce tema do amor divino. amor divino","JESUS E O","ESTUDO 2","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":9,"blocks":["1. Qual é a essência do caráter de Deus? 1 João 4:8","Tirania       Amor    Indiferença","2. Qual foi a maior prova do amor de Deus a todo o mundo? João 3:16","Enviar Jesus      Salvar os que Nele creem  Dar a vida eterna","3. Deus tem prazer... Miqueias 7:18","No castigo      Na morte   Na misericórdia","4. Quais são as três Pessoas da Divindade, unidas em amor? Mateus 28:19","5. Ao que a Bíblia compara a compaixão de Deus? Salmo 103:13 e 14","6. Que imagem Jesus apresentou do Pai celestial? Mateus 7:9 a 11","7. O que pode nos separar do amor de Deus? Romanos 8:38 e 39","Dicas para conhecer a Deus mais de perto","• Coloque Deus em primeiro lugar a cada dia (Mateus 6:33).","• Ame a Deus de todo coração e o próximo como a si mesmo (Mateus 22:37 a 39).","•  Ame e acolha todas as pessoas, principalmente as mais vulneráveis, não só","de palavra, mas na prática (1 João 3:16 a 18). Compromisso de fé: Enxergar a Deus do jeito certo gera amor espontâneo, afeto, bondade, perdão e adoração (Tiago 4:8 e 9). Ao conhecer mais o amor de Deus, sinto o desejo de viver e andar com Ele todos os dias. Quero ser verdadeiro em minhas ações e intenções para com Ele e com as outras pessoas. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":10,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","A primeira coisa que precisamos saber sobre a oração é que Deus nos ouve sem nos acusar; Ele nos ouve como nosso melhor amigo. “Amo o Senhor, porque Ele ouve a minha voz e as minhas súplicas. Porque inclinou para mim os Seus ouvidos, eu O invocarei por toda a minha vida” (Salmo 116:1 e 2). Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Gênesis 1:1 a 5 2 Gênesis 1:26 a 31 3 Salmo 8:1 a 9 4 João 1:1 a 3 5 Colossenses 1:15 a 17 6 Filipenses 4:8 7 2 Timóteo 3:1 a 4 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","“Posso pegar meu telescópio e ver milhões de quilômetros de distância no espaço; contudo, também posso pôr meu telescópio de lado, ir para o meu quarto, fechar a porta e, em oração fervorosa, ver mais do Céu e me aproximar mais de Deus do que quando estou equipado com todos os telescópios e instrumentos do mundo.” Essa frase é atribuída a Isaac Newton, um dos maiores cientistas da história. Em cada detalhe da natureza podemos encontrar marcas do amor de Deus. Observar a beleza e a grandiosidade da criação faz muito bem. Experimente passar um tempo todos os dias observando alguma coisa do mundo natural. O que você mais admira na natureza? Por quê? Podemos apreciar as obras de Deus. Busque na internet as “digitais do Cri - ador” e perceba como os detalhes da natureza apontam para um planejamento inteligente e, acima de tudo, para o amor divino.","MISSÃO","De que maneira você pode compartilhar o amor de Jesus dia a dia com seu cônjuge, filhos, familiares, amigos e até mesmo com desconhecidos? O serviço da ADRA é uma forma de amar o próximo. Ela é a Agência Humanitária da Igreja Adventista do Sétimo Dia, atuando no Brasil e em mais de 130 países. Conheça o trabalho desenvolvido por ela e como você pode ajudar em adra.org.br Quer receber notícias, informações e conteúdos para seu crescimento espiritual? WhatsApp: Salve nosso número em seus contatos +55 (61) 98169-0215 e envie a palavra: ADVENTISTA"]}]},{"id":"estudo-3","title":"Estudo 3 — Jesus e a Restauração do Bem","type":"study","pages":[{"page":11,"blocks":["Voltar ao menu11 Sua vez de procurar: Mateus 13:24 a 30, 36 a 43. Leia  “A parábola do joio”. Parábola é uma história que nos faz pensar e extrair lições que vão além do que está sendo contado. É um jeito simples e sábio de ensinar verdades profundas. Na parábola do trigo e do joio, Jesus falou sobre um semeador que plantava sementes boas em terra fértil. Também havia um inimigo que sabotou a plantação, jogando sementes de ervas daninhas. Como as sementes eram pequenas, as ervas daninhas só apareceram quando tudo começou a brotar. Então os trabalhadores se espantaram ao perceber o joio no meio do campo de trigo. Como isso teria acontecido? A vontade deles era de arrancar o joio. Pacientemente, o sábio dono do campo disse para eles esperarem. As raízes das plantas de trigo estavam frágeis. Qualquer movimento brusco poderia arrancá-las, e todo o trabalho seria em vão. Jesus comparou os filhos de Deus ao trigo, e os maus, ao joio semeado pelo inimigo de Deus. Temos condição de dizer quem é trigo e quem é erva daninha em meio ao povo de Deus? O que essa parábola ensina sobre julgar os outros? D eus nos criou livres e não nos obriga a amá-Lo. Escolheu assumir o risco de ser rejeitado, sabendo que o verdadeiro amor só é real onde existe liberdade. Por outro lado, não aceitar o amor divino produz as consequências da falta de amor: medo, ódio e morte. Quando Satanás, o inimigo de Deus, se rebelou contra esse amor, tudo mudou. O Universo ficou manchado pela tristeza. Não satisfeito em se separar do amor de Deus, o inimigo levou outros pelo mesmo caminho. E ele faz isso até hoje. Jesus, porém, nos liga a Deus. Sem Ele, jamais poderíamos estar em contato com o Senhor. Ao viver e morrer por você e por mim, Jesus nos garantiu a chance de permanecermos ligados a Ele. Cabe a nós segurar firme Sua mão para vencer o mal que nos rodeia. Neste estudo vamos entender mais sobre o grande conflito entre o bem e o mal e como Deus atua para trazer a vida e a paz ao mundo. restauração  do bem","JESUS E A","ESTUDO 3","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":12,"blocks":["1. Onde o mal começou? Apocalipse 12:7 a 10","Na Terra   No Céu   No jardim do Éden","2. Quem originou o pecado? Ezequiel 28:14 a 17","Um anjo exaltado  Um ser humano teimoso","3. O que Deus estabeleceu para preservar o livre-arbítrio da humanidade? Gênesis 2:15 a 17","A árvore do conhecimento do bem e do mal   A árvore da vida","4. Qual foi a essência do primeiro pecado? Gênesis 3:1 a 6","Gula    Sexo    Rebeldia","5. O que é o pecado? 1 João 3:4","A transgressão da lei de Deus  Uma convenção social","6.  Qual é a consequência final do pecado e qual é a resposta de Deus a todo o mal?","“Porque o salário do pecado é a                       , mas o dom gratuito de Deus é a   eterna em Cristo Jesus, nosso Senhor” (Romanos 6:23). Aprenda a confiar em Jesus e vencer o mal","•  Permaneça na presença de Jesus (1 João 3:6).","•  Não brinque com o pecado (Romanos 6:12).","•  Ore para não cair em tentação (Mateus 26:41).","•  Resista a Satanás (não ceda à pressão) em nome de Jesus (Tiago 4:7).","Compromisso de fé: Ao ler na Bíblia sobre o grande conflito entre o bem e o mal e entender a gravidade dele, quero me juntar ao exército de Jesus e Lhe entregar meu coração para não permitir que o inimigo tome posse de minha vida. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":13,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Gênesis 3 2 Apocalipse 12:7 a 12 3 1 João 3:1 a 6 4 1 João 3:7 a 10 5 1 João 3:11 a 24 6 Efésios 6:10 a 20 7 Tiago 4:1 a 10 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar). Quer receber notícias, informações e conteúdos para seu crescimento espiritual? WhatsApp: Salve nosso número em seus contatos +55 (61) 98169-0215  e envie a palavra: ADVENTISTA","RELACIONAMENTO","“Em todas estas coisas, porém, somos mais que vencedores, por meio Daquele que nos amou” (Romanos 8:37). Converse com alguém que esteja desanimado com alguma coisa que não consegue resistir e superar. Conte a essa pessoa que Jesus nos ajuda a vencer o mal.","MISSÃO","Você conhece alguém que está passando por lutas espirituais que só Deus pode resolver? Que tal orar agora por essa pessoa? Experimente compartilhar este estudo com ela! Conheça a plataforma de streaming de conteúdo cristão e educativo feliz7play.com. Assista a filmes, séries, documentários e muito mais."]}]},{"id":"estudo-4","title":"Estudo 4 — Jesus e a Oração","type":"study","pages":[{"page":14,"blocks":["A oração é parte fundamental da vida cristã. É orando ao Deus todopoderoso, em nome e pelos méritos de Jesus, que obtemos perdão para os pecados e o poder para vencer as tentações. Sem a oração, morremos espiritualmente. Muitas vezes, porém, a oração se torna apenas uma repetição ou um discurso com palavras vazias. Jesus nos ensinou a falar com Deus com a mesma confiança que uma criança fala com seu pai. Certa vez perguntaram a C. S. Lewis, um dos maiores pensadores cristãos, por que ele orava em favor de sua esposa que estava com câncer. Ele respondeu: “Deus não precisa de minha oração. Sou eu que preciso dela. A oração me aproxima de Deus, revela minha dependência, minha fome e sede por Sua vontade, Seu Reino, Sua pessoa. A  oração muda principalmente a mim – minha visão de Deus, do próximo e das circunstâncias.” Vamos estudar o que a Bíblia diz sobre a oração. Sua vez de procurar: Lucas 18:9 a 14. Leia “A parábola do fariseu e do publicano”. Cristo contou essa história sobre a diferença entre uma oração vazia e uma que Deus tem prazer em responder. Um cobrador de impostos e um fariseu (religioso) oravam no templo. No seu coração, o fariseu se achava melhor do que os outros. Certamente, quem via aquele homem orando tinha certeza de que ali estava um “santo”. Já o cobrador de impostos sabia que sua vida era indigna. Tinha vergonha de olhar para o céu; mesmo assim, apelou para a bondade de Deus e suplicou Suas misericórdias. Tinha consciência de que não merecia a graça divina, mas sabia que o Senhor é compassivo e bondoso. Ao contrário do fariseu, que se achava justo e não precisava de Deus, o publicano pediu humildemente o perdão e foi justificado. Como abrir o coração a Deus e experimentar Seu perdão? oração","JESUS E A","ESTUDO 4","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":15,"blocks":["1. O que a Bíblia nos ensina sobre a oração?","a) Mateus 6:6:","b) João 14:13 e 14:","c) Salmo 62:8:","d) 1 Timóteo 2:1:","e) Atos 16:25:","f) Daniel 6:10:","g) Daniel 9:4 e 5:","h) Mateus 7:7 e 8:","2. Qual foi a condição apresentada por Jesus no final de Sua oração? Marcos 14:36","3. Jesus orou por quais pessoas? João 17:20","4. A exemplo de Jesus, o que devemos fazer? Tiago 5:16","Ore de modo restaurador","•  Ame os inimigos (Mateus 5:44)","•  Não caia em tentação (Marcos 14:38)","•  Pregue a Palavra de Deus (Atos 6:6 e 7)","•  Interceda pelos enfermos (Tiago 5:15)","•  Clame por sabedoria (Tiago 1:5)","•  Perdoe quem ofende você (Marcos 11:25)","Como orar COMEÇO MEIO FIM Exaltação do nome de Deus (Mateus 6:9) Louvores Agradecimentos Confissões Pedidos de perdão Intercessão por pessoas Reafirmação da confiança na intercessão de Jesus (João 16:23) Compromisso de fé: Ao conhecer mais sobre a oração, entendi que ela é necessária e que devo orar todos os dias individualmente e com minha família. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":16,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Lucas 18:1 a 8 2 Romanos 12:9 a 12 3 Salmo 32:3 a 6 4 1 João 5:14 e 15 5 Daniel 6:10 6 Efésios 3:14 a 21 7 Mateus 6:5 a 15 *Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar). Conheça o portal de notícias da Igreja Adventista. Em noticias.adventistas.org você também encontra artigos sobre diversos temas, além de um conteúdo semanal em vídeo.","RELACIONAMENTO","Jesus orou por você: “Não peço somente por estes, mas também por aqueles que vierem a crer em Mim, por meio da palavra que eles falarem, a fim de que todos sejam um. E como Tu, ó Pai, estás em Mim e Eu em Ti, também eles estejam em Nós, para que o mundo creia que Tu Me enviaste” (João 17:20 e 21). Gostaria de orar para que esta pessoa conheça Jesus (escreva o nome dela):","MISSÃO","Escreva a seguir o nome de cinco amigos ou familiares. Ore por essas pessoas e compartilhe com elas este estudo.","1.","2.","3.","4.","5.","PODEMOS ORAR POR VOCÊ? ACESSE: adv.st/pedidosoracao"]}]},{"id":"estudo-5","title":"Estudo 5 — Jesus e a Salvação","type":"study","pages":[{"page":17,"blocks":["Voltar ao menu17 Sua vez de procurar: Lucas 15:3 a 7. Leia a parábola “A ovelha perdida”. A paz de uma ovelha está no cuidado de seu pastor. Jesus contou a história de um pastor de ovelhas que amava seu rebanho. Ele sentiu falta de uma de suas cem ovelhas, que conhecia individualmente. Uma delas estava faltando e corria perigo. Então ele prontamente deixou as 99 ovelhas a salvo e partiu em busca da que estava perdida. Não estava em busca de um número, mas de um animalzinho frágil que dependia dele completamente. O pastor caminhou muito até que ouviu balidos ao longe. Finalmente achou sua ovelha ferida, mas ainda com vida. Ele se alegrou muito. Da mesma forma, o divino Pastor está em busca de cada filho e filha perdidos. Um pedido de socorro sempre chega aos ouvidos do Pai. Confie nisso! Sozinhos, sem Ele, estamos perdidos, mas com Ele estamos seguros. Tem você andado longe dos caminhos de Deus e está ferido pelos espinhos do mundo? O Bom Pastor Jesus deixou o Céu para salvar você. Q ual foi a última vez em que você sentiu paz? Vivemos tempos de intranquilidade. Todos queremos ter paz, mas poucos realmente conse guem alcançá-la. A angústia está por toda a parte. Como resultado, nunca a sociedade foi tão dependente de medicamentos para manter a calma. Nunca tantas pessoas atentaram contra a própria vida. É impossível tornar o mundo um lugar perfeito agora, mas é possível alcançar a paz em Jesus. Ele viveu, sofreu e morreu para garanti-la a nós. A paz não é a ausência de conflito nem uma doce ilusão. Cristo disse: “Deixo com vocês a paz, a Minha paz lhes dou. Não a dou como o mundo a dá. Que o coração de vocês não fique angustiado nem com medo” (João 14:27). Neste estudo, vamos aprender mais sobre a salvação que Cristo oferece e nos concede a paz. salvação","JESUS E A","ESTUDO 5","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":18,"blocks":["1. Qual é a consequência final do pecado? Romanos 5:12","Doença   Solidão              Morte","2. O ser humano é capaz de resolver sozinho o problema do pecado? Jeremias 2:22","Sim, tendo bom comportamento Sim, fazendo/pagando promessas              Não","3. Como Deus resolveu o problema do pecado? Romanos 5:17 a 19","Enviou Seu Filho  Mudou a Lei             Ignorou o mal","4. Como somos justificados e salvos? Efésios 2:8","Pelas boas obras  Pelas penitências             Pela graça, mediante a fé","5. Qual é a condição para que nossos pecados sejam perdoados? Atos 3:19","6. Como obter a liberdade da morte e da escravidão do pecado? João 8:32 a 34 e 51","7. O que assegurou nossa salvação? 1 Coríntios 15:20 a 22","8. Qual é o resultado de nos entregarmos a Cristo? 2 Coríntios 5:17","9. Qual é o resultado do perdão divino? Romanos 5:1","Converse com seu instrutor bíblico O que você aprendeu hoje? Se você concorda com os textos bíblicos a seguir, marque os espaços com a letra “C”: (    ) “Todos pecaram e carecem da glória de Deus” (Romanos 3:23). (   ) “Quanto a mim, confio na Tua graça; que o meu coração se alegre na Tua salvação” (Salmo 13:5). Quais áreas de minha vida serão influenciadas por Jesus? Compromisso de fé: Após o estudo de hoje, desejo convidar Jesus para ser meu Salvador pessoal. Nome:                  Data: SÉRIE PRINCÍPIOS: Ela tem 11 episódios que ajudarão você a compreender o que os adventistas do sétimo dia pensam a respeito de diversos temas. Acesse: http://adv.st/nossosprincipios","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":19,"blocks":["RELACIONAMENTO","Na igreja, as famílias se unem na oração, na Palavra e na missão. “Cuidemos também de nos animar uns aos outros no amor e na prática de boas obras. Não deixemos de nos congregar, como é costume de alguns. Pelo contrário, façamos admoestações, ainda mais agora que vocês veem que o Dia se aproxima” (Hebreus 10:24 e 25). A Escola Sabatina é um pequeno grupo, de 8 a 12 pessoas, organizado por faixa etária, que se reúne aos sábados pela manhã. Muitos desses grupos também se reúnem durante a semana. Desde seu início no ano de 1853, em Rochester e Buck’s Bridge, Nova York, a Escola Sabatina tem se multiplicado em todo o mundo. Atualmente, ela tem mais de 20 milhões de alunos espalhados em 209 países. É por meio dessa grande escola que a maioria dos adventistas e amigos da igreja são incentivados a fortalecer a fé nas Escrituras, a aprofundar a comunhão com Deus e a testemunhar de Cristo por meio do exemplo pessoal. Gostaria de participar de um desses pequenos grupos? Para conhecer mais, acesse: adv.st/escolasabatina","MISSÃO","Que tal enviar uma mensagem para os amigos pelos quais você está intercedendo? Diga que você está orando por eles e compartilhe este estudo bíblico. Amigos Pedidos de oração","ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Romanos 5:1 a 11 2 Efésios 2:1 a 10 3 Gálatas 4:1 a 7 4 Romanos 3:21 a 26 5 1 Coríntios 15:1 a 8 6 Colossenses 3:1 a 11 7 1 João 5:1 a 12 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar)."]}]},{"id":"estudo-6","title":"Estudo 6 — Jesus e a Intercessão","type":"study","pages":[{"page":20,"blocks":["Sua vez de procurar: Marcos 11:15 a 19. Leia a história de Jesus expulsando os vendilhões. No tempo de Jesus, o sistema do templo estava manchado pela corrupção. Vender bois e ovelhas para o sacrifício rendia muito dinheiro para a elite sacerdotal. Moedas de todo o mundo eram trocadas a preços injustos, e muita exploração acontecia ali. Tristemente, a voz de Deus, que revelava Seu amor e Sua oferta de perdão aos pecadores, era sufocada pelo barulho das moedas, os gritos dos cambistas e o mugido dos animais. Parecia mais uma feira do que um lugar sagrado! Então Jesus entrou em cena. Com um chicote em mãos e autoridade divina, Ele expulsou os vendedores, purificando o templo e permitindo que as pessoas comuns, os doentes e necessitados se aproximassem de Deus e fossem abençoados. A fé em Deus não pode ser comprada nem vendida. O que significa para você que Jesus nos garante um acesso livre a Deus, sem intermediários? intercessão","JESUS E A","ESTUDO 6 V ocê conhece algum lugar sagrado? O que esses locais têm de especial? Você certamente já ouviu falar de Meca, do Vaticano, do santuário de Aparecida e do Muro das Lamentações. São alguns lugares considerados sagrados, respectivamente, pelo islamismo, pelo catolicismo e pelo judaísmo. Multidões peregrinam a esses lugares todos os anos. Nos tempos de Jesus não era diferente. Todo judeu, independentemente de onde estivesse, deveria ir pelo menos trêz vezes por ano ao templo em Jerusalém. O templo era o centro da vida da nação porque Deus era o centro da vida das pessoas. O templo era o lugar dos sacrifícios, do perdão e da adoração. Ali Deus Se manifestava pessoalmente. Não fosse a presença divina, o santuário não seria sagrado. Todo o ritual que acontecia no templo, também chamado de santuário, simbolizava Jesus, o “Cordeiro que foi morto desde a fundação do mundo” (Apocalipse 13:8, ARA). Vamos conhecer neste estudo o ministério de Jesus no santuário celestial.","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":21,"blocks":["1.  O tabernáculo ou tenda foi o primeiro templo sagrado dos israelitas. Por que Deus","ordenou que Moisés construísse o tabernáculo? Êxodo 25:8","2.  O tabernáculo que Moisés construiu no deserto foi feito a partir de qual modelo?","Hebreus 8:5 e 6 O santuário celestial O templo de Salomão O templo de Herodes","3. Em que consistia a cerimônia diária no santuário terrestre? Êxodo 28:38","4. Qual é a obra de Jesus como sumo sacerdote no santuário celestial? Hebreus 8:1 e 2","5. Por que o santuário celestial precisava ser purificado? Hebreus 9:23 e 24","6. O que Jesus faz quando confessamos nossos pecados? 1 João 1:9","7.  O que acontecerá quando Jesus terminar Seu ministério no santuário celestial?","Apocalipse 14:14 a 20","8. Que segurança o trabalho de Cristo no santuário nos dá? 1 João 2:1 e 2","Converse com seu instrutor bíblico A partir do estudo do santuário, que verdade fundamental você entendeu sobre a obra de salvação de Jesus? Compromisso de fé: Aceito Jesus como meu intercessor e substituto. Reconheço meus pecados e quero aprender a valorizar o sacrifício de Cristo, buscando Nele forças todos os dias. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":22,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 João 17:1 a 26 2 Romanos 8:31 a 34 3 Hebreus 10:19 a 25 4 Isaías 53:10 a 12 5 2 Pedro 3:13 6 Hebreus 4:14 a 16 7 1 Timóteo 2:5 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","“Em tudo tenho mostrado a vocês que, trabalhando assim, é preciso socorrer os necessitados e lembrar das palavras do próprio Senhor Jesus: ‘Mais bemaventurado é dar do que receber’” (Atos 20:35). Você conhece alguém que está passando necessidade? Necessidades não são apenas materiais como alimentos, remédios e dinheiro. Pode ser uma palavra de apoio, uma oração pelo telefone, ouvidos atentos. De que maneira você pode ajudar?","MISSÃO","Como posso aplicar o que aprendi neste estudo em minha vida e com quem vou compartilhar esse conteúdo? Amigos Necessidades APOCALIPSE.COM Aprenda mais sobre o Apocalipse por meio de artigos, vídeos e cursos."]}]},{"id":"estudo-7","title":"Estudo 7 — Jesus e o Destino do Mundo","type":"study","pages":[{"page":23,"blocks":["Voltar ao menu23 Sua vez de procurar: Mateus 25:1 a 13. Leia “A parábola das dez virgens”. Todos estavam ansiosos para participar do casamento. Dez virgens, que eram as damas da noiva, estavam com seus lindos vestidos. Para caminhar na noite escura, levavam lâmpadas abastecidas com azeite. Deveriam acender a luz assim que o noivo passasse com uma procissão em direção à casa da noiva. O trabalho delas era iluminar o caminho. Tudo o que precisavam era ter azeite necessário para que não faltasse luz quando o noivo chegasse. Porém, o noivo demorou mais do que o esperado, ficou tarde, e todas adormeceram. Metade das damas se preparou para o imprevisto e trouxe mais azeite. Quando o noivo chegou, todas acordaram, mas somente cinco tinham luz. As outras cinco ficaram desesperadas e tentaram pedir óleo às moças prevenidas. Porém, não havia óleo suficiente para todas. Cinco donzelas tentaram buscar ajuda na noite escura, mas em vão. Perderam o tão esperado casamento. Como estar preparado para o retorno de Jesus? V ocê cumpre sua palavra? Como se sente quando alguém não honra o que prometeu? Por milênios, o que as pessoas combinavam tinha valor. Atualmente, a palavra sem nenhuma garantia não vale muito. É preciso se comprometer por escrito. A Bíblia registra a maior de todas as promessas de Deus: Jesus voltará para resgatar Seus filhos. Sua volta será vista e ouvida por todos, literalmente. Embora as Escrituras não revelem o dia nem a hora desse grande acontecimento, todas as promessas feitas por Jesus se cumpriram até aqui, e esta também se cumprirá. Hebreus 10:37 nos assegura: “Aquele que vem virá e não tardará.” Vamos estudar sobre a segunda vinda de Cristo. destino do mundo","JESUS E O","ESTUDO 7","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":24,"blocks":["1. Qual é a promessa registrada em João 14:1 a 3?","Jesus voltará outra vez       Bênçãos materiais  Muita saúde","2. Como devemos considerar a promessa da volta de Jesus? Tito 2:13","Interessante  Bendita   Irrelevante","3. Como Jesus virá pela segunda vez? Mateus 24:30","Nas nuvens do céu De forma secreta  Como um mendigo","4. Quantos verão Seu glorioso retorno? Apocalipse 1:7","Somente quem tem fé Todos   Alguns","5. Qual será o propósito da volta de Jesus? Mateus 16:27","6. O que acontecerá com os que tiverem morrido fiéis a Deus? 1 Tessalonicenses 4:13 a 16","7. O que acontecerá com todos os justos? 1 Tessalonicenses 4:17","8. De que precisamos nos lembrar no preparo diário para a volta de Jesus? 2 Pedro 3:8 a 10","Converse com seu instrutor bíblico Quais as características da volta de Jesus? O que a Bíblia diz sobre a volta de Jesus","• Veremos e ouviremos tudo (1 Tessalonicenses 4:16 a 18).","• Jesus retribuirá a cada um conforme as suas obras (Mateus 16:27).","• Os que amam a vinda de Jesus receberão uma coroa de justiça (2 Timóteo 4:8).","Sinais que antecedem a volta de Jesus","• Opressão (Tiago 5:1 a 4)","• Decadência moral (2 Timóteo 3:1 a 5)","• Enfermidades (Lucas 21:11 e 26)","• Calamidades na natureza e no mundo religioso (Mateus 7:15 a 23; 24:3 a 14)","Compromisso de fé: Quero me preparar para encontrar Jesus quando Ele vier como Rei dos reis e Senhor dos senhores. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":25,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Jó 19:25 e 26 2 Isaías 25:8 e 9 3 Lucas 17:20 a 30 4 Lucas 12:38 a 42 5 1 Tessalonicenses 4:13 a 18 6 1 Coríntios 15:51 a 53 7 Atos 1:9 a 11 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","“Aquele que dá testemunho destas coisas diz: – Certamente venho sem demora. Amém! Vem, Senhor Jesus!” (Apocalipse 22:20). Como essa promessa pode ajudar você a enfrentar sofrimentos, dúvidas e desânimo? Gostaria de compartilhar o que pensa com alguém de seu grupo da igreja ou com um amigo?","MISSÃO","“E será pregado este evangelho do Reino por todo o mundo, para testemunho a todas as nações. Então virá o fim” (Mateus 24:14). Ore com seus amigos e compartilhe essa promessa com eles. Amigos Pedidos de oração ENCONTRE UMA IGREJA O site encontreumaigreja.com.br é um portal planejado para ajudar você a encontrar uma Igreja Adventista mais próxima."]}]},{"id":"estudo-8","title":"Estudo 8 — Jesus e a Vida Eterna","type":"study","pages":[{"page":26,"blocks":["Sua vez de procurar: João 11:1 a 45. Leia a históra da ressurreição de Lázaro. Marta e Maria enviaram um recado a Cristo, pedindo-Lhe que fosse até lá com urgência para curar seu irmão Lázaro. Ele, porém, morreu. Ao encontrar Marta e Maria e contemplar sua dor, Jesus chorou. Mas Cristo ordenou que o morto voltasse à vida, o que aconteceu para o assombro de todos. A ressurreição de Lázaro foi uma pequena amostra do que acontecerá no futuro. Cristo mesmo assegurou: “Eu sou a ressurreição e a vida. Quem crê em Mim, ainda que morra, viverá. E todo o que vive e crê em Mim não morrerá eternamente” (João 11:25). O que Jesus ensinou sobre a morte nesse relato? De que maneira o fato de pensar na morte como um sono pode ajudar você a enfrentar essa terrível realidade? V ocê tem medo da morte? Será que existe algo além-túmulo? Certa vez, um grande escritor revelou sua maior curiosidade: “Afinal, a morte é uma vírgula, um ponto e vírgula ou um ponto-final?” Após a entrada do pecado na Terra, o ser humano ficou sujeito a doenças e à morte. A Bíblia compara a morte a um sono. Ela não é o fim de tudo, pois Cristo Jesus venceu o pecado para destruir a morte. O grande plano da redenção foi executado: Cristo morreu e ressuscitou, e essa vitória nos assegura que a dor, o pecado e até a morte têm solução. Pela fé em Jesus, temos garantia de vida eterna. Mas o que a Bíblia diz sobre a vida após a morte? Como, quando e onde veremos nossos queridos que já se foram? Neste estudo, a Bíblia responderá a essas questões. vida eterna","JESUS E A","ESTUDO 8","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":27,"blocks":["1. Quem criou o ser humano? Gênesis 1:27","O acaso    Deus","2. Como o Senhor deu vida ao ser humano? Gênesis 2:7","Com Sua palavra  Soprando-lhe nas narinas o fôlego de vida","3. O que é a morte? Eclesiastes 12:7","Separação entre o pó da terra e o fôlego de vida: estado de total inconsciência Libertação de uma alma imortal para viver num plano espiritual","4. Qual era o plano de Deus para o ser humano? Gênesis 2:16 e 17","Vida eterna  Vida e morte","5. O que os mortos sabem? Eclesiastes 9:5, 6 e 10","Mais do que nós sabemos   Não sabem nada Menos do que nós sabemos","6. Qual foi a mentira da serpente? Como essa mentira se repete hoje? Gênesis 3:4","7. O que é alma e o que acontece com ela? Ezequiel 18:4 e 20","Em muitas versões bíblicas, o termo hebraico nefesh é traduzido por “alma”, que significa “ser vivente”, ou seja, a junção do “pó da terra” com o “fôlego de vida” (Gênesis 2:7). Em Ezequiel 18:4 e 20, a Nova Almeida Atualizada reafirma a compreensão de “alma” como o ser humano completo e traduz o termo original como “pessoa”.","8. Devemos consultar os mortos? Deuteronômio 18:10 e 11","9. Quando Jesus restaurará para nós a vida eterna? 1 Coríntios 15:21 a 23","O que a Bíblia diz sobre a vida restaurada","• Jesus foi claro ao dizer que a vida está apenas Nele (João 3:16; 11:25; 14:6).","• A aparição de mortos é obra de Satanás (2 Coríntios 11:13 a 15; Isaías 8:19 e 20).","• Jesus prometeu ressuscitar os que creem Nele (1 Tessalonicenses 4:13 a 18).","Corpo inerte (feito do pó) Fôlego de vida (vindo de Deus) Alma vivente (ser vivente) Compromisso de fé: Se eu morrer antes de Jesus voltar, quero fazer parte da ressurreição dos justos. Por isso, comprometo-me a viver na companhia de Cristo. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":28,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Atos 17:30 e 31 2 Romanos 8:31 a 39 3 1 Coríntios 15:1 a 19 4 1 Coríntios 15:20 a 28 5 1 Coríntios 15:29 a 34 6 1 Coríntios 15:35 a 46 7 1 Coríntios 15:47 a 58 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","Se você perdeu uma pessoa querida, comente na classe da Escola Sabatina ou em seu pequeno grupo como se sentiu ao aprender que os mortos estão dormindo e não sofrem mais. Como isso alterou sua ideia da volta de Jesus? Se você conhece alguém que perdeu uma pessoa querida, visite-a com um amigo da Escola Sabatina ou do pequeno grupo. Respeite a dor e o momento. Às vezes as pessoas precisam apenas da sua presença. Porém, tão logo quanto possível, compartilhe com essa pessoa a esperança da ressurreição em Cristo.","MISSÃO","Continue orando por seus amigos e compartilhe com eles este estudo bíblico. Amigos Necessidades ALÉM DA MORTE Reflita sobre a morte e o que vem depois dela. Acesse adv.st/alemdamorte e tire suas dúvidas."]}]},{"id":"estudo-9","title":"Estudo 9 — Jesus e o Juízo","type":"study","pages":[{"page":29,"blocks":["Voltar ao menu29 Sua vez de procurar: Mateus 22:1 a 14. Leia “A parábola da festa de casamento”. Essa é a história de um rei que preparou um banquete de casamento para seu filho. O próprio rei forneceu roupas do palácio para os convidados. A festa estava pronta, a mesa era farta e a música já alegrava os corações. Aquele dia tinha tudo para ser inesquecível para os convidados encontrados nas ruas. Eles, mais do que depressa, trocaram suas roupas humildes pelas valiosas vestes reais. Porém, um convidado destoava e não estava com as vestes oferecidas a ele. Acabou sendo convidado pelo rei a se retirar. À primeira vista, a reação do rei parece muito severa. Afinal, o que é uma roupa quando o importante são as pessoas? Mas aquele convidado, por qualquer razão, simplesmente optou por não atender ao único pedido do rei, de usar uma belíssima roupa que lhe foi oferecida gratuitamente. Ele tinha a oportunidade de entrar ou não na festa, mas não tinha o direito de estabelecer as próprias regras naquela celebração. O que essa parábola ensina sobre a maneira como Deus julga? A quem você recorre quando é injustiçado? Se, por um lado, todos colhemos o que semeamos, por outro sofremos coisas ruins sem merecer. Muitas vezes, pessoas boas sofrem, enquanto pessoas más se dão bem. Alguns se colocam acima da lei. Outros chegam a celebrar a impunidade. No mundo virtual, em que é possível se esconder no anonimato, somos tentados a pensar que nossas ações não têm consequências. Mas a Bíblia nos lembra de que todos seremos julgados por Deus de acordo com nossas escolhas. Em verdade, nosso destino eterno está sendo decidido e um dia nos encontraremos com o grande Juiz, para a alegria de alguns e o desespero de outros. Todo aquele que verdadeiramente se arrepender e confiar em Jesus não precisa ter medo. Cristo, nosso Advogado e Intercessor, vestirá com Sua própria justiça aqueles que, pela fé, se arrependerem de seus pecados e Lhe pedirem perdão. Estudaremos agora sobre o juízo divino. juízo","JESUS E O","ESTUDO 9","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":30,"blocks":["1. A quem Deus, o Pai, confiou o julgamento? João 5:22","Aos profetas  A Jesus, o Filho  Aos anjos","2. Quem estará livre do “juízo” (condenação)? João 5:24","Todos   Os que ouvem a Palavra e creem nela Os mortos","3. Quem ressuscitará para o juízo final? João 5:28 e 29","Os justos  Os ímpios","4. Quantos comparecerão perante o tribunal de Cristo? 2 Coríntios 5:10","Todos    Os justos    Os maus ressuscitados As três fases do juízo: 1º Juízo investigativo","• O juízo começa pelos membros da casa de Deus (1 Pedro 4:17)","•  Nessa ocasião, o Senhor analisa os registros do Céu referentes ao povo de","Deus (Daniel 7:9 e 10; ver 12:1) 2º Juízo comprobatório","a) Justos: Vivem, julgam e reinam com Cristo por mil anos (Apocalipse 20:4 a 6)","b) Ímpios: Estão mortos (Lucas 17:26 a 30; ver Jeremias 25:33)","c) Terra: Está vazia (ver Jeremias 4:23 a 27)","d) Satanás: Está preso (Apocalipse 20:2)","3º Juízo executivo","• Tribunal de Deus (Apocalipse 20:11 e 12)","• A “lei da liberdade” é a base do julgamento (Tiago 1:25; 2:8 a 12)","• Ao término do juízo que ocorre durante o milênio, acontecem os seguintes eventos:","a) A Nova Jerusalém desce com Jesus e os anjos (Apocalipse 21:2)","b) Os ímpios mortos ressuscitam (Apocalipse 20:5)","c) Satanás é solto (Apocalipse 20:7)","d) Os ímpios tentam tomar a cidade santa e são consumidos (Apocalipse 20:9)","e) Satanás é destruído (Apocalipse 20:10)","Que verdades você aprendeu sobre o juízo divino? Compromisso de fé: Confio em Jesus como meu Intercessor e Advogado. Escolho levar a Ele meus problemas, crendo que terá a solução ideal para a minha vida. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":31,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Romanos 8:1 a 11 2 João 8:12 a 20 3 João 9 4 João 10:1 a 18 5 João 13 6 João 14 7 João 15 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","• Você já foi injustiçado em algum momento da vida?","•  Você precisa resolver alguma situação com alguém para poder perdoá-lo e","estar em paz com ele e com Deus?","•  Como a compreensão deste tema ajudará você a enfrentar possíveis","situações de injustiça no futuro? Compartilhe sua resposta com sua família ou seu pequeno grupo.","MISSÃO","Ore para que seus amigos façam este curso bíblico. Peça a Deus que abra as portas para você compartilhar com eles o que está aprendendo (Colossenses 4:2 a 6). Amigos Pedidos de oração Se você está nas redes sociais, use esse espaço para testemunhar. Conheça o banco de imagens com temas bíblicos e datas especiais. Acesse: adv.st/imagensadventistas Siga as redes sociais oficiais da Igreja Adventista Adventistasbrasil Adventistasbrasil Adventistasbrasil iasd"]}]},{"id":"estudo-10","title":"Estudo 10 — Jesus e a Lei de Deus","type":"study","pages":[{"page":32,"blocks":["Sua vez de procurar: Mateus 7:24 a 27. Leia o trecho sobre os dois fundamentos. Em Mateus 5 a 7 encontramos a passagem bíblica conhecida como “Sermão do Monte”. Nela, Jesus ensinou o verdadeiro significado da lei de Deus, conhecida como os Dez Mandamentos (ver Êxodo 20) e corrigiu algumas interpretações equivocadas de Sua época. No final do capítulo 7, Jesus usou uma comparação para falar sobre os alicerces da fé. Na história, dois homens haviam construído suas próprias casas. Quem as olhasse de longe diria que eram excelentes construções. O homem que construiu sua casa alicerçada na areia é comparado aos que ouvem a palavra de Deus e não a colocam em prática. Por outro lado, os que a praticam são comparados ao homem que construiu sua casa sobre a rocha. As palavras de Jesus são material de alta qualidade. Elas nos oferecem uma base sólida para resistir às tempestades da vida. Mas é a prática que fará delas o firme alicerce para uma vida segura e equilibrada. Qual é a principal diferença entre o construtor prudente e o insensato? S e cada um decidisse criar as próprias leis, não haveria vida em sociedade. O caos seria completo. Se a natureza não tivesse leis que a controlam, seríamos aniquilados. Nosso Criador é um Deus de ordem e de limites. Quando se opôs a Deus, no Céu, Lúcifer lançou dúvida sobre o caráter divino. Insinuou que Deus seria injusto, e a lei Dele, impossível de ser cumprida. Lançou sobre o Criador a sombra de seu próprio egoísmo e fez com que Deus parecesse tirano e controlador. Por ser nosso Criador, Deus conhece nossos limites e nossas capacidades. Por isso, Sua lei preserva nossa vida e nos ajuda a conhecê-Lo melhor. Ela não é uma restrição à liberdade, mas o firme fundamento para que tenhamos paz em um mundo de conflito. Estudemos agora sobre a lei de Deus. lei de Deus","JESUS E A","ESTUDO 10","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":33,"blocks":["1. Qual é o princípio fundamental do cumprimento da lei de Deus? Mateus 22:36 a 40","Amar o próximo  Amar a Deus e o próximo como a si mesmo Amar a si mesmo","2. Como posso permanecer no amor de Deus? João 15:10","Guardando os mandamentos   Fazendo caridade","3. A lei de Deus nos conduz a quê? Gálatas 3:24","Ao erro    À libertinagem  A Cristo","4. O que Jesus disse para aqueles que O amam? João 14:15","“Apenas amem”  “Guardem os mandamentos” “Façam o bem”","5. A lei de Deus pode ser anulada pela fé? Romanos 3:31","6. Jesus aboliu a lei? Mateus 5:18 e 19","7. Deus tem um povo que guarda Sua lei nos últimos dias deste mundo? Apocalipse 14:12","Converse com seu instrutor bíblico O que você aprendeu nesta lição? Alguma parte não ficou clara? Resuma os Dez Mandamentos (Êxodo 20:3 a 17) Fatos bíblicos sobre a lei","• Jesus guardou a lei (João 15:10).","• Quem guarda a lei de Deus conhece Jesus (1 João 2:3 a 6).","• A Igreja verdadeira segue a lei de Deus (Apocalipse 12:17).","• Deus nos capacita com Seu Espírito para cumprir a lei (Gálatas 5:16 a 26).","• Quem peca transgride a lei (1 João 3:4).","• Descumprir um mandamento é o mesmo que transgredir todos (Tiago 2:10).","• Deus oferece a vida eterna por intermédio de Jesus (Romanos 3:23 e 24; 6:23).","• Quais traços de meu caráter precisam ser ajustados de acordo com a lei de Deus?","Relação com Deus Relação com o próximo","1. 5.","2. 6.","3. 7.","4. 8.","9.","10.","Compromisso de fé: Desejo aceitar Jesus como meu salvador pessoal e me comprometo a observar a lei de Deus. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":34,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Tiago 2:8 a 13 2 Mateus 5:17 a 48 3 Salmo 119:9 a 16 4 Romanos 3:28 a 31 5 Romanos 2:15 6 Hebreus 10:15 e 16 7 Apocalipse 12:17 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","Como seria a vida em nossa sociedade se as pessoas respeitassem os Dez Mandamentos? Comente com os amigos de seu pequeno grupo o que você aprendeu a respeito da lei de Deus.","MISSÃO","Ore para que Deus conceda oportunidades para você fazer este curso bíblico com seus amigos e levá-los a Jesus (Colossenses 4:2 a 6). Amigos Pedidos de oração LEITURA SUGESTIVA Os Dez Mandamentos: Princípios Divinos Para Melhorar seus Relacionamentos. Acesse: adv.st/livro-osdezmandamentos"]}]},{"id":"estudo-11","title":"Estudo 11 — Jesus e o Sábado","type":"study","pages":[{"page":35,"blocks":["Voltar ao menu35 Sua vez de procurar: Mateus 12:9 a 14. Leia a história do homem da mão ressequida. Enquanto esteve na Terra, o Filho de Deus ensinava, curava e pregava. Essas três atividades são áreas de atuação distintas que exigem vocação e preparo específicos. Mas em Jesus elas se uniam em perfeita harmonia. É evidente que, quando as ações de Cristo começaram a repercutir, muita gente não gostou. Os líderes religiosos de Seu tempo se sentiam ameaçados. Em vez de se alegrarem pela cura do enfermo, acusaram Jesus de quebrar o mandamento do sábado. Além de mostrar que é permitido fazer o bem aos sábados, essa história destaca a verdadeira essência do sétimo dia: a mensagem de que Deus nos restaura e habilita para o trabalho. Essa é uma marca da religião verdadeira. Você já experimentou a bênção do descanso do santo sábado? Que tal começar nesta semana? V ocê tem conseguido descansar? Especialistas chamam o mundo atual de “sociedade do cansaço”. A boa notícia é que nosso Criador projetou um descanso fundamental para nós. A Bíblia relata que Deus criou o mundo e, após isso, criou o descanso no sétimo dia. Deus criou essa pausa para passarmos tempo de qualidade com Ele. O sábado foi instituído por Deus na criação e recebeu uma bênção exclusiva. Por isso, somos chamados a nos lembrar dessa dádiva e celebrá-la. Descanso envolve dependência, entrega e confiança. Na essência do descanso está nossa confiança irrestrita de que Deus é capaz de cuidar de todos os aspectos de nossa vida. A cada semana você pode ter o privilégio de entrar em um tempo sagrado e descansar em Deus e com Ele. Esse descanso é um combustível para a vida. Neste estudo vamos relembrar o que a Bíblia diz sobre o sétimo dia, o sábado, o dia de descanso estabelecido por Deus.","sábado","JESUS E O","ESTUDO 11","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":36,"blocks":["1. De que dia Jesus afirmou ser o Senhor? Mateus 12:8","Sábado   Domingo  Qualquer dia","2. De acordo com Jesus, em benefício de quem o sábado foi estabelecido? Marcos 2:27","De Deus   Do homem   Dos anjos","3. Qual era o costume de Jesus aos sábados? Lucas 4:16","Passear   Dormir   Ir à sinagoga","4. Conforme a orientação de Jesus, o que pode ser feito no sábado? Mateus 12:12","Trabalhar  Fazer o bem  Comprar e vender","5. Que dia as pessoas próximas a Jesus guardavam? Lucas 23:52 a 56","6. Que dia os apóstolos de Jesus guardavam? Atos 17:2","7. Na vida eterna haverá um dia para ser guardado? Isaías 66:22 e 23","Por que guardar o sábado?","• Porque creio que o sábado é o dia do Senhor (Marcos 2:27 e 28).","• Porque sigo os passos de Jesus (1 Pedro 2:21).","•  Porque se Cristo e os apóstolos estivessem entre nós, guardariam fielmente","o sábado (Hebreus 13:8).","• Porque quero ser um fiel servo de meu Criador (Gênesis 2:1 a 30).","• Porque a Bíblia diz que o sábado é santo (Isaías 58:13 e 14).","• Porque quero adorar a Deus no Céu (Isaías 66:22 e 23).","•  Porque os Dez Mandamentos são a lei do Universo e serão observados no","Céu (Apocalipse 11:19). O que você considera ser o mais importante nos ensinos de Jesus sobre o","sábado?","Compromisso de fé: Entendo que preciso ser restaurado por Jesus e que necessito aprender a confiar inteiramente Nele. Portanto, decido alegremente adorar a Deus no dia santificado por Ele. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":37,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Mateus 12:1 a 12 2 Hebreus 4:1 a 11 3 Salmo 92 4 Filipenses 4 5 Colossenses 1 6 Gálatas 5 7 Efésios 6 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","• Que tal passar um tempo com a família no próximo sábado, em meio à","natureza?","• Você conhece alguém que precisa de uma visita ou de algum auxílio","especial?","MISSÃO","• No próximo sábado, ofereça alguma ajuda a pessoas que passam por lutas","e privações.","• Abençoe seus amigos pelos quais está intercedendo com uma visita. Ore","com eles e compartilhe este estudo. Amigos Pedidos de oração LEIA MAIS EM adv.st/observanciadosabado e adv.st/propositodosabado O portal encontreumaigreja.com.br foi pensado para ajudar você a localizar a Igreja Adventista mais próxima de onde você estiver."]}]},{"id":"estudo-12","title":"Estudo 12 — Jesus e a Igreja","type":"study","pages":[{"page":38,"blocks":["Sua vez de procurar: Lucas 13:22 a 30. Leia a analogia (comparação) da porta estreita. Para falar sobre o esforço necessário para entrar no reino de Deus, Jesus apresentou a analogia da porta estreita. Seu público estava acostumado a pensar que, para ser salvo, bastava seguir as regras da tradição ou simplesmente nascer judeu. Jesus, porém, disse àquelas pessoas que, para serem salvas, era necessário passar pela “porta estreita”. Cristo ensinou que passar pela porta estreita significava deixar para trás o que está sobrando e reter só o essencial. E o essencial no Reino dos Céus é deixar de lado os interesses pessoais para cumprir a vontade de Deus em","comunhão com Seu povo.","Ao longo destes estudos, você tem percebido que seguir Jesus exige que façamos algumas escolhas que também vão contra nossa natureza humana egoísta. O que fazer diante disso? N unca o planeta Terra teve tantos habitantes como agora, bilhões de pessoas. Porém, é cada vez mais comum encontrarmos gente solitária. Tudo parece projetado para a vida individual. As moradias são pequenas, os veículos são compactos e as famílias diminuem. A igreja foi idealizada por Deus como uma comunidade de amor, crescimento e apoio. Não deve ser fechada como um clube, mas receptiva como um hospital que abriga qualquer pessoa doente. Um hospital funciona bem quando todos os funcionários sabem porque estão ali e como desempenhar suas funções. Todos trabalham juntos com o objetivo de salvar vidas. Que ninguém se engane: não existe cristianismo individualista. O cristianismo é para ser vivido em comunidade. Longe da comunidade, a fé se enfraquece e se apaga como uma brasa longe da fogueira. Vamos entender agora qual o plano de Deus para a igreja. igreja","JESUS E A","ESTUDO 12","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":39,"blocks":["1. Quem fundou a igreja? Mateus 16:16 a 18","Cristo   Pedro   João","2. Sobre qual fundamento a igreja foi edificada? Efésios 2:19 e 20","A razão   Cristo   A tradição","3. Para que Deus escolheu Seu povo? 1 Pedro 2:9","4. Qual comparação a Bíblia utiliza para se referir à igreja? 1 Coríntios 12:12, 13 e 20","5. Por que Deus estabeleceu a liderança da igreja? Atos 20:28 e 29","6. Quais devem ser as qualificações dos líderes de igreja? 1 Timóteo 3:1 a 13","7. Quais são as marcas da identidade da igreja nos últimos dias? Apocalipse 14:12","8. Qual é a missão da igreja? Mateus 28:18 a 20","Converse com seu instrutor bíblico Qual foi a principal lição que você aprendeu neste estudo? Alguma parte não ficou clara? Características da igreja do “Deus vivo”","• Crê no Senhor Jesus (Atos 16:30 e 31).","• Prepara-se para a volta de Cristo (João 14:1 a 3).","• Anuncia que é chegada a hora do juízo (Apocalipse 14:7).","•  Crê em toda a Bíblia e no dom de profecia (2 Timóteo 3:14 a 17; Apocalipse","12:17; 19:10).","• Cumpre a grande comissão deixada por Jesus (Mateus 24:14; 28:18 a 20).","Por que a igreja é importante tanto para você como para as pessoas que não conhecem Jesus? Compromisso de fé: Desejo fazer parte da igreja de Deus e contribuir com os dons que Ele me deu para ajudar a salvar outras pessoas. Nome:                 Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":40,"blocks":["ESTUDO ADICIONAL","COMUNHÃO","Dia Para meditar O que Deus fala no texto? Qual é minha resposta? 1 Efésios 1 2 Efésios 2 3 Efésios 3 4 Efésios 4 5 Efésios 5 6 Efésios 6 7 Hebreus 11 * Sugestão de textos para sua leitura e reflexão até o próximo estudo (ore antes de ler e meditar).","RELACIONAMENTO","As unidades da Escola Sabatina e os pequenos grupos são núcleos menores pensados para fortalecer o cuidado das pessoas da igreja. Você gostaria de fazer parte desses grupos menores de apoio?","MISSÃO","A exemplo de Jesus, devemos ser missionários: “O Espírito do Senhor está sobre Mim, pois Ele Me ungiu para evangelizar os pobres, enviou-Me para proclamar libertação aos cativos e restauração da vista aos cegos, para pôr em liberdade os oprimidos, e proclamar o ano aceitável do Senhor” (Lucas 4:18 e 19). Amigos Pedidos de oração CONHEÇA OS ADVENTISTAS DO SÉTIMO DIA. ACESSE: adv.st/institucionaladventistas"]}]},{"id":"estudo-13","title":"Estudo 13 — Jesus e o Crescimento Espiritual","type":"study","pages":[{"page":41,"blocks":["Voltar ao menu41 Sua vez de procurar: João 15:1 a 14. Leia a parábola “A videira e os ramos”. O processo de crescimento na graça e no conhecimento da verdade pode ser comparado a um galho ligado à árvore. Enquanto permanece nela, ele pode crescer e dar frutos. Do mesmo modo, não podemos esperar bons resultados sem permanecer em Jesus. Todo fruto é resultado do milagre da vida. É Cristo quem opera esse milagre. Lembre-se de que o fruto é, a princípio, uma semente. A pequena semente então se desenvolve, começando pela raiz. Como todo o resto está conectado à raiz, o fruto virá, ainda que demore um pouco. Assim também ocorre na vida espiritual (João 15:5). De que maneira o cristão pode crescer e amadurecer em Cristo? O crescimento faz parte da vida. Tudo o que é vivo cresce. Pessoas, animais e plantas crescem de maneira adequada, tendo as condições necessárias ao desenvolvimento. Enquanto há vida, há crescimento. Isso nos revela a grandiosidade de nosso Criador. Mesmo que você corte o cabelo, ele voltará a crescer; mesmo que pode uma árvore, ela voltará a dar folhas e frutos; mesmo que doe sangue, seu organismo irá repô-lo. A realidade física nos revela muita coisa sobre a vida espiritual. Isso acontece porque Deus é o Criador de todas as coisas e nos dá a oportunidade de escolher se queremos ou não manter essa ligação com Ele. Há pessoas que não fazem questão de estar com Deus e O rejeitam. Porém, ao nos desligarmos Dele, paramos de crescer e de receber o que realmente sustenta a vida. Neste estudo, vamos aprender mais sobre o crescimento em Cristo. crescimento  espiritual","JESUS E O","ESTUDO 13","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":42,"blocks":["1. Que estratégia o inimigo de Deus usou para nos separar do Criador? João 8:44","2. Qual é a única maneira de vencermos Satanás? Apocalipse 12:11","3. Do que o sacrifício de Jesus nos libertou? Colossenses 1:13 e 14","4. O que acontece com aqueles que estão em Cristo? 2 Coríntios 5:17","5.  Por que o apóstolo recomenda usarmos toda a “armadura de Deus” no conflito","contra os poderes espirituais do mal? Efésios 6:12 e 13","6. Quais são as partes dessa “armadura”? Efésios 6:14 a 17","7.  Qual é a maior evidência de que Deus transforma a vida e nos faz crescer em Cristo?","Gálatas 5:22 e 23 Converse com seu instrutor bíblico O que você aprendeu neste estudo? Marcos do crescimento em Cristo","• Uma vida de estudo contínuo da Palavra de Deus (2 Timóteo 3:14 a 17).","• Uma vida dedicada a Deus e ao próximo (Mateus 20:25 a 28).","• Uma vida marcada pelo amor e pelo espírito de reconciliação (2 Coríntios 5:18 a 21).","• Uma vida que produz frutos espirituais (João 15:7 e 8).","Quais aspectos de minha vida ainda precisam ser desenvolvidos? De que maneira posso contribuir para não limitar meu crescimento em Cristo? Compromisso de fé: Entendo que Cristo é o Senhor da vida e desejo permanecer Nele. Quero me aprofundar no conhecimento da Bíblia e passar tempo com Jesus, a fim de viver em Sua presença e crescer em graça para a glória de Deus. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":43,"blocks":["ESTUDO ADICIONAL","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 1)","Sábado: Como permanecer em Cristo (página 71)","Domingo: Justificados por Deus (página 72)","Segunda-feira: Vencendo o eu (página 73)","Terça-feira: Buscando primeiro o Reino (página 74)","Quarta-feira: Orar e jejuar (página 76)","Quinta-feira: Devoção familiar e comunitária (página 77)","Sexta-feira: Firmes até o fim (página 78)","MISSÃO","Jesus nos disse que seríamos Suas testemunhas (Atos 1:8). Ele também assegurou que o poder para testemunhar viria Dele (Lucas 21:13 a 15). Antes de contar às pessoas o que Jesus tem feito em sua vida, ore a Deus. Confie que Ele irá à sua frente e que o Espírito Santo estará com você. Compartilhe este estudo com seus amigos. Amigos Pedidos de oração Descubra como ajudar as crianças a realmente compreender que o “sábado é um dia feliz”. Veja em http://adv.st/cultofamilar algumas dicas práticas para aprender a fazer o culto familiar."]}]},{"id":"estudo-14","title":"Estudo 14 — Jesus e a Fidelidade","type":"study","pages":[{"page":44,"blocks":["Sua vez de procurar: Lucas 19:11 a 27. Leia a “Parábola das dez minas”. No Reino de Deus, a fidelidade é um ponto fundamental. Segundo o relato bíblico, certo homem deu a seus dez servos a mesma quantidade de minas (uma moeda grega cujo valor era equivalente a cem dias de trabalho). Um dos servos atendeu à única orientação, “negociem até que eu volte”, e conseguiu dez vezes mais. Outro trouxe cinco vezes mais, cada um conforme sua capacidade. Entretanto, o servo infiel não fez nada, e a mina que a princípio lhe havia sido confiada foi entregue ao que tinha mais. “Seja fiel até a morte, e eu lhe darei a coroa da vida” (Apocalipse 2:10). Por que fidelidade a Deus é importante em nossa caminhada espiritual? N inguém gosta de ser traído. A dor da traição é um dos piores sentimentos, pois a infidelidade só existe onde havia confiança. Alguém em quem você não confia não tem como traí-lo nem tirar nada de você, justamente porque antes não se esperava lealdade dessa pessoa. A traição dói tanto porque, em algum momento, houve compromisso, entrega, proximidade e segurança. “Fidelidade” é uma palavra que vem do latim e significa “preservar as características originais”, “ser fiel à referência”. Fidelidade é sinônimo de lealdade e honradez. Como cristãos, nosso maior exemplo de fidelidade é Jesus. A Bíblia relata que Ele foi fiel até a morte, e morte de cruz. Cristo foi fiel ao Pai e ao plano de salvar a humanidade. Seu amor foi tão grande que nos ofereceu não apenas o melhor que tinha, mas tudo. Ele entregou a Si mesmo. Neste estudo vamos aprender mais sobre a fidelidade que Deus nos inspira a praticar em nosso dia a dia. fidelidade","JESUS E A","ESTUDO 14","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":45,"blocks":["1. Qual deve ser a prioridade de minha vida? Mateus 6:33","A família   O reino de Deus  O trabalho","2. Em última instância, graças a quem obtemos nossos bens? Deuteronômio 8:17 e 18","Ao esforço pessoal À família   A Deus","3. Do que devemos devolver o dízimo? Gênesis 28:20 a 22","4. Para que os dízimos serviam no passado e servem hoje?","a) Números 18:21 –","b) Malaquias 3:10 –","c) 1 Coríntios 9:13 e 14 –","5. Para que servem as ofertas?","a) Êxodo 35:29 –","b) 1 Crônicas 29:9 e 16 –","c) 2 Coríntios 9:7 –","6. O que Jesus ensinou sobre o dízimo e as ofertas?","a) Mateus 23:23 –","b) Marcos 12:41 a 44 –","Pontos a considerar","• A Bíblia ensina que os dízimos e as ofertas são parte da adoração (Deuteronômio 12:6).","•  O ato de entregar voluntariamente o dízimo mostra em quem eu confio.","É a minha dádiva de gratidão pelo que Deus me concede (Levítico 27:30 e 32).","•  As ofertas representam nossa gratidão pela salvação oferecida por Cristo na","cruz, o que Ele faz hoje como intercessor e o que fará quando voltar. A Bíblia não prescreve o percentual da oferta. Portanto, ela pode ser menor, igual ou maior que o dízimo.","•  Os dízimos e as ofertas são um meio fundamental para cumprir a missão de","pregar o evangelho a todo o mundo (Mateus 24:14). Como você se sente ao ver o que Jesus fez, faz e fará por você? Compromisso de fé: Entendo que a devolução dos dízimos e das ofertas é uma forma de adorar a Deus e demonstrar minha fidelidade a Ele. Portanto, desejo empregar não apenas meus recursos na causa de Deus, mas também minha vida, meus dons e meu tempo. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":46,"blocks":["ESTUDO ADICIONAL","MORDOMIA CRISTÃ","É a responsabilidade do ser humano em relação a tudo o que Deus lhe confiou:","• Cuidado com o corpo","Os filhos de Deus devem preservar o templo do Espírito Santo (1 Coríntios 6:19 e 20).","• Aplicação dos talentos","Cada pessoa tem dons para colocar a serviço de Deus (1 Coríntios 12:28 a 31).","• Controle do tempo","Glorificamos a Deus pelo sábio uso do tempo (Efésios 5:15 e 16).","• Gestão de bens materiais","Devemos administrar bem os recursos que Deus nos deu (Deuteronômio 8:18).","• Preservação do meio ambiente","Os servos do Senhor devem cuidar da criação (Gênesis 1:27 e 28). O que Bíblia diz sobre as ofertas","• São de caráter pessoal e voluntário (Deuteronômio 16:17)","• São regulares e planejadas (1 Coríntios 16:2; 2 Coríntios 9:5)","• São proporcionais à renda (1 Coríntios 16:2)","• São um ato de adoração e gratidão (Provérbios 3:9)","• São oferecidas com generosidade e alegria (2 Coríntios 8:3 a 5; 9:7)","Como dizimar e ofertar Você pode devolver o dízimo e as ofertas na igreja, em um envelope preenchido com seus dados. Também é possível fazer uma transferência bancária com os dados fornecidos pelo tesoureiro da igreja ou pelo aplicativo 7me.","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 2)","Sábado: Identidade única (página 80)","Domingo: Do desapontamento à esperança (página 81)","Segunda-feira: Uma casa no Céu (página 82)","Terça-feira: Monumento ao Criador (página 83)","Quarta-feira: Mil mentiras, uma verdade (página 84)","Quinta-feira: Mensageira do Senhor (página 85)","Sexta-feira: Valorize nossa identidade (página 86)","MISSÃO","Deus repete a nós a promessa feita a Abraão: “Em você serão benditas todas as famílias da terra” (Gênesis 12:3). “E, se vocês são de Cristo, são também descendentes de Abraão e herdeiros segundo a promessa” (Gálatas 3:29). A Igreja Adventista está presente em 217 países dos 236 reconhecidos pela ONU. Parte do dízimo serve para o cumprimento da antiga promessa de abençoar todas as famílias da Terra com o testemunho sobre o Deus vivo. O 7me é um espaço para membros e amigos da Igreja Adventista do Sétimo Dia. Descubra as ferramentas disponíveis por meio desse sistema on-line e do aplicativo. Acesse: adv.st/7me"]}]},{"id":"estudo-15","title":"Estudo 15 — Jesus e o Batismo","type":"study","pages":[{"page":47,"blocks":["Voltar ao menu47 Sua vez de procurar: João 3:1 a 15. Leia a história sobre a visita de Nicodemos a Jesus. Nicodemos era um destacado líder religioso, importante, bem-sucedido e profundo conhecedor das Escrituras. Ele queria conhecer Jesus. Era impossível não reconhecer Nele os atributos do Messias, mas o humilde Mestre da Galileia não era o tipo de messias esperado. Por isso, na cabeça de Nicodemos havia uma enorme dúvida. Como ele poderia assimilar toda a novidade trazida por Jesus? Era impossível conciliar o modo como Jesus pregava e vivia com os ensinos e as atitudes dos doutores da lei de sua época. Era preciso começar do zero, nascer de novo – disse-lhe Jesus. Nicodemos precisava abandonar tudo o que tinha aprendido e vivido até aquele momento para permitir que Cristo o restaurasse. Por que precisamos nascer de novo ou recomeçar espiritualmente? A restauração é um processo longo e complexo. Restaurar não é só consertar. É buscar de todos os modos levar uma obra ao seu estado original. Ao criar o homem e a mulher, Deus os fez à Sua imagem e semelhança. Esculpiu em nós Sua perfeita imagem. Contudo, o pecado danificou profundamente a obra de Deus. O caráter divino precisava ser restaurado no ser humano. Sem o sacrifício de Jesus, não haveria solução para nossa condição pecaminosa. O batismo marca o início da caminhada cristã. A água é um símbolo bíblico de purificação e restauração. A cerimônia do batismo representa uma completa renovação e mudança de vida. Nas águas do batismo, demonstramos publicamente que aceitamos a completa restauração que Cristo oferece. Não há nada de sobrenatural na água nem na cerimônia. O poder está em Cristo e é recebido pela fé que depositamos Nele. Neste estudo entenderemos melhor o ensino bíblico do batismo. batismo","JESUS E O","ESTUDO 15","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":48,"blocks":["1. Como as pessoas eram salvas na época do Antigo Testamento? Salmo 6:4","Pelas obras  Pela graça   Pela tradição","2. Segundo o Novo Testamento, como as pessoas são salvas? Atos 15:11","Pelas obras  Pela graça   Pela tradição dos pais","3. Como Jesus foi batizado? Mateus 3:16","Por imersão  Por aspersão   Por efusão","4. O que representa o batismo e como ele é descrito na Bíblia? Romanos 6:3 a 5, 10 e 11","5. O que acontece quando alguém é batizado em Cristo? Gálatas 3:26 e 27","6. Por que é essencial que a pessoa seja batizada? João 3:5","7. Que instruções o apóstolo Pedro deu aos crentes? Atos 10:47 e 48","8.  Quando devo tomar a decisão de me entregar a Deus por meio do batismo?","2 Coríntios 6:2 Converse com seu instrutor bíblico Como o batismo pode influenciar a minha vida? Compromisso de fé: Compreendi que toda a Bíblia ensina a salvação pela graça em Cristo Jesus. Portanto, aceito essa oferta divina e decido nascer de novo por meio do batismo e da atuação do Espírito. Quero hoje mesmo escolher o dia do meu batismo. Nome:                  Data:","Clique no player abaixo e assista a recapitulação e compromisso"]},{"page":49,"blocks":["ESTUDO ADICIONAL","Sete passos que confirmam a salvação 1º) Crer no Senhor Jesus (Atos 4:12; 16:31) 2º) Arrepender-se e converter-se (Atos 3:19) 3º) Confessar os pecados (1 João 1:9) 4º) Guardar os mandamentos (Mateus 19:16 e 17) 5º) Ser batizado por imersão (Atos 8:36 a 39) 6º) Perseverar nos ensinamentos de Jesus até o fim (Mateus 24:13) 7º) Cumprir a grande comissão do evangelho (Mateus 28:18 a 20)","COMUNHÃO E RELACIONAMENTO","CRESCENDOEMCRISTO.ORG (estudo da semana 3)","Sábado: Chamado para a missão (página 88)","Domingo: Testemunhando de minha fé (página 89)","Segunda-feira: Eu era cego e agora vejo (página 90)","Terça-feira: Descobrindo meu dom espiritual (página 91)","Quarta-feira: Como levar alguém a Cristo – parte 1 (página 92)","Quinta-feira: Como levar alguém a Cristo – parte 2 (página 93)","Sexta-feira: Meu talento, meu ministério (página 94)","MISSÃO","Ore todos os dias pelos amigos e familiares que você deseja ver em seu batismo. Compartilhe este estudo bíblico com eles para que também tomem a decisão por Jesus e pelo batismo. Amigos Pedidos de oração Convide seus amigos e familiares para participar desse momento com você. Acesse adv.st/convitebatismo, baixe o convite e o compartilhe pelo WhatsApp. Ao clicar em “acesse aqui”, dentro do convite, estarão disponíveis dois vídeos com explicações sobre essa importante decisão. Acesse aqui"]}]},{"id":"estudo-16","title":"Estudo 16 — Jesus e o Estilo de Vida Cristão","type":"study","pages":[{"page":50,"blocks":["Sua vez de procurar: Mateus 6:25 a 34. Leia o texto sobre ansiedade. Não é de hoje que somos ansiosos. A ansiedade era um problema comum nos tempos de Jesus. Na realidade, desde que quebramos o elo de confiança plena em Deus, passamos a nos preocupar excessivamente conosco. Quantas vezes nos esquecemos de que nosso bondoso Pai está ao nosso lado para suprir nossas necessidades! Precisamos apenas colocar em primeiro lugar Seu reino em nossa vida. Deus nos ama! É por isso que Jesus repetiu diversas vezes: “Não se preocupe, não tenha medo.” Porém, se isso acontecer, conte suas preocupações ao Pai celestial. Não sofra por antecipação. Jesus o convida a entregar a Ele suas ansiedades. Aquele que cuida das pequenas aves, também cuidará de você! Que tal entregar suas preocupações a Deus hoje? D eus nos criou de modo integrado. O que as pessoas chamam de “corpo, mente e espírito”, na verdade são uma coisa só. O que afeta uma parte se reflete nas outras. Por isso, sua religião e sua vida diária não podem ser separadas. Deus ensinou esse princípio quando libertou o povo de Israel do cativeiro no Egito. Eles receberam leis que regiam as cerimônias religiosas, a vida civil, os padrões de moralidade e os hábitos de saúde. Assim como Deus apresentou a Israel um plano que orientava todas as dimensões da vida, Ele faz o mesmo conosco hoje. Ao acatar as orientações divinas para sua saúde, seu vestuário, sua recreação e seu relacionamento com as pessoas, entre outros pontos, você vai viver mais feliz. Encontre a paz e a tranquilidade ao seguir o plano de Deus para sua vida. Vamos agora entender melhor qual é o plano de Deus para nosso estilo de vida. estilo de vida cristão","JESUS E O","ESTUDO 16","Clique no player e assista a introdução do estudoClique no player e assista a introdução do estudo"]},{"page":51,"blocks":["1. Que princípio básico deve dirigir a vida do cristão? 1 Coríntios 10:31","2. Como Deus considera o corpo humano? 1 Coríntios 6:19 e 20","Como o templo do Espírito Santo  Como matéria imprestável","3. Que outros conselhos encontramos para manter mente e corpo saudáveis? Filipenses 4:8","4. Qual foi a alimentação que Deus deu para o ser humano assim que o criou? Gênesis 1:29","5.  Somente após o dilúvio Deus permitiu ao ser humano comer alguns tipos de carne. Veja","a seguir as características dos animais lícitos para o consumo e indique o nome deles.","a) Animais terrestres: Levítico 11:2, 3, 5 a 7 (têm o casco partido e ruminam).","b) Animais aquáticos: Levítico 11:9, 10 e 12 (têm escamas e barbatanas).","c) Aves: Levítico 11:13 a 19; Deuteronômio 14:11 a 20 (no geral, as aves limpas são","aquelas que não estão nessa lista; todas as aves de rapina são imundas).","6.  Por que não devemos usar bebidas alcoólicas, fumo e outras bebidas estimulantes?","1 Coríntios 3:16 e 17","7. O que a Bíblia declara em relação ao casamento?","a) Efésios 5:22 e 25 –","b) Mateus 19:8 e 9 –","8. Que princípios a Bíblia estabelece em relação a vestuário e joias?","a) 1 Pedro 3:3 e 5 –","b) 1 Timóteo 2:9 –","9. Quais são as orientações bíblicas sobre o convívio cristão?","a) Efésios 4:25 –","b) Gálatas 6:1 –","10. O que a Bíblia ensina sobre o modo de o cristão se posicionar com relação às autoridades?","a) Romanos 13:1 a 4 –","b) Atos 5:29 –","Que aspectos da minha conduta de vida precisam ser renovados por Jesus? Compromisso de fé: Quero aprender m
