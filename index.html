ta majoritariamente por mulheres ou que ela tem uma juven - tude saudável que se abstém de álcool, fumo e drogas, estamos nos referindo ao povo adventista. A Igreja Adventista do Sétimo Dia é uma das entidades mais bem organiza - das do mundo. O padrão organizacional que adotamos nos foi dado por Deus. Ao comentar o assunto em 24 de dezembro de 1850, Ellen White escreveu: “Tudo no Céu ocorre em perfeita ordem” (Manuscrito 11). Durante a organização da Igreja Adventista na década de 1860, com o nome e a estrutura administrativa que temos hoje, Ellen White disse que esse nome nos foi dado por Deus. Em 1902, ela confirmou o que havia dito antes: “Somos adventistas do sétimo dia.  Envergonhamo-nos, acaso, de nosso nome? Respondemos: ‘Não, não! Não nos envergonhamos. É o nome que o Senhor nos deu. […] Somos adventistas do sétimo dia, e desse nome nunca devemos nos envergonhar” (A Igreja Remanescente, p. 66). Em 1860, foi organizada a primeira igreja e aprovado o nome Adventista do Sétimo Dia. Em 1861, foi formada a primeira Associação. Em 1863, foi organizada a Associação Geral. Em 1901, foi reorganizada a Associação Geral, com a criação das Uniões e dos departamentos. De 1913 a 1918, foram criadas as Divisões mundiais, que são escritórios da Associação Geral espalhados pelo mundo. O processo de organização na Igreja Adventista tem sido dinâmico. Desde sua formação até o momento atual, tem havido algumas mudanças, mas as bases da organização foram lançadas nas datas mencionadas. Envolva-se com a Igreja SEMANA"]},{"page":97,"blocks":["Voltar ao menuSEMANA  4 97","DOMINGO","FUNCIONAMENTO DA IGREJA ADVENTISTA DO SÉTIMO DIA A Igreja Adventista do Sétimo Dia segue a forma representativa de governo eclesiástico. Nesse modelo, a autoridade recai sobre os membros da igreja, e a responsabilidade pelo planejamento e coordenação é delegada a outros níveis. O trabalho de cada nível administrativo da denominação é revisado em “assembleias” periódicas. Nessas assembleias são apresentados relatórios e prestações de contas, além de ser escolhida a liderança da igreja para um novo período. Níveis de organização da Igreja Adventista do Sétimo Dia Há quatro níveis de organização administrativa na Igreja Adventista do Sétimo Dia:","1. A igreja local é formada por um grupo organizado de crentes. Esse grupo","de irmãos é dirigido por um pastor, designado pela Associação ou Missão, e líde - res locais, escolhidos por uma comissão eleita por todos os membros. Em geral, a igreja local faz parte de um distrito pastoral composto por igrejas da região.","2. A Associação/Missão  é formada por um grupo organizado de igrejas de","um estado, município ou território específico, e ajuda a coordenar os projetos e ações das igrejas locais.","3. A União  é formada por um grupo de Associações ou Missões dentro de um","território geográfico mais amplo, a fim de coordenar projetos e ações dos cam - pos locais (Associações/Missões).","4. A Associação Geral , sediada nos Estados Unidos, é representada em determinadas áreas geográficas pelas Divisões. Portanto, uma Divisão não é um nível","administrativo da igreja, mas uma extensão da Associação Geral para determi - nadas regiões do mundo. O objetivo das Divisões é ajudar na coordenação dos projetos e das ações das Uniões. Finanças Uma organização mundial, como a Igreja Adventista do Sétimo Dia, não fun - cionaria sem um sistema financeiro eficiente voltado para o cumprimento da","missão. A principal fonte de renda da Igreja Adventista são os dízimos e as ofer -","tas recebidos dos membros que fielmente seguem o plano de Deus (Ml 3:10). A igreja tem critérios rigorosos e transparentes na utilização de seus fundos para a manutenção do ministério pastoral e da obra de pregação do evange - lho em todo o mundo. Qual é sua impressão sobre a organização e seriedade da Igreja Adventista do Sétimo dia? (O conteúdo deste estudo foi adaptado do Guia Para Anciãos , ed. rev. 2013, p. 13-15)."]},{"page":98,"blocks":["Voltar ao menu SEMANA  498","SEGUNDA-FEIRA","OS MINISTÉRIOS E AS ATIVIDADES DA IGREJA LOCAL O funcionamento da igreja local tem como base os ministérios, que são as diversas atividades realizadas na congregação. A Igreja Adventista tem diversos ministérios, como o Ministério da Família, o Ministério das Crianças, o Ministério Jovem e o Ministério da Música. As atividades desses ministérios devem ser realizadas com base nos dons de cada membro. Procure seu pastor ou ancião e se coloque à disposição para servir em algum ministério. Isso vai ajudar você a fazer amizade com outros membros da igreja e a desenvolver seus dons. Para isso, é preciso saber a diferença entre um dom espiritual e um talento natural. Um talento é uma habilidade inata. Por exemplo, se você se expressa bem, isso é um talento natural, e você pode usá-lo para a causa de Deus. Um dom espiritual, por sua vez, é dado pelo Espírito Santo. No batismo, a pessoa recebe uma ou mais capacidades divinas para servir na edi - ficação do corpo de Cristo (veja 1Co 12:11). Descreva com suas palavras a diferença entre um talento natural e um dom espiritual: _____________________________________________________________ _______________________________________________________________________ Todo cristão deve estar envolvido em um ministério para cumprir a missão que recebeu de Deus. Os ministérios são desempenhados de acordo com os dons e talentos dos crentes e são estabelecidos de acordo com as necessida - des da igreja e da sociedade. Em quais ministérios da igreja desejo servir: _______________________________ Como posso cumprir a missão de salvar pessoas: __________________________ Todos os ministérios da igreja têm como objetivo salvar pessoas. Esse é o motivo da existência da igreja. “Assumir seriamente a missão da igreja implica tensão entre a necessidade de separação do mundo e a responsabilidade de alcançá-lo” ( Guia Para Anciãos , ed. rev. 2013, p. 10). Essa tensão ocorre porque, ao mesmo tempo em que devemos nos separar das práticas e dos costumes do mundo, devemos nos aproximar dele para levar o amor, a verdade e a salva - ção de Deus. Isso deve estar bem claro desde o início de sua caminhada cristã. Você não deve se afastar das pessoas a ponto de não poder testemunhar nem se envolver tanto que passe a participar das práticas contrárias à vontade de Deus. A comunhão diária vai ajudar você a tomar as decisões certas."]},{"page":99,"blocks":["Voltar ao menuSEMANA  4 99","TERÇA-FEIRA","SOMOS UMA FAMÍLIA A família adventista é composta por mais de 20 milhões de membros ao redor do mundo. Esse exército está organizado em unidades de ação e pequenos grupos, os quais se reúnem semanalmente em igrejas e nos lares. Essa histó - ria começou em 1852, quando Tiago White, um de nossos pioneiros, escreveu as primeiras lições da Escola Sabatina, como uma série de 19 lições para crianças e jovens. A Escola Sabatina tem quatro ênfases:","1. Fortalecimento da fé. A Lição da Escola Sabatina  é o principal instrumento","para o cumprimento desse objetivo. Por meio dela, somos enriquecidos com o conteúdo da Bíblia e do Espírito de Profecia.","2. Companheirismo. Nas unidades de ação e nos pequenos grupos, os mem -","bros da igreja e da Escola Sabatina podem estabelecer relacionamentos sau - dáveis e experimentar a vida em comunidade.","3. Proclamação do evangelho. No uso dos dons espirituais, cada membro é","chamado a compartilhar a verdade da Palavra de Deus.","4. Missões mundiais. Elas devem ser auxiliadas pelas ofertas que são reco -","lhidas a cada semana e enviadas a vários lugares do planeta. Esclarecendo os termos: as unidades de ação são classes de estudos que se reúnem a cada sábado na igreja a fim de recapitular a Lição da Escola Sabatina . Pequenos grupos são reuniões nos lares com o objetivo de fortalecer a ênfase no companheirismo e na proclamação do evangelho, preferencialmente com as mesmas pessoas da unidade de ação. Uma pessoa precisa de no mínimo seis amigos da igreja para permanecer firme e confiante. As unidades de ação e os pequenos grupos têm o papel de fortalecer o companheirismo e a amizade dos membros. Você já sabe qual é sua unidade de ação/pequeno grupo? Se ainda não sabe, procure o pastor ou a pes - soa que lhe deu estudos bíblicos e peça orientação sobre o assunto. Em uma pesquisa sobre os fatores de fortalecimento da fé do novo membro, Robert McIver chegou à conclusão de que os pontos essenciais são: frequên - cia à Escola Sabatina, estudo da lição, observância do sábado, leitura diária da Bíblia, hábito de orar frequentemente durante o dia e fidelidade nos dízimos e nas ofertas. Como anda sua vida espiritual? Tem sido fiel nos pontos acima? Quais têm sido seus maiores desafios? Fale com Deus neste momento e peça a Ele ajuda para permanecer firme na fé e seguindo na caminhada cristã."]},{"page":100,"blocks":["Voltar ao menu SEMANA  4100","QUARTA-FEIRA","CERIMÔNIAS DA IGREJA O Novo Testamento estabeleceu algumas cerimônias para a igreja cristã com a finalidade de fortalecer a fé, a família e a comunhão dos crentes. Na igreja, nós nos unimos para o culto, a comunhão, a instrução na Palavra e a proclamação do evangelho. As principais cerimônias da igreja são:","1. Batismo. Nessa cerimônia, atestamos nossa morte para o pecado e nosso","propósito de andar em novidade de vida. Também confessamos a fé na morte e na ressurreição de Jesus. Assim, tornamo-nos parte de Seu povo e somos acei - tos na igreja como membros. O batismo bíblico é feito por imersão e deve ser precedido pela compreensão, aceitação e vivência dos ensinos da Bíblia ( Manual da Igreja, ed. rev. 2016, p. 171; ver Mt 3:13-16; 28:19, 20; Rm 6:1-6).","2. Ceia do Senhor. É uma cerimônia em que participamos dos emblemas do","corpo e do sangue de Jesus. “A preparação para a Ceia envolve exame de consciência, arrependimento e confissão. O Mestre instituiu a cerimônia do lava-pés para denotar renovada purificação, para expressar a disposição de servir uns aos outros em humildade” ( Manual da Igreja , ed. rev. 2016, p. 171, 172; ver 1Co 11:23-30; Jo 13:1-17).","3. Casamento. A Igreja Adventista sustenta o padrão bíblico para o matrimônio: 1) Conforme instituído por Deus, é um relacionamento monogâmico e hete -","rossexual; 2) “A intimidade sexual dentro do casamento é um dom sagrado de Deus para a família humana. […] Essa intimidade, designada para ser partilhada exclusivamente entre marido e mulher, promove uma felicidade sempre cres - cente” (Manual da Igreja, ed. rev. 2016, p. 159).","4. Dedicação de crianças . Dedicamos as crianças ao Senhor em uma cerimônia simples dirigida por um pastor ou ancião. Essa prática tem sua raiz na dedi -","cação de Jesus no templo (Lc 2:22). Todas essas cerimônias têm como objetivo fortalecer a adoração coletiva. Há lugar para a adoração particular e individual, mas a Bíblia enfatiza a impor - tância da adoração pública. Conforme diz a Palavra de Deus, não devemos dei - xar “de reunir-nos como igreja, segundo o costume de alguns, mas procuremos encorajar-nos uns aos outros, ainda mais quando vocês veem que se aproxima o Dia” (Hb 10:25, NVI). Por isso, a orientação é não faltar aos cultos nem subs - tituir os momentos de adoração por outra atividade qualquer."]},{"page":101,"blocks":["Voltar ao menuSEMANA  4 101","QUINTA-FEIRA","INSTITUIÇÕES ADVENTISTAS A Igreja Adventista do Sétimo Dia foi estabelecida com o objetivo de preparar o mundo para a breve volta de Jesus. Para cumprir essa missão, a deno - minação foi orientada por Deus a estabelecer instituições que pudessem apre - sentar a mensagem de maneiras diversificadas. Assim, logo no início do movimento, a igreja encontrou nas publicações impressas uma grande força para proclamar a mensagem. O movimento adventista nasceu na Nova Inglaterra, Estados Unidos, no século 19. Já no início, os pioneiros sentiram a necessidade de espalhar as verdades bíblicas para outros lugares. Por isso, fundaram uma pequena editora que levou a mensagem a várias par - tes do globo. Atualmente, existem 61 editoras adventistas ao redor do mundo produzindo materiais para 375 línguas e dialetos. Com o tempo, os adventistas também passaram a proclamar a mensagem por meio do rádio e da televisão. Atualmente, a igreja tem 160 centros de pro - dução de mídia, os quais levam a Palavra de Deus a todas as partes do planeta. Nas primeiras décadas do movimento, os pioneiros adventistas perceberam que o currículo das escolas seculares apresentava conteúdos contrários à men - sagem da Palavra de Deus. Em razão disso, decidiram fundar escolas, nas quais as crianças e os jovens da igreja pudessem obter formação acadêmica baseada na educação adventista. Até o momento, a igreja mantém cerca de 8 mil uni - dades escolares ao redor do mundo, nas quais aproximadamente 1,9 milhão de estudantes estão matriculados. Como a mensagem adventista abrange a vida espiritual, familiar e física, os pioneiros adventistas abriram clínicas e hospitais para cuidar da saúde das pessoas. Como resultado dessa iniciativa, contamos atualmente com 790 hospitais, clínicas e orfanatos em várias partes do mudo. Para saber mais detalhes sobre os números oficiais da Igreja Adventista ao redor do mundo, acesse: adventistas.org/ pt/institucional/os-adventistas/adventistas-no-mundo/. As instituições da igreja foram estabelecidas com base na missão e visão adventista, que são:","Missão:  “Fazer discípulos de todas as nações, comunicando o evangelho","eterno no contexto da tríplice mensagem angélica de Apocalipse 14:6 a 12, convidando-as a aceitar a Jesus como seu salvador pessoal e a unir-se à igreja remanescente, instruindo-as para servi-Lo como Senhor e preparando-as para Sua breve volta.” Visão:  “Em harmonia com as grandes profecias das Escrituras, entendemos que o clímax do plano de Deus é restaurar toda a Sua criação à completa har - monia com Sua perfeita vontade e justiça” (disponível em adventistas.org)."]},{"page":102,"blocks":["Voltar ao menu SEMANA  4102","SEXTA-FEIRA","ADVENTISTAS DO SÉTIMO DIA H á mais de um século e meio, em 1 o de outubro de 1860, em Battle Creek, Michigan, um grupo de pessoas que aguardava o breve retorno de Jesus escolheu o nome “Adventistas do Sétimo Dia” para designar sua fé. Eles eram aproximadamente 3 mil adventistas naquela época. E foi assim que 25 repre - sentantes dos 3 mil membros se reuniram em um dia de outono para abordar a questão da escolha de um nome. Após alguns dias de debate, o nome Adven - tista do Sétimo Dia foi sugerido por David Hewitt, conhecido como o “homem mais honesto” de Battle Creek. Seguiu-se, então, uma longa discussão, mas o nome foi votado favoravelmente. O nome Adventista do Sétimo Dia reflete as crenças da igreja em três pala - vras. “Adventista” indica a segurança do breve retorno (advento) de Jesus a esta Terra. “Sétimo Dia” se refere ao sábado bíblico de descanso que foi gracioBÍBLIA ABERTA A Bíblia forma a base do desenho e representa o fundamento bíblico de nossas crenças. Está retratada numa posição completamente aberta sugerindo a completa aceitação da Palavra de Deus. CHAMA Essa forma é feita de três linhas em volta do círculo, na esfera implícita. As linhas representam os três anjos de Apocalipse 14, circulando o globo, e a nossa missão de levar o evangelho ao mundo inteiro. A chama por inteiro simboliza o Espírito Santo. LINHAS Sugerem um contínuo movimento para cima, simbolizando a ressurreição e a ascensão de Cristo ao Céu, bem como a Sua segunda vinda, o principal foco de nossa fé. CRUZ O símbolo da cruz, representando o evangelho da salvação, está posicionado no centro do desenho para enfatizar o sacrifício de Cristo, que é o tema central de nossa fé. É também significativo que a Bíblia, representando a lei, e a chama, simbolizando o Espírito, estejam juntas na cruz. Identidade Visual da Igreja Adventista do Sétimo Dia NOSSO LOGOTIPO"]},{"page":103,"blocks":["Voltar ao menuSEMANA  4 103 samente dado por Deus para a humanidade na criação e observado por Jesus durante Sua encarnação (adaptado de “Sobre o Nome”, disponível em adven - tistas.org). Juntas, essas duas expressões falam do evangelho eterno. “Não podemos adotar outro nome mais apropriado do que esse que con - corda com a nossa profissão, exprime a nossa fé e nos caracteriza como povo peculiar. O nome Adventista do Sétimo Dia é uma contínua repreensão ao mundo protestante. É aqui que está a linha divisória entre os que adoram a Deus e os que adoram a besta e recebem seu sinal. O grande conflito é entre os manda - mentos de Deus e as exigências da besta. E porque os santos guardam todos os mandamentos de Deus, que o dragão lhes move guerra. Se rebaixassem seu padrão e cedessem nas particularidades de sua fé, o dragão estaria satisfeito; mas provocam sua ira por ousarem exaltar o padrão e promover o estandarte de oposição ao mundo protestante que reverencia uma instituição do papado. O nome Adventista do Sétimo Dia exibe o verdadeiro caráter de nossa fé e será próprio para persuadir os espíritos indagadores” (Igreja Remanescente, p. 65). É uma estrutura de layout de sete colunas a ser usada na maioria das situações de design da Igreja Adventista para comunicar sua convicção. Essas colunas fazem referência aos sete dias da criação apresentados em Gênesis. LAYOUT DA CRIAÇÃO As seis primeiras colunas são para textos, imagens, ilustrações, grafias, marcas ou qualquer outro elemento. Nelas é feito todo o trabalho de comunicação. Mas a sétima coluna, a do sábado, deve ser separada para ser especial e diferente das outras seis, como uma celebração visual do sétimo dia, e nela é inserido apenas o logotipo oficial da Igreja Adventista do Sétimo Dia. Para conhecer mais sobre a identidade visual da Igreja Adventista do Sétimo Dia, sua proposta e seus materiais, acesse identidade.adventistas.org."]},{"page":104,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":105,"blocks":["SÁBADO","POR QUE SER MORDOMO DE DEUS D urante esta semana, vamos estudar sobre mordomia cristã. Em nossa cul - tura, o conceito de “mordomia” difere da ideia bíblica. Nas Escrituras, mordomia tem que ver com o estilo de vida da pessoa que reconhece e aceita o senhorio de Jesus, atuando como administradora dos negócios Dele na Terra. Essa interação entre o Senhor e os mordomos foi estipulada por Deus ao criar Adão e Eva à  Sua imagem e estabelecer, com Seu toque pessoal, uma relação íntima com a humanidade. Para compreendermos esse tema, devemos começar com a questão da natu - reza de Deus. Antes de qualquer coisa existir, Ele já existia. Isso significa que Deus é eterno e autossuficiente. Nossa função não é enriquecê-Lo. Deus, o cria - dor, é o dono de tudo. Nosso papel é fazer a vontade Dele, a fim de administrarmos fielmente os recursos que Ele coloca à nossa disposição. Deus tornou os seres humanos Seus sócios na administração da criação, outorgando-lhes o governo da Terra. O verbo “dominar”, usado em Gênesis 1:28, é utilizado no Antigo Testamento para designar o poder de um monarca sobre seu povo. Em Gênesis, esse poder é concedido à humanidade.  Somos comissionados a governar a criação como um rei benevolente, agindo como represen - tantes de Deus. O primeiro lugar em que o ser humano exerceu sua função de mordomo foi no Éden, ao atuar como agente de Deus na Terra. Lamentavelmente, com a entrada do pecado, o sentido de cuidar e ser responsável do verbo “dominar” se enfraqueceu (Gn 1) e assimilou a ideia de opressão e destruição. Desde então, os seres humanos se tornaram escravos do pecado e incapazes de exercer por si mesmos a função de mordomos fiéis. Felizmente, Deus restaurou a relação divino-humana ao estabelecer Seu reino sobre a Terra por intermédio de Cristo. Como segundo Adão, Jesus reconquis - tou nosso direito de sermos mordomos de Deus. Exercemos esse papel quando reconhecemos a soberania de Deus como criador, redentor, mantenedor e proprietário de tudo o que temos e somos. Família Mundial SEMANA","SEMANA  5 105"]},{"page":106,"blocks":["DOMINGO","ADMINISTRAÇÃO E MISSÃO DA IGREJA A Igreja Adventista do Sétimo Dia é uma organização mundial. Somos apro - ximadamente 20 milhões de membros em todo mundo, divididos em 215 países. A Igreja Adventista está organizada da seguinte forma:","1. O primeiro nível administrativo é composto por membros que se reúnem e","formam um grupo organizado. Ao crescer, esse grupo se torna uma igreja local.","2. Vários grupos e igrejas formam um distrito pastoral.","3. Um conjunto de distritos pastorais compõe uma Missão ou Associação,","que são sedes administrativas para os distritos.","4. As Missões e as Associações formam uma União, que são sedes adminis -","trativas para as diversas Associações e Missões.","5. Um conjunto de Uniões forma as Divisões mundiais, que são escritórios da","Associação Geral da Igreja Adventista do Sétimo Dia. Atualmente, existem 13 Divisões ao redor do mundo. Fazemos parte da Divisão Sul-Americana. Ela coor - dena as diversas atividades da Igreja em oito países da América do Sul: Argentina, Bolívia, Brasil, Chile, Equador, Paraguai, Peru e Uruguai. A Bíblia ensina que Deus deseja reunir Sua família em uma cidade linda que Ele preparou: a Nova Jerusalém. Jesus disse: “Ainda tenho outras ovelhas, não deste aprisco; a Mim Me convém conduzi-las; elas ouvirão a Minha voz; então, haverá um rebanho e um pastor” (Jo 10:16). Em razão disso, Deus comissionou Seus filhos alcançados pelo evangelho eterno para levarem essa mensagem de salvação a outros. Essa é a missão da igreja. “Se cada um de vocês fosse um missionário atuante, a mensagem para este tempo seria rapidamente proclamada em todos os países, a cada nação e língua” (Serviço Cristã o, p. 9). Mas como pregar o evangelho a pessoas que moram em outras nações, com diferentes culturas e línguas? A resposta é: “Deus apela ao Seu povo para que desperte quanto às suas responsabilidades. Um dilúvio de luz é irradiado de Sua Palavra, e as obrigações negligenciadas devem ser atendidas. Quando isso for feito, dando ao Senhor o que Lhe pertence nos dízimos e ofertas, o caminho será aberto para o mundo ouvir a mensagem que o Senhor determina que ouça. Se nosso povo tivesse o amor de Deus no coração, se cada membro da igreja estivesse imbuído do espírito de sacrifício próprio, não haveria falta de fundos para as missões nacionais e estrangeiras; nossos recursos se multiplicariam; mil portas de utilidade se abririam, e nós seríamos convidados a entrar” (Conselhos Sobre Mordomia, p. 27).","SEMANA  5106"]},{"page":107,"blocks":["SEGUNDA-FEIRA","DÍZIMOS: BASE BÍBLICA E ASPECTOS PRÁTICOS A palavra “dízimo” significa a décima parte de algo. Biblicamente é a devolução a Deus de 10% de nossas rendas. Ao fazê-lo, reconhecemos que todos os nossos recursos procedem do Senhor e pertencem a Ele. O termo “dízimo” ocorre pela primeira vez em Gênesis 14:17 a 24, em menção à experiência vivida pelo patriarca Abraão. Esse episódio aconteceu antes da formação do povo de Israel, revelando que o dízimo não é uma instituição judaica, mas um princípio que deve ser observado pelos crentes de todas as épocas. A experiência de Abraão nos ensina algumas lições: O dízimo se baseia no rendimento. Em Gênesis 14:20, fica claro que Abraão “deu o dízimo de tudo” ao rei de Salém. Isso mostra que o dízimo do patriarca teve como base o valor total de suas posses. A bênção vem antes do dízimo. Primeiro, Melquisedeque destacou as bên - çãos que Abraão havia recebido; e, somente depois, o patriarca devolveu o dízimo. Teologicamente, a bênção vem antes do ato de dizimar. Sem reconhe - cer que tudo o que temos e somos vem de Deus, é impossível adorá-Lo com a devolução dos dízimos. Em outras palavras, não dizimamos para ser abençoa - dos, mas porque já fomos. O uso do dízimo. Em Números 18:21 a 26, somos orientados sobre o emprego dos dízimos. Esse recurso santo deve ser usado para manter os que trabalham exclusivamente para o avanço da causa de Deus. Note que, ao dizimar, os israelitas não estavam pagando o serviço dos levitas. Na verdade, foram instruídos a devolver os dízimos ao Senhor, e o Senhor decidiu doá-los aos levitas.","Jesus e o dízimo. A declaração de Jesus registrada em Mateus 23:23 e Lucas","11:42 é claramente uma confirmação do dízimo. Devemos ter em mente que os evangelhos foram escritos anos depois da ressurreição de Jesus. Se o dízimo não fosse mais necessário para a igreja, os escritores dos evangelhos teriam deixado isso claro. Mas essas palavras de Jesus foram usadas pelos autores bíblicos para instruir a igreja quanto ao dever de dizimar. A fidelidade é uma bênção.  “O sistema especial de dízimos se baseia em um princípio tão duradouro como a lei de Deus. Esse sistema foi uma bênção ao povo judeu, do contrário o Senhor não o teria dado a eles. Logo, será igualmente uma bênção aos que o observarem até o fim dos tempos” (Conselhos Sobre Mordomia, p. 67). A fidelidade nos ajuda a ter Deus em primeiro lugar na vida.  “Não deve - mos consagrar a Ele o que resta de nossas rendas depois que todas as nossas necessidades reais ou imaginárias tenham sido satisfeitas; mas, antes de qual - quer parte ser gasta, devemos separar aquilo que Deus especificou como Seu” (Conselhos Sobre Mordomia, p. 81).","SEMANA  5 107"]},{"page":108,"blocks":["TERÇA-FEIRA","SERIEDADE NO USO E NA APLICAÇÃO DOS RECURSOS E xistem mais dois aspectos que precisam ser esclarecidos sobre o uso e a aplicação dos recursos da igreja. Seriedade no uso dos recursos. Alguém disse certa vez: “Deus seja louvado porque a organização Adventista do Sétimo Dia não tem um dono que está enri - quecendo com os recursos da igreja.” Isso é uma verdade. Os recursos da igreja não servem para enriquecer um ser humano, mas para cumprir a missão. Você faz parte de uma denominação que tem um respeitável controle das finanças. A Igreja Adventista segue um rigoroso sistema de auditoria e orçamentos que controlam cada centavo de seus recursos, a fim de que o dinheiro seja aplicado na pregação do evangelho. Por meio do aplicativo 7me, você pode acompanhar a aplicação dos recursos financeiros de sua igreja local. Além disso, regularmente, as instituições da igreja disponibilizam os balanços financeiros em suas comissões diretivas. Seriedade na aplicação dos recursos.  Os recursos da igreja são usados para a pregação do evangelho em todo o mundo. “O plano divino do sistema do dízimo é belo em sua simplicidade e equidade. Todos podem praticá-lo com fé e ânimo, pois é de origem divina. A simplicidade e a utilidade se aliam nele, e não se exige conhecimentos profundos para compreendê-lo e executá-lo. Todos podem sentir que lhes é possível ter parte em promover a preciosa obra de salvação”  (Conselhos Sobre Mordomia, p. 73). O gráfico a seguir mostra o destino dos dízimos e das ofertas: Recomendações divinas – O dízimo não deve ser destinado para as despesas ou emergências da igreja local nem para o trabalho assistencial ( Administração Eficaz , p. 103). Essas necessidades serão supridas por meio das ofertas avulsas e do pacto. 75% Pregação do evangelho por meio dos pastores e evangelismo das Associações/ Missões. 10% Pregação do evangelho na América do Sul (Divisão Sul Americana). 10% Pregação do evangelho em uma região do Brasil (União). % (variável) – Pregação do evangelho pelos meios de comunicação – Rede Novo Tempo. % (variável) – Pregação do evangelho por meio dos Seminários de Teologia e pela Educação Adventista. % (variável) – Pregação do evangelho por meio da rede educacional adventista. 1% Pregação do evangelho por meio do Ministério de Publicações. Destino do dízimo","SEMANA  5108"]},{"page":109,"blocks":["QUARTA-FEIRA","OFERTAS REGULARES E PROPORCIONAIS N ossas ofertas devem ser pautadas por quatro princípios:","1. Regularidade. Assim como o dízimo, a oferta deve ser regular, con -","forme os recursos recebidos pelo adorador. Isso quer dizer que, se há renda, deve haver dízimos e ofertas.","2. Prioridade. Como o dízimo, a oferta deve ser a primeira parte de nossas","rendas a ser separada. “Honra ao SENHOR com os teus bens e com as primícias de toda a tua renda ; e se encherão fartamente os teus celeiros, e transborda - rão de vinho os teus lagares” (Pv 3:9, 10; itálico acrescentado).","3. Planejamento. “Esse assunto de doação não deve ser por impulso. Deus","nos deu instrução definida a esse respeito. Especificou os dízimos e as ofertas como sendo a medida de nossa obrigação. E Ele deseja que doemos de forma regular e sistemática. […] Examine cada um suas rendas regularmente, pois são todas uma bênção de Deus, e ponha à parte o dízimo como um fundo separado para ser sagradamente do Senhor. […] Depois de o dízimo ser posto à parte, as dádivas  e ofertas devem ser proporcionais, ‘conforme a sua prosperidade’ (Conselhos Sobre Mordomia, p. 80, 81; itálico acrescentado).","4. Porcentagem. A oferta deve ser devolvida com base em um percentual","escolhido pelo ofertante (a porcentagem de 10% do dízimo foi determinada por Deus, já o percentual da oferta é estabelecido pelo adorador). Sessenta por cento das entradas de ofertas regulares atendem às necessida - des da igreja local, e 40% são destinados às necessidades da pregação do evan - gelho em outras partes do mundo. No entanto, devemos prestar atenção, pois existem doações que não têm o mesmo destino. As ofertas podem ser direcio - nadas e permanecer em uma geografia específica se forem destinadas a pro - jetos da igreja local. Definindo os termos Ofertas regulares. São as ofertas em que o adorador não determina a aplica - ção delas. Uma parte dessas doações é usada na igreja local, e outra, ao redor do mundo. Ofertas direcionadas. Se o adorador desejar, depois da devolução do dízimo e da oferta regular, pode fazer uma oferta direcionada para algum ministério ou projeto da igreja local (construção, reforma, etc.), bem como iniciativas pessoais de evangelismo (livros missionários, Missão Calebe, etc.). Essa oferta não subs - titui o pacto nem o dízimo. Também não necessita ter um percentual e regularidade. Ela pode ser entregue enquanto durarem os projetos ou as necessidades.","SEMANA  5 109"]},{"page":110,"blocks":["QUINTA-FEIRA","FIDELIDADE NA PRÁTICA V eja um exemplo de como preencher o cartão de dízimos e ofertas: Certo irmão, com uma renda mensal de 600 reais, decidiu ser fiel ao Senhor, devolvendo o dízimo e uma oferta regular de 10%. Indo mais além, resolveu fazer uma oferta direcionada no valor de 50 reais mensais, pois sua igreja necessitava comprar um novo equipamento de som. Como esse irmão deveria preencher o guia? 1o Passo: preencher os dados iniciais de identificação: igreja, nome, mês e ano. 2o Passo: preencher o valor do dízimo no espaço designado. Nesse caso, o valor a ser indicado é de 60 reais. Observação: esse valor representa 10% da renda do adorador, conforme a orientação do Senhor em Levítico 27:30 e 32. 3o Passo: preencher o valor da oferta regular (ou pacto, em alguns lugares) no espaço designado. A oferta regular deve ser um percentual proporcional às bênçãos recebidas (veja 2Co 9:7). Nesse exemplo, o adorador decidiu entregar 10% de sua renda como pacto, isto é, 60 reais. 4o Passo: preencher o valor da oferta direcionada no espaço designado. No caso do irmão mencionado, ele deveria escrever 50 reais, em referência ao valor que havia se comprometido a colaborar para a aquisição de um novo equipamento de som para a igreja local. Observação: esse valor será destinado integralmente à compra do som, conforme indi - cado pelo adorador. 5o Passo. Somar o total das doações e colocar no enve - lope com o valor corres - pondente. Nesse exemplo, o total da soma deveria ser 170 reais (60 reais de dízimo + 60 reais da oferta regular + 50 reais da oferta direcionada). Associação / Missão Adoração ao Senhor Igreja Nome Mês            Ano (01)            Dízimo (19)             Oferta regular Oferta de Sacrifício R$ R$ R$ R$ VALOR TOTAL Assinatura Data 60,00 10% - 60,00 50,00 170,00 Equipamento de som","SEMANA  5110"]},{"page":111,"blocks":["SEXTA-FEIRA","CUIDANDO DAS FINANÇAS A lguém já disse que “a satisfação nem sempre é o cumprimento daquilo que queremos, mas a percepção de como somos abençoados pelo que temos”. Em outras palavras, nos sentimos satisfeitos não porque temos tudo o que gos - taríamos, mas porque somos gratos pelas bênçãos recebidas de Deus. Há quem possa pensar: “Gostava de meu carro até ver um novo modelo na concessionária.” Ou então: “Eu estava satisfeita com minhas roupas e bolsas até ir ao shopping.” Isso revela que há pessoas que nunca estão satisfeitas, não importa o que tenham. Às vezes pensamos que, se tivéssemos “um pouco mais”, tudo ficaria melhor. Contudo, nossa felicidade não pode ser alcançada por meio do acúmulo de bens materiais. Isso não quer dizer que você precisa abandonar seus sonhos e metas, mas que deve se contentar em viver dentro de seu padrão de vida, a fim de não incorrer em dívidas. Vejas algumas dicas para encontrar satisfação financeira: Primeiro passo . Para onde vai meu dinheiro? Anote todos os seus gastos durante o mês. Separe esses gastos em três categorias: (1) as despesas fixas, que não podem ser alteradas (dízimo, ofertas, aluguel, financiamentos, impos - tos); (2) as despesas necessárias, que podem variar de mês a mês (alimenta - ção, água, luz, consultas médicas, combustível); e (3) as despesas não essenciais (passeios, aparelhos eletrônicos, atividades recreativas). Ao registrar seus gastos, você saberá como está empregando seu dinheiro. Segundo passo. Quais são meus objetivos? Você precisa quitar dívidas? Quer economizar dinheiro para despesas futuras, como a aquisição de um carro, edu - cação dos filhos ou a aposentadoria? Estabeleça um alvo, por exemplo: depositar 100 reais em uma poupança para a aposentadoria. Então inclua esse valor em seu plano de gastos. Terceiro passo. Compare sua receita com as despesas. Você tem uma entrada de recursos maior do que a saída? Se for assim, está certo. Você tem uma saída de recursos maior do que a entrada? Nesse caso, volte ao primeiro passo e considere o que pode ser mudado. Talvez você esteja gastando demais com coisas supérfluas. Assim, você saberá para onde está indo seu dinheiro, definirá o obje - tivo que deseja alcançar e terá um plano de gastos para assumir o controle de suas finanças. O restante é com você. Agora você já tem o conhecimento necessário para fazer escolhas com sabedoria.","SEMANA  5 111"]},{"page":112,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":113,"blocks":["SÁBADO","FILHOS DO REI I magine um garoto órfão e pobre que vive nas ruas. Ele está sozinho, com fome, sede, frio e medo. Um dia, ao passar por ali, o rei se comove ao vê-lo e decide adotá-lo como filho. Imediatamente o levam ao palácio. Depois de um banho, ele recebe roupas novas e uma comida muito apetitosa e nutritiva é servida a ele. Contudo, o melhor é que ele passa a ter o amor e a proteção de uma família. Como será a vida e o comportamento dele a partir daquele momento? Ao acor - dar cada manhã, ele fará planos para mendigar e procurar restos de alimento no lixo? Isso nem vai passar por sua cabeça. Ele viverá como um filho do rei. Algo semelhante ocorre conosco. Antes de aceitar a Cristo, vivíamos em pecado. Como resultado, não tínhamos paz nem felicidade verdadeira. Porém, ao nos entregarmos a Cristo, fomos adotados como filhos do Rei do Universo (1Jo 3:1). Nascemos de novo espiritualmente. Essa mudança radical afeta todos os aspectos da vida. Assim, já não somos nós quem vivemos, mas Cristo vive em nós (Gl 2:20). À medida que caminhamos diariamente com o Senhor, somos gradativamente transformados à semelhança Dele. Esse processo é chamado na Bíblia de “santificação”. Entretanto, isso não significa que as tentações desaparecerão. Satanás tenta nos afastar de Cristo e nos induzir ao pecado, mesmo no que se refere a questões aparentemente sem importância. Por isso, o apóstolo Pedro nos adverte: “Como filhos da obediência, não vos amoldeis às paixões que tínheis anteriormente na vossa ignorância; pelo contrário, segundo é santo aquele que vos chamou,  tornai-vos santos também vós mesmos em todo o vosso procedimento” (1Pe 1:14, 15). O conselho inspirado é: “Os olhos do Senhor fixam-se em cada um dos membros de Seu povo; Ele tem um plano para cada um. É Seu propósito que os que cumprem Seus santos preceitos sejam um povo distinto. Ao povo de Deus, aplica-se ainda hoje, como ao antigo Israel, as palavras escritas por Moisés sob a inspiração divina: “Tu és povo santo ao Senhor, teu Deus; o Senhor, teu Deus, te escolheu, para que Lhe fosses o Seu povo próprio, de todos os povos que há sobre a Terra (Dt 7:6)” (Testemunhos Para a Igreja, v. 6, p. 12). Nesta semana, estudaremos o que significa, na prática, viver como um filho de Deus. SEMANA Como Agradar a Deus","SEMANA  6 113"]},{"page":114,"blocks":["Voltar ao menu SEMANA  6114","DOMINGO","DEZ PRINCÍPIOS ETERNOS D eus livrou os israelitas da escravidão do Egito. Em liberdade, receberam a lei para que soubessem viver como filhos de Deus. A ordem dos fatos é importante. Deus não pediu aos israelitas que guardassem os Dez Mandamentos para serem libertos do Egito. Ao contrário, primeiro os salvou e somente então lhes deu a lei, a fim de que vivessem como Seu povo escolhido. Da mesma forma, recebemos a salvação por meio da fé em Cristo, de maneira totalmente gratuita e não merecida. Uma vez salvos, o Senhor nos dá os man - damentos como o guia fundamental de conduta cristã. Ao requerer nossa obe - diência, Deus está mostrando Seu amor para conosco, pois sabe que o resultado da obediência é o bem-estar e a felicidade (Dt 4:40). Leia Êxodo 20:3 a 17 e defina com uma palavra o significado de cada um dos Dez Mandamentos. _________________________________________________________________________ _____________________________________________________________________ ____ _________________________________________________________________________ Ao entregar nossa vida ao Senhor, renunciamos o mal e, por amor a Cristo, apresentamos nossos desejos, planos e decisões a Ele. “Porque este é o amor de Deus: que guardemos os Seus mandamentos; ora, os Seus mandamentos não são penosos” (1Jo 5:3). A obediência e o serviço realizado por amor não são um fardo. Podemos dizer como Davi: “Agrada-me fazer a Tua vontade, ó Deus meu; dentro do meu coração, está a Tua lei” (Sl 40:8). Davi se deleitava em cumprir a vontade de Deus expressa nos Dez Mandamentos. A obediência aos Dez Mandamentos é a melhor prova de que amamos a Deus e estamos em comunhão com Ele. “Aquele que diz: Eu O conheço e não guarda os Seus mandamentos é mentiroso, e nele não está a verdade” (1Jo 2:4). Alguns cristãos pensam que a única coisa que importa é amar o Senhor; assim, concluem que não seria necessário obedecer à lei. Isso não é verdade. O amor e a obediência não se opõem, mas são tão inseparáveis como os dois lados de uma moeda. Jesus disse: “Se Me pedirdes alguma coisa em Meu nome, Eu o farei” (Jo 14:14). Mas também afirmou: “Se guardardes os Meus mandamentos, permanecereis no Meu amor” (Jo 15:10). O verdadeiro amor a Cristo nos leva a guardar Sua lei; e a obediência aos mandamentos fortalece nossa comunhão com Ele. “A lei de Deus é uma expressão da natureza divina; é uma personifica - ção do grande princípio do amor e, por isso, o fundamento do Seu governo no Céu e na Terra” (Caminho a Cristo, p. 60)."]},{"page":115,"blocks":["Voltar ao menuSEMANA  6 115","SEGUNDA-FEIRA","SAÚDE E MODÉSTIA N ossa relação com Cristo também se revela quando cuidamos da saúde e nos vestimos de forma decente e modesta. Deus quer que tenhamos saúde e felicidade (Êx 15:26; 3Jo 2). Isso não depende do acaso, mas da obediência às instruções do Senhor. Ele nos pede que cuidemos de nosso bem-estar por meio dos remédios naturais: “Ar puro, luz solar, abstinência, repouso,  exercício, regime conveniente, uso de água e confiança no poder divino” ( A Ciência do Bom Viver, p. 127). Por que devemos manter o corpo e a mente saudáveis? (1Co 6:19, 20) _________________________________________________________________________ Deus nos criou como uma unidade indivisível. Um corpo saudável nos permite pensar melhor e ter comunhão mais íntima com Deus. Por sua vez, a paz e a alegria de ter Cristo como salvador influenciam positivamente nossa saúde física. Por isso, não devemos consumir nada nocivo à saúde, como bebidas alcoólicas, cigarro, drogas e outras substâncias estimulantes (café, chá preto, etc.), que, ape - sar de serem aceitas socialmente, nos prejudicam (Pv 23:29-35; Ef 5:18; 1Co 3:17). Uma boa alimentação é essencial para a saúde. Quando Deus criou Adão e Eva, disse-lhes que se alimentassem de “todas as ervas que dão semente […] e todas as árvores em que há fruto que dê semente” (Gn 1:29, 30; ver Gn 3:18). A ciência já comprovou que esse regime alimentar, utilizado de forma equili - brada, é o ideal para viver mais e melhor. Depois do dilúvio, Deus autorizou o consumo de carne de animais limpos: os que ruminam e que têm unhas fendi - das (carne bovina e ovina), os peixes que têm barbatanas e escamas e as aves de capoeira (Lv 11:1-19). O porco não rumina; portanto não devemos consumi-lo. Outro aspecto importante da vida cristã é a vestimenta e o cuidado pessoal. Nossa aparência exterior reflete o estado de nossa vida espiritual. Como um cristão deve se vestir? Apesar de o texto bíblico mencionado a seguir ser direcio - nado às mulheres, o conceito de modéstia também se aplica aos homens: “que as mulheres em traje decente, se ataviem com modéstia e bom senso, não com cabeleira frisada e com ouro, ou pérolas, ou vestuário dispendioso, porém com boas obras (como é próprio às mulheres que professam ser piedosas)” (1Tm 2:9, 10; veja 1Pe 3:3, 4). Deve-se evitar a sensualidade tão comum na moda atual e tam - bém tudo o que danifica o corpo, como piercings ou tatuagens (Lv 19:28). Decida se vestir de maneira adequada e estabelecer hábitos saudáveis para servir melhor o Senhor com todo seu ser."]},{"page":116,"blocks":["Voltar ao menu SEMANA  6116","TERÇA-FEIRA","AMOR E FIDELIDADE C om o poder de Cristo, podemos amar o próximo assim como Deus nos ama. À medida que permitirmos, o Senhor nos tornará mais amáveis e pacien - tes com os outros, tratando-os como queremos ser tratados. Devemos ter essa atitude sempre, especialmente nos lugares em que passamos mais tempo: em casa e no trabalho (Ef 5:21–6:9). Para manter boas relações humanas, precisamos ter um espírito perdoa - dor. Se percebemos defeitos nos outros, devemos lembrar que também somos falhos. Portanto, necessitamos perdoar da mesma forma que Deus nos perdoa (Ef 4:32). Com a ajuda de Cristo, estaremos dispostos a perdoar até aqueles que nos ofendem repetidamente (Mt 18:21, 22). No casamento, o amor se expressa de maneira única e especial. Deus esta - beleceu o casamento na criação e o definiu como a relação mais íntima que pode haver entre um homem e uma mulher. A união matrimonial é para a vida toda e abrange todos os aspectos do ser humano: físico, emocional, intelectual e espiritual. Como a unidade espiritual é fundamental, o cristão deve se casar apenas com alguém que partilhe da mesma fé (2Co 6:14). O verdadeiro amor “é paciente, é benigno; o amor não arde em ciúmes, não se ufana, não se enso - berbece, não se conduz inconvenientemente, não procura os seus interesses, não se exaspera, não se ressente do mal; não se alegra com a injustiça, mas regozija-se com a verdade; tudo sofre, tudo crê, tudo espera, tudo suporta. O amor jamais acaba” (1Co 13:4-8). Uma das formas de os casais expressarem amor e unidade é a relação sexual. A sexualidade humana não é apenas um meio de reprodução, mas uma bên - ção que une profundamente os cônjuges. O Senhor estabeleceu de modo claro os limites para a expressão da sexualidade: apenas entre um homem e uma mulher unidos pelo matrimônio, preservando o respeito e a consideração pelo cônjuge (1Ts 4:4, 5). Satanás tenta desvirtuar e perverter o sexo, induzindo práticas pecamino - sas condenadas por Deus, como adultério (Êx 20:14), sexo antes do casamento (Dt 22:23-29), prostituição (Dt 23:17), homossexualidade (Lv 18:22; Rm 1:26, 27), travestismo (Dt 22:5) e sexo com animais (Lv 18:23). O cristão deve manter a mente pura (Mt 5:28) e se abster de vícios como pornografia e masturbação (Ef 4:19). “O verdadeiro amor é um princípio elevado e santo, inteiramente diferente em seu caráter daquele amor que se desperta por um impulso e que morre quando severamente provado” (O Lar Adventista, p. 50)."]},{"page":117,"blocks":["Voltar ao menuSEMANA  6 117","QUARTA-FEIRA","PUREZA E INTEGRIDADE A ntes de nos entregarmos a Cristo, vivíamos “segundo o curso deste mundo […], fazendo a vontade da carne e dos pensamentos” (Ef 2:2, 3). Mas Cristo nos resgatou e nos deu vida nova. Como resposta, Ele nos pede que busquemos “as coisas lá do alto” e façamos morrer a “natureza terrena” que há em nós, incluindo a impureza moral, as paixões sensuais e os maus desejos (Cl 3:1-5). Por essa razão, o cristão dever se esforçar, mediante o poder de Cristo, para conservar o coração e a mente puros, pensando no que é verdadeiro, honesto, justo, puro, amável e de boa-fé (Fp 4:8). Isso requer cuidado quanto ao que vemos e ouvimos, pois Satanás procura contaminar nossa imaginação e nos - sos pensamentos, despertando desejos e paixões pecaminosas. Devemos evitar livros, revistas, programas de rádio e televisão, sites, filmes, vídeos ou jogos cujo conteúdo promova atitudes e valores contrários à vontade de Deus. Com muita frequência, essas fontes de entretenimento exaltam a incredulidade, a desonestidade, a falta de respeito, a linguagem obscena, a violên - cia, os vícios e a imoralidade. Alguns alegam que é necessário conhecer o mal para evitá-lo, mas esquecem que, ao nos expormos a esse tipo de coisa, nos tornamos insensíveis à voz de Deus (Mc 4:19; Lc 8:14). Também devemos evitar ir a estádios esportivos, teatros e cinemas, pois, em sua programação normal, esses ambientes não exercem uma influência que eleva. O mesmo ocorre em bailes e locais de dança, porque despertam paixões vulgares e luxúria. O fato de Davi ter dançado quando transportou a arca não nos autoriza a dançar. Para os israelitas, a dança era uma expressão inocente de alegria. Nunca dançavam em grupos mistos nem de forma sensual. A dança consistia em saltos e movimentos circulares, em roda ou de forma individual. A música que escutamos também é importante. Em nossos dias, ela “mui - tas vezes é pervertida para servir a propósitos maus, e assim se torna um dos poderes mais sedutores para a tentação. Mas, se for corretamente empregada, é um dom precioso de Deus, destinado a erguer os pensamentos às coisas altas e nobres, a inspirar e elevar a mente” (Educação , p. 167). Devemos escutar músicas que cumpram esse propósito divino, prestando atenção à letra e aos compo - nentes melódicos, harmônicos e rítmicos, a fim de evitar aquelas que estimulam demasiadamente o ouvinte com adrenalina e acentuam as emoções. “O mundo não deve estipular critérios para nós” ( Testemunhos Para a Igreja, v. 4, p. 35)."]},{"page":118,"blocks":["Voltar ao menu SEMANA  6118","QUINTA-FEIRA","NOVOS PROBLEMAS Q uando aceitamos a Cristo, Ele muda nossa maneira de pensar e de agir em todos os aspectos da vida. Nossos familiares e amigos percebem essa transformação e reagem de diferentes maneiras. Enquanto alguns se alegram, os que não partilham de nossa fé se incomodam, porque já não temos os mesmos ideais nem participamos de certas atividades com eles. Ainda que continuemos tendo amor por eles, percebemos que nossas escolhas de vida nos separaram. O Senhor antecipou que, em alguns casos, os inimigos dos cristãos seriam “os da sua própria casa” (Mt 10:36). A vida de obediência a Deus tende a des - pertar repúdio e oposição por parte dos não crentes (2Tm 3:12; Mt 10:22). O dis - tanciamento afetivo dos entes queridos pode ser uma das provas mais difíceis para um cristão suportar. No entanto, Cristo prometeu que as perdas afetivas ou materiais por causa do evangelho serão plenamente recompensadas pelo afeto e apoio dos irmãos na fé e, especialmente, pela vida eterna (Mc 10:29, 30). Quando aceitamos Cristo, nós nos tornamos membros da família de Deus, pois passamos a compartilhar a mesma fé e esperança. Contudo, após se unir à igreja, é possível que alguém se surpreenda ao encontrar alguns membros que, embora congreguem há anos, não vivem plenamente de acordo com os ensinamentos bíblicos. Essa falta de coerência entre a doutrina e a vida prática de certos membros pode desorientar e desencorajar quem está dando os pri - meiros passos na fé. Esse problema não é novo. Veja como Paulo reprovou os hebreus: “Com efeito, quando devíeis ser mestres, atendendo ao tempo decorrido, tendes, novamente, necessidade de alguém que vos ensine, de novo, quais são os princípios elementares dos oráculos de Deus; assim, vos tornastes como necessitados de leite e não de alimento sólido” (Hb 5:12). Então, o que fazer? O mesmo apóstolo acon - selha: “Consoleis os desanimados, ampareis os fracos e sejais longânimos para com todos” (1Ts 5:14). Não permitamos que o mau exemplo de alguns nos afaste do caminho certo. Cuidemos de nossa conduta, recordando a advertência: “Aquele, pois, que pensa estar em pé veja que não caia” (1Co 10:12). É natural que busquemos modelos humanos para imitá-los. Por fim, devemos olhar “firmemente para o Autor e Con - sumador da fé, Jesus” (Hb 12:2). Ele é o único modelo perfeito. Ele ama todos os Seus seguidores, inclusive os que estão tropeçando no caminho. Ele os adverte e os repreende, mas “não Se envergonha de lhes chamar irmãos” (Hb 2:11). Você está enfrentando essa realidade em sua experiência cristã? Como os princípios aprendidos hoje podem ajudá-lo?"]},{"page":119,"blocks":["Voltar ao menuSEMANA  6 119","SEXTA-FEIRA","PODER PARA SER FIEL L eia Mensagens aos Jovens, p. 109, 110, 285, 286. Se você considera difícil viver de acordo com os princípios que Deus apresenta nas Escrituras, não desanime nem se desespere. Você tem um Salvador compassivo e perdoador. “Jesus deseja que nos cheguemos a Ele como esta - mos, pecaminosos, desamparados e dependentes. Devemos ir com todas nossas fraquezas, imprudência e pecaminosidade, e, arrependidos, lançar-nos a Seus pés. Ele Se alegra ao nos envolver em Seus braços de amor, curar nossas feri - das e nos purificar de toda impureza” (Caminho a Cristo, p. 51, 52). “Os que põem em Cristo a confiança não devem ficar escravizados por nenhuma tendência ou hábito hereditário, ou cultivado. Em lugar de ficar sub - jugados em servidão à natureza inferior, devem reger todo apetite e paixão. Deus não nos deixou lutar contra o mal em nossa própria e limitada força. Sejam quais forem nossas tendências herdadas ou cultivadas para o erro, podemos vencer mediante o poder que Ele está disposto a nos comunicar” ( A Ciência do Bom Viver, p. 175, 176). “Lembre-se sempre de que Jesus é seu ajudador. Ninguém compreende tão bem como Ele as suas peculiaridades de caráter. Ele está atento a você e, se esti - ver disposto a ser guiado por Ele, lançará ao seu redor influências para o bem que o habilitarão a cumprir toda a vontade Dele” ( Mensagem aos Jovens, p. 17). “Vocês já viram o nascer do sol e os efeitos do gradual alvorecer do dia sobre terra e céu. Pouco a pouco aumenta a claridade, até aparecer o sol; então a luz se torna constantemente mais forte e mais clara, até atingir a glória plena do meio-dia. Essa é uma linda ilustração do que Deus deseja fazer por Seus filhos, no aperfeiçoamento da vida cristã” ( Mensagens aos Jovens, p. 15). Como você responderia a quem lhe dissesse que os Dez Mandamentos não precisam mais ser observados? _________________________________________________________________________ Como você poderia ajudar alguém que afirma: “Eu tento viver de acordo com a vontade de Deus, mas não consigo”? _________________________________________________________________________ Nesta semana, estudamos sobre os princípios que devem reger a vida dos seguidores de Cristo. Esses valores nos diferenciam plenamente da maneira de viver do mundo. Em todas as épocas, Deus teve um povo que decidiu ser dife - rente da cultura dominante. Que Deus abençoe você para que sua vida seja uma demonstração de que os princípios bíblicos são uma bênção!"]},{"page":120,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]},{"page":121,"blocks":["SÁBADO","NOVO NASCIMENTO: MUDANÇA DE IDEOLOGIAS E PRÁTICAS S er um adventista significa viver como tal. E isso implica mudanças, que são fruto do novo nascimento (veja Tratado de Teologia Adventista do Sétimo Dia, p. 761-794). Vamos abordar essas mudanças resumidamente.","1. Aspectos espirituais","Precisamos estar em comunhão com Cristo, para isso, siga as orientações abaixo:","• Dedique tempo para a devoção pessoal e o culto em família.","• Durante o dia, relembre alguma promessa ou verdade aprendida no culto.","• Ao fim da tarde, reflita sobre como Deus conduziu você naquele dia.","2. Aspectos físicos","O cuidado físico está fundamentado em três princípios:","•  Deus espera que cuidemos de nosso corpo e o tratemos com responsabi -","lidade (ver 1Co 6:19);","• Abstinência de vícios (1Co 6:12; 10:23): Devemos fugir de toda intemperança.","•  Santificação em tudo (1Ts 5:23): O estilo de vida fortalecerá nossa força","moral e espiritualidade e nos fará crescer em graça e santidade.","3. Aspectos sociais","• Cremos em um casamento monogâmico, permanente e santo.","• A intimidade sexual é exclusiva para o casamento entre homem e mulher.","• Como adventistas, somos discípulos de Cristo em todo lugar.","4. Aspectos de responsabilidade pessoal","•  Os adventistas apreciam a beleza e o bom gosto, mas não devem ser pri -","sioneiros da moda, regidos pela ostentação no vestuário nem usar adere - ços impróprios. Devemos praticar a modéstia e destacar a beleza interior.","•  Os adventistas devem praticar o domínio próprio em todos os aspectos da","vida, o que inclui a recreação e o lazer.","Para pensar: Que aspectos de sua vida espiritual, física, social e pessoal precisam ser melhorados?","Mente Renovada SEMANA","SEMANA  7 121"]},{"page":122,"blocks":["DOMINGO","COSMOVISÃO: DEFINIÇÃO E IMPORTÂNCIA Conceito de cosmovisão O novo nascimento provoca em nós uma mudança de cosmovisão. Mas o que é isso? A cosmovisão é uma espécie de “lente” intelectual através da qual vemos a realidade. É um conjunto detalhado de crenças combinadas de forma consistente e coerente (Stephen Evans, Dicionário de Apologética e Filosofia da Religião , p. 36, 37). Em outras palavras, cosmovisão é um conjunto de pressu - posições básicas que regem nossa vida. A cosmovisão está tão enraizada nas pessoas que é possível que dois ou mais grupos cheguem a conclusões diferentes observando o mesmo fenômeno. Vamos dar um exemplo: Considerando que o princípio científico da causali - dade afirma que tudo que tem um começo deve ter uma causa, seria razoável procurar fora da natureza o verdadeiro Originador do Universo? Um cosmólogo que não acredita em Deus responderia “não!”, ao passo que um cosmólogo cris - tão diria: “sim!” O que faz a diferença nessas respostas antagônicas sobre um mesmo fenô - meno? Um cosmólogo não acredita em Deus (cosmovisão ateísta), enquanto o outro acredita (cosmovisão bíblico-cristã). Nesse caso, como você percebeu, não se trata de um embate entre a fé e a razão ou entre a ciência e a religião, mas entre crer e não crer  em Deus. Portanto, na base das crenças está a cosmovisão. Importância da cosmovisão As cosmovisões são importantes porque influenciam a existência como um todo e determinam os valores adotados por cada pessoa. Também determinam a maneira como os seres humanos pensam e agem. Na prática, usamos nossa cosmovisão a todo momento. Vejamos dois exemplos: (1) É correto mentir para salvar uma vida? (2) Pode-se roubar para ajudar outros? As respostas a essas perguntas vão depender de nossa cosmovisão. A cosmovisão que adotamos não influencia apenas nossa espiritualidade, mas todos os aspectos de nossa vida. Por exemplo, vejamos o que acontece com a questão da adoração : nós, teístas bíblicos, acreditamos que fomos criados por Deus com o propósito de adorá-Lo e termos comunhão com Ele; já os ateus nem cogitam essa possibilidade. A cosmovisão também afeta nossos pressupostos morais, nossos valores e nossa ética. Esse é o ponto em que você deve ter o máximo de cuidado, questionando-se periodicamente a respeito de como sua cosmovisão, a de seus amigos, a dos livros que você lê e a dos filmes aos quais assiste estão impac - tando sua maneira de encarar os valores espirituais, morais e éticos.","SEMANA  7122"]},{"page":123,"blocks":["SEGUNDA-FEIRA","PRINCIPAIS COSMOVISÕES E SUA INFLUÊNCIA N a leitura de ontem aprendemos que o termo “cosmovisão” se refere a um tipo de “lente intelectual” através da qual enxergamos a realidade. Hoje conheceremos as principais cosmovisões e como elas nos influenciam.","1. Cosmovisão cristã . Está centralizada em um Deus pessoal, mediante a reve -","lação da Bíblia.","2. Cosmovisão ateíst a. Nessa cosmovisão Deus não existe, e os seres huma -","nos cuidam de si mesmos e de seu progresso.","3. Cosmovisão islâmica . Está centrada em um Deus pessoal (Alá) e funda -","mentada no Alcorão. Considera Maomé a figura principal de ensino e norma.","4. Cosmovisão pós-moderna . Representa uma forma de relativismo cultural","sobre diversos aspectos, como verdade, valores, razão, etc. Como as cosmovisões nos influenciam Observe o impacto que essas cosmovisões causam em diferentes temas: O que pensa sobre Cristianismo Ateísmo Islamismo Pós-Modernismo Deus Ser infinito e pessoal Não existe Ser infinito e pessoal Existem deuses: infinitos, impessoais ou pessoais Mundo Criado ex nihilo (do nada), finito Eterno (material) Criado, finito Surgiu por acaso Milagre Possível e real Impossível Pode ser possível, mas não real Impossível Natureza humana Corpo mortal Corpo mortal, não há espírito Corpo mortal, “alma” imortal Corpo mortal, “alma” imortal Destino humano Ressurreição para recompensa ou julgamento Aniquilação Recompensa ou julgamento da alma Reencarnação, unindo-se a Deus Origem do mal Livre-arbítrio Ignorância humana Livre-arbítrio Ilusão Fim do mal Será derrotado por Deus –––––––– Será derrotado por seres humanos e por Deus Será derrotado pela humanidade Ética Baseada em Deus Baseada na humanidade Baseada em Deus Baseada em critérios humanos Adaptado de Norman Geisler, Enciclopédia de Apologética  (São Paulo: Vida, 2002), p. 193.","Para pensar:","Em que aspectos da cosmovisão cristã você precisa aprofundar seu conhe - cimento? Quais são as cosmovisões dominantes dos últimos filmes aos quais você assistiu ou dos livros que tem lido?","SEMANA  7 123"]},{"page":124,"blocks":["TERÇA-FEIRA","COSMOVISÃO CRISTÃ ADVENTISTA O valor da cosmovisão crist ã De acordo com Mark Blocher, no artigo “Cosmovisão: Uma Introdução”, a cos - movisão cristã tem pelo menos três grandes benefícios ou valores. Primeiro, ela unifica as crenças de uma pessoa em um sistema coerente e bíblico. Em segundo lugar, a cosmovisão crist ã  fornece um guia para a vida prática. O cristianismo foi designado por Deus para fazer a diferença na vida real. Isso quer dizer que, quando vemos a realidade pelas lentes da história divina da criação, queda, redenção e consumação, o mundo faz sentido. Finalmente, a cosmovisão crist ã  fornece as ferramentas necessárias para discernir a verdade do erro. As Escrituras e a autorrevelação de Deus na natu - reza nos proveem o conhecimento de que necessitamos para tomar decisões sobre o que é verdade e o que não é. A cosmovisão adventista A cosmovisão adventista está resumida no livro Nisto Cremos. É a partir das crenças descritas nessa obra que se forma nossa identidade como igreja remanescente. Como adventistas, cremos:","1. Nas Escrituras Sagradas.","2. Na Trindade.","3. No Pai.","4. No Filho.","5. No Espírito Santo.","6. Na criação.","7. Que fomos feitos à imagem e","semelhança de Deus.","8. No grande conflito.","9. Na vida, morte e ressurreição","de Cristo.","10. Na salvação.","11.  Na necessidade de crescer","em Cristo.","12. Na igreja.","13. No remanescente e sua missão.","14. Na unidade do corpo de Cristo.","15. No batismo.","16. Na Ceia do Senhor.","17.Cremos nos dons e ministérios","espirituais.","18.  No dom de profecia, manifestado","em Ellen G. White.","19. Na lei de Deus.","20. No sábado, que é o dia do Senhor.","21. Que somos administradores","de Deus.","22. No dever de demonstrar uma","conduta cristã.","23. No casamento e na família,","conforme os moldes bíblicos.","24. No ministério de Cristo no","santuário celestial.","25. Na segunda vinda de Cristo.","26. Na morte e na ressurreição.","27. No milênio e no fim do pecado.","28. Na nova Terra","SEMANA  7124"]},{"page":125,"blocks":["QUARTA-FEIRA","CRER TAMBÉM É PENSAR A Bíblia nos coloca diante de um sagrado desafio: “Antes, santificai a Cristo, como Senhor, em vosso coração, estando sempre preparados para respon - der a todo aquele que vos pedir razão da esperança que há em vós” (1Pe 3:15). A palavra traduzida como “responder” (apologian) originou o termo “apologia”. A expressão apologian tem o sentido de defesa forense, como um discurso de defesa perante um tribunal (W. C. Taylor, Dicionário do Novo Testamento Grego , p. 30). Isso significa que precisamos cultivar uma fé inteligente. A importância de cultivar uma fé inteligent e O teólogo William Craig afirma que vivemos em uma época em que “as pes - soas se voltam para o subjetivismo apenas em relação à ética e à religião, e não em áreas passíveis de demonstração pela ciência” ( Ensaios Apologéticos, p. 24). Por isso, muitas pessoas acreditam em Jesus Cristo da mesma forma que creem em fadas e duendes. Assim, muita gente acha que fé é algo puramente abstrato, simbólico; apenas espiritual. Em Hebreus 11:1, porém, a fé é definida como “a certeza de coisas que se esperam, a convicção de fatos que se não veem”. Paulo argumenta que a fé é uma demonstração convincente. Isso significa que a fé cristã é inteligente! Quando o apóstolo diz que ela é “a convicção de fatos que se não veem”, ele quer dizer que a pessoa com fé “age como se dita realidade fosse tão definitiva como se ela mesma a tivesse visto com seus próprios olhos ou experimentado com seus próprios sentidos” (J. D. Thomas, Razão, Ciência e Fé , p. 309). A fé pode nos levar do incompreensível à certeza, transformando o invisível em realidade. Como cultivar uma fé inteligente? Para termos uma fé inteligente, precisamos nos preparar e estudar a Palavra de Deus com mais profundidade. Nesse sentido, a expressão “estando sempre preparados para responder” (1Pe 3:15) tem que ver não apenas com um cristia - nismo bem-intencionado, mas com um cristianismo bem fundamentado. Uma fé inteligente se fundamenta na mais sólida teologia e usa os bons recursos do conhecimento científico para atingir o coração e a mente daqueles que querem saber a razão da esperança que há em nós. Coloque em prática estes três conselhos: (1) cultive uma fé inteligente lendo a Bíblia com espírito de aprendiz, buscando compreender cada palavra; (2) amplie seu conhecimento bíblico lendo os livros de Ellen G. White; e (3) solidifique sua compreensão da Palavra consultando o Comentário Bíblico Adventista , bem como outras obras adven - tistas de referência.","SEMANA  7 125"]},{"page":126,"blocks":["QUINTA-FEIRA","GUARDANDO AS “ENTRADAS DA ALMA” C omo Paulo ensinou em Filipenses 4:8, Ellen G. White afirma que “temos uma obra a fazer a fim de resistirmos à  tentação. Aqueles que não querem ser presa dos ardis de Satanás devem guardar bem as entradas da alma; devem evitar ler, ver ou ouvir aquilo que sugira pensamentos impuros” (Mente, Caráter e Personalidade, v. 1, p. 107). A pergunta é: Como guardar as entradas da alma? Como se proteger dos ataques do inimigo? As entradas da alma O texto de Filipenses 4:8 apresenta uma resposta clara a essas perguntas (as explicações a seguir foram adaptadas do Comentário Bíblico Adventista do Sétimo Dia, v. 7, p. 165):","• Primeiro: devemos ocupar nosso tempo e pensamento com tudo o que é","verdadeiro, ou seja, tudo o que é moral e espiritualmente sensato.","• Segundo: Paulo diz que devemos ocupar nosso tempo e pensamento com","tudo o que é respeitável , isto é, com tudo o que é de bom caráter.","• Terceiro: guardamos as entradas da alma ocupando nosso pensamento com","ideias justas. Em outras palavras, devemos ocupar nossa mente com pensamentos puros, modestos e que estão acima de qualquer reprovação.","• Quarto: se quisermos guardar devidamente as entradas da alma, precisa -","mos manter a pureza em todos os aspectos da vida, incluindo a sexualidade, os motivos e desejos.","• Quinto: precisamos ocupar nosso pensamento com o que é amável , ou seja,","amigável, aceitável e agradável.","• Sexto: podemos guardar as entradas da alma praticando as coisas de boa","fama: o que é sensato e que está em harmonia com o estilo de vida cristão.","• Sétimo: Paulo também diz que somente as coisas que possuem virtude ou","excelência moral devem ocupar nossa mente.","• Oitavo: devemos ocupar nossa mente com pensamentos louváveis , isto é,","aprováveis, positivos. Percebemos, em Filipenses 4:8, que precisamos viver de modo íntegro, sendo leais a Deus e à Sua Palavra. E como Ellen G. White escreveu: “Todos devem vigiar os sentidos, do contrário Satanás alcançará vitória sobre eles; pois essas são as avenidas da alma” ( Testemunhos Para a Igreja, v. 3, p. 507). Só há uma alternativa para obter a vitória: “Você deve se tornar fiel sentinela de seus olhos, ouvidos e todos os sentidos, se quiser dominar a mente e impedir que vãos e corruptos pensamentos lhe manchem o caráter. Só o poder da graça pode realizar essa tão desejável obra” ( Mente, Caráter e Personalidade , v. 2, p. 661).","SEMANA  7126"]},{"page":127,"blocks":["SEXTA-FEIRA","VISÃO ADVENTISTA N esta semana, estudamos sobre a tensão entre o estilo de vida adventista e o do mundo. Aprendemos que ser um cristão adventista do sétimo dia significa viver como cristão adventista do sétimo dia. Isso implica mudanças, as quais afetam diferentes aspectos da vida, uma vez que abandonamos nossa antiga forma de pensar e adotamos uma cosmovisão bíblico-cristã. “Há uma ciência do cristianismo a ser dominada — ciência tão mais profunda, vasta e alta que qualquer ciência humana, como os céus são mais elevados do que a Terra. A mente deve ser disciplinada, educada, exercitada; pois nos cumpre fazer serviço para Deus por maneiras que não se acham em harmonia com nossa inclinação inata. As tendências hereditárias e cultivadas para o mal devem ser vencidas. Muitas vezes, a educação e as práticas de toda uma existência devem ser rejeitadas para que a pessoa possa se tornar um aprendiz na escola de Cristo. Nosso coração deve ser educado em se firmar em Deus. Cumpre-nos formar hábitos de pensamento que nos habilitem a resistir à tentação. Devemos aprender a olhar para cima. Os princípios da Palavra de Deus — princípios tão elevados como o céu e que abrangem a eternidade — cumpre-nos  compreendê-los em sua relação para com a nossa vida diária. Cada ato, cada palavra, cada pen - samento devem estar de acordo com esses princípios. Tudo deve ser posto em harmonia com Cristo e a Ele sujeito” (A Ciência do Bom Viver, p. 453, 454). “Paulo escreveu: ‘Tudo o que é verdadeiro, tudo o que é respeitável, tudo o que é justo, tudo o que é puro, tudo o que é amável, tudo o que é de boa fama, se alguma virtude há e se algum louvor existe, seja isso o que ocupe o vosso pen - samento’ (Fp 4:8). Isso exigirá oração fervorosa e incessante vigilância. Deve - mos ser auxiliados pela influência permanente do Espírito Santo, que atrairá a mente para cima e fará com que se habitue a ocupar-se com coisas puras e santas. E devemos estudar diligentemente a Palavra de Deus” ( Patriarcas e Pro - fetas, p. 460).","SEMANA  7 127"]},{"page":128,"blocks":["PARA TER ACESSO A MAIS","CONTEÚDOS SOBRE O TEMA ESTUDADO DURANTE ESTA SEMANA, ACESSE:","CRESCENDOEMCRISTO.ORG","OU USE O QR-CODE"]}]}];

function linkifyRefs(text){const books=['1 Tessalonicenses','2 Tessalonicenses','1 Coríntios','2 Coríntios','1 Crônicas','2 Crônicas','1 Timóteo','2 Timóteo','1 Samuel','2 Samuel','1 Reis','2 Reis','1 João','2 João','3 João','1 Pedro','2 Pedro','1 Timóteo','2 Pedro','Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cantares','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oséias','Joel','Amós','Obadias','Jonas','Miquéias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','Gálatas','Efésios','Filipenses','Colossenses','Tito','Filemom','Hebreus','Tiago','Judas','Apocalipse'];const book=books.sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');const re=new RegExp('\\b('+book+')\\s+\\d+(?::\\d+(?:\\s*(?:a|-|–)\\s*\\d+)?)?(?:\\s+e\\s+\\d+)?','gi');return text.replace(re,m=>'<a href="#" class="ref-link" data-ref="'+esc(m)+'">📖 '+esc(m)+'</a>');}

function splitOptions(s){let a=s.split(/\s{2,}/).map(x=>x.trim()).filter(Boolean);if(a.length<2){a=s.split(/\s+(?=(?:Amor|Indiferença|Deus|Cristo|Pedro|João|Todos|Alguns|Nenhum|Morte|Vida eterna|A Cristo|Sábado|Domingo|Qualquer dia|Do homem|Dos anjos|Fazer o bem|Comprar e vender|Por imersão|Por aspersão|Por efusão|Pela graça|Pelas obras|Pela tradição|O templo|O santuário|A tradição|A razão|No Céu|Na Terra|Rebeldia|Gula|Sexo)\b)/i).map(x=>x.trim()).filter(Boolean);}return a.length>=2?a:[];}

function renderIntro(g){const p=g.pages[0];let html='<div class="content-card"><div class="eyebrow">▶ Comece aqui</div>';let started=false;p.blocks.forEach(b=>{let x=cleanIntroBlock(b);if(!x||/^Clique no player/i.test(x))return;const idx=x.indexOf('Sua vez de procurar:');if(idx>=0){const before=x.slice(0,idx).trim(),after=x.slice(idx+'Sua vez de procurar:'.length).trim();if(before)html+=renderText(before,'lead');html+='<div class="callout"><strong>🔎 Sua vez de procurar</strong><div class="text-block">'+formatText(after)+'</div></div>';started=true;return;}if(/^JESUS E/i.test(x)||/^ESTUDO\s*BÍBLICO/i.test(x))return;html+=renderText(x,started?'':'lead');started=true;});html+='</div>';return html;}
function renderQuestion(q,gid){const key=gid+'-q'+q.num;const selected=choices[key]||'';let opts='';if(q.options.length){opts='<div class="options">'+q.options.map((o,i)=>'<label class="option '+(selected===String(i)?'selected':'')+'"><input type="radio" name="'+esc(key)+'" value="'+i+'" data-choice="'+esc(key)+'" '+(selected===String(i)?'checked':'')+'><span class="option-mark">'+(selected===String(i)?'✓':'')+'</span><span>'+formatText(o)+'</span></label>').join('')+'</div>';}let note='';if(!q.options.length){note='<div class="answer-note"><div class="eyebrow">✎ Sua resposta</div><textarea data-note="'+esc(key)+'" placeholder="Escreva sua resposta ou reflexão…">'+esc(notes[key]||'')+'</textarea></div>';}return '<article class="question-card" id="'+esc(key)+'"><div class="q-head"><div class="q-num">'+q.num+'</div><div class="q-text">'+formatText(q.text)+'</div></div>'+opts+note+'</article>';}
function parseQuestions(blocks,gid){let qs=[],i=0;while(i<blocks.length){let b=blocks[i].trim();if(!isQuestion(b)){i++;continue;}const m=b.match(/^(\d+)\.\s*/);let q={num:m?m[1]:'',text:b.replace(/^\d+\.\s*/,''),options:[]};if(i+1<blocks.length&&looksLikeOptions(blocks[i+1])){q.options=splitOptions(blocks[i+1]);if(q.options.length)i++;}qs.push(q);i++;}return qs;}
function renderQuestionPage(g){const blocks=g.pages[1].blocks;const qs=parseQuestions(blocks,g.id);let html='<div class="section-title">Perguntas para você responder</div><div class="content-card soft"><p class="text-block">Leia cada pergunta com calma, consulte a referência bíblica e registre sua resposta. Nas questões com alternativas, toque na opção que considerar adequada.</p></div>';html+=qs.map(q=>renderQuestion(q,g.id)).join('');let rest=blocks.filter((b,idx)=>{if(isQuestion(b))return false;return true;});let reflection=rest.filter(b=>isHeading(b)||/^(Compromisso de fé|Converse com seu instrutor bíblico|Que áreas da minha vida|O que você aprendeu|Por que guardar|Dicas para|Fatos bíblicos)/i.test(b.trim()));if(reflection.length){html+='<div class="section-title">Reflexão e compromisso</div>';for(const b of reflection){if(/^Compromisso de fé/i.test(b.trim()))html+='<div class="faith"><strong>🙏 Compromisso de fé</strong><div class="text-block">'+formatText(b.replace(/^Compromisso de fé:\s*/i,''))+'</div></div>';else if(isHeading(b))html+='<div class="content-card soft"><h3>'+formatText(b)+'</h3></div>';else html+=renderText(b);}}return html;}
function renderAdditional(g){const p=g.pages[2];let html='<div class="section-title">Continue durante a semana</div><div class="content-card additional"><div class="eyebrow">📚 Estudo adicional</div>';for(const b of p.blocks){let x=b.replace(/Voltar ao menu\d*/gi,'').replace(/\s+/g,' ').trim();if(!x||/^Clique no player/i.test(x))continue;if(isHeading(x)||/^(COMUNHÃO|RELACIONAMENTO|MISSÃO)$/i.test(x))html+='<h3>'+formatText(x)+'</h3>';else html+=renderText(x);}return html+'</div>';}
function renderSupplement(g){let html='<div class="section-title">Guia Crescendo em Cristo</div><div class="content-card"><p class="text-block">Esta parte complementar reúne o acompanhamento semanal do material original. A paginação foi retirada para favorecer a leitura contínua em hipertexto.</p></div>';let current=null;for(const p of g.pages){for(const b0 of p.blocks){let b=b0.replace(/SEMANA\s+\d+\s+\d+/gi,'').replace(/\s+/g,' ').trim();if(!b||/^Voltar ao menu/i.test(b))continue;if(/^SEMANA\s+\d+/i.test(b)){current=b.match(/^SEMANA\s+\d+/i)[0];html+='<div class="section-title">'+esc(current)+'</div>';continue;}if(/^(DOMINGO|SEGUNDA-FEIRA|TERÇA-FEIRA|QUARTA-FEIRA|QUINTA-FEIRA|SEXTA-FEIRA|SÁBADO)$/i.test(b)){html+='<div class="week-card"><h3>'+formatText(b)+'</h3></div>';continue;}if(isHeading(b)&&b.length<90){html+='<div class="content-card soft"><h3>'+formatText(b)+'</h3></div>';}else html+='<div class="content-card soft">'+renderText(b)+'</div>';}}return html;}
function render(){nav.innerHTML=DATA.filter(g=>g.type==='study'||g.type==='supplement').map(g=>'<button class="nav-item" data-id="'+g.id+'">'+esc(g.title)+'</button>').join('');content.innerHTML=DATA.map(g=>{if(g.id==='inicio')return '<section class="section active" id="inicio">'+renderCover()+'</section>';if(g.type==='study'){const num=(g.title.match(/Estudo\s+(\d+)/i)||[])[1]||'';return '<section class="section" id="'+g.id+'"><div class="study-top"><h2>'+esc(g.title.replace(/^Estudo\s+\d+\s+—\s*/i,''))+'</h2><div class="study-number">'+esc(num)+'</div></div>'+renderIntro(g)+renderQuestionPage(g)+renderAdditional(g)+'</section>';}if(g.type==='supplement')return '<section class="section" id="'+g.id+'"><div class="study-top"><h2>'+esc(g.title)+'</h2><div class="study-number">+</div></div>'+renderSupplement(g)+'</section>';return '';}).join('');bind();openSection(location.hash.slice(1)||'inicio');const enter=document.getElementById('enterStudies');if(enter)enter.addEventListener('click',()=>{sidebar.classList.add('open');});}
function bind(){document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>openSection(b.dataset.id)));document.querySelectorAll('.ref-link').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openBible(a.dataset.ref)}));document.querySelectorAll('[data-choice]').forEach(r=>r.addEventListener('change',()=>{choices[r.dataset.choice]=r.value;localStorage.setItem(choicesKey,JSON.stringify(choices));document.querySelectorAll('input[name="'+CSS.escape(r.name)+'"]').forEach(x=>{x.closest('.option').classList.toggle('selected',x.checked);x.closest('.option').querySelector('.option-mark').textContent=x.checked?'✓':'';});}));document.querySelectorAll('[data-note]').forEach(t=>t.addEventListener('input',()=>{notes[t.dataset.note]=t.value;localStorage.setItem(notesKey,JSON.stringify(notes));}));}
function openSection(id){if(!DATA.some(g=>g.id===id))id='inicio';document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.id===id));sidebar.classList.remove('open');document.body.classList.toggle('home-mode',id==='inicio');window.scrollTo({top:0,behavior:'smooth'});location.hash=id;document.getElementById('topBtn').style.display=id==='inicio'?'none':'';}
function apiQuery(ref){return ref.replace(/–/g,'-').replace(/\s+a\s+/gi,'-');}
async function openBible(ref){overlay.classList.add('show');bibleTitle.textContent='📖 '+ref;bibleBody.innerHTML='<div class="loading">Carregando o texto bíblico…</div>';const key=apiQuery(ref);if(cache.has(key)){renderBible(cache.get(key));return;}try{const res=await fetch('https://bible-api.com/'+encodeURIComponent(key)+'?translation=almeida');if(!res.ok)throw new Error();const data=await res.json();cache.set(key,data);renderBible(data);}catch(e){bibleBody.innerHTML='<div class="error"><strong>Não foi possível carregar a passagem.</strong><br>Verifique sua conexão com a internet e tente novamente.<br><br><small>Referência: '+esc(ref)+'</small></div>';}}
function renderBible(data){if(!data||!data.verses||!data.verses.length){bibleBody.innerHTML='<div class="error">A API não retornou o texto para esta referência.</div>';return;}bibleBody.innerHTML='<div class="bible-meta">Texto consultado pela Bible-API • tradução Almeida. O PDF original indica Nova Almeida Atualizada.</div>'+data.verses.map(v=>'<div class="verse"><b>'+esc(String(v.verse))+'</b>'+esc(v.text.trim())+'</div>').join('');}
function closeBible(){overlay.classList.remove('show')}document.getElementById('closeBible').addEventListener('click',closeBible);overlay.addEventListener('click',closeBible);document.getElementById('menuBtn').addEventListener('click',()=>sidebar.classList.toggle('open'));document.getElementById('topBtn').addEventListener('click',()=>openSection('inicio'));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBible()});
render();
</script></body></html>
